    legendHtml='<span style="display:inline-flex;align-items:center;gap:3px;color:#0a84ff"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Élec</span><span style="display:inline-flex;align-items:center;gap:3px;color:#ff9f0a;margin-left:10px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Méca</span>';
    const avgE=Math.round((dataElec.filter(Boolean).reduce((a,b)=>a+b,0)||0)/Math.max(1,dataElec.filter(Boolean).length));
    const avgM=Math.round((dataMeca.filter(Boolean).reduce((a,b)=>a+b,0)||0)/Math.max(1,dataMeca.filter(Boolean).length));
    statsHtml=`<div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px"><div style="font-size:15px;font-weight:700;color:#0a84ff">${avgE}</div><div style="font-size:10px;color:var(--sub)">⚡ moy.</div></div><div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px"><div style="font-size:15px;font-weight:700;color:#ff9f0a">${avgM}</div><div style="font-size:10px;color:var(--sub)">🔧 moy.</div></div>`;
  } else if(slideIdx===1){
    datasets=[{label:'Mvts',data:dataMvts,
      borderColor:'#0a84ff',backgroundColor:isLine?'#0a84ff18':'#0a84ff99',
      borderWidth:isLine?1.8:0,borderRadius:isLine?0:3,
      tension:0,pointRadius:0,spanGaps:true,fill:isLine}];
    legendHtml='<span style="display:inline-flex;align-items:center;gap:3px;color:#f5f5f7"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 16V4m0 0L3 8m4-4 4 4"/><path d="M17 8v12m0 0 4-4m-4 4-4-4"/></svg> Mouvements</span>';
    const total=(dataMvts.filter(Boolean).reduce((a,b)=>a+b,0)||0);
    const maxMvt=Math.max(...(dataMvts.filter(Boolean)||[0]));
    statsHtml=`<div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px"><div style="font-size:15px;font-weight:700;color:#f5f5f7">${Math.round(total)}</div><div style="font-size:10px;color:var(--sub)">↕ total</div></div><div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px"><div style="font-size:15px;font-weight:700;color:var(--ink)">${maxMvt}</div><div style="font-size:10px;color:var(--sub)">↕ max</div></div>`;
  } else {
    const soldeColors=dataSolde.map(v=>(v||0)>=0?'#34c75999':'#ff453a99');
    const soldeBorders=dataSolde.map(v=>(v||0)>=0?'#34c759':'#ff453a');
    datasets=[{label:'Solde',data:dataSolde,
      backgroundColor:isLine?'transparent':soldeColors,
      borderColor:isLine?soldeBorders:'transparent',
      segment:{borderColor:ctx=>dataSolde[ctx.p0DataIndex]>=0?'#34c759':'#ff453a'},
      borderWidth:isLine?1.8:0,borderRadius:isLine?0:3,
      tension:0,pointRadius:0,spanGaps:true,fill:false}];
    legendHtml='<span><span style="display:inline-block;width:10px;height:2px;background:#34c759;vertical-align:middle;margin-right:3px;border-radius:1px"></span>Entrées</span><span style="margin-left:10px"><span style="display:inline-block;width:10px;height:2px;background:#ff453a;vertical-align:middle;margin-right:3px;border-radius:1px"></span>Sorties</span>';
    const bilan=(dataSolde.filter(Boolean).reduce((a,b)=>a+b,0)||0);
    statsHtml=`<div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px"><div style="font-size:15px;font-weight:700;color:${bilan>=0?'#34c759':'#ff453a'}">${bilan>=0?'+':''}${Math.round(bilan)}</div><div style="font-size:10px;color:var(--sub)">⚖️ bilan</div></div>`;
  }

  const legendEl=document.getElementById('sd-legend-'+number);
  const statsEl=document.getElementById('sd-stats-row');
  if(legendEl) legendEl.innerHTML=legendHtml;
  if(statsEl) statsEl.innerHTML=statsHtml;

  if(!cvs) return;
  _chartSD_elec=new Chart(cvs,{type:isLine?'line':'bar',
    data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(28,28,30,.92)',titleColor:'#f5f5f7',bodyColor:'#8e8e93',padding:8,cornerRadius:8}},
      scales:{
        x:{ticks:{color:'#636366',font:{size:9},maxTicksLimit:view==='day'?8:12},grid:{display:false},border:{display:false}},
        y:{ticks:{color:'#636366',font:{size:9},maxTicksLimit:4},grid:{color:'rgba(255,255,255,.05)'},border:{display:false}}
      }
    }
  });
}

function filterLbTable(q){
  q=(q||'').toLowerCase().trim();
  const rows=document.querySelectorAll('#lb-body tr');
  rows.forEach(row=>{
    const name=(row.querySelector('td:nth-child(2)')?.textContent||'').toLowerCase();
    row.style.display=(!q||name.includes(q))?'':'none';
  });
}

function setModeNow(){
  const sl=document.getElementById('toggle-slider');
  if(sl) sl.style.transform='translateX(0)';
  document.getElementById('btn-now').style.color='var(--blue)';
  document.getElementById('btn-plan').style.color='var(--sub)';
  document.getElementById('plan-params').style.display='none';
  window._planMode='now';
}
function setModePlan(){
  const sl=document.getElementById('toggle-slider');
  if(sl){
    const w=document.getElementById('btn-now').offsetWidth;
    sl.style.transform=`translateX(${w}px)`;
    sl.style.width=document.getElementById('btn-plan').offsetWidth+'px';
  }
  document.getElementById('btn-now').style.color='var(--sub)';
  document.getElementById('btn-plan').style.color='var(--blue)';
  document.getElementById('plan-params').style.display='';
  window._planMode='plan';
}
window._planMode='now';

function setBikeType(t){
  document.getElementById('plan-type').value = t;
  const pos = t==='meca' ? 1 : 0;
  ['type-slider','type-slider-now'].forEach(id=>{
    const sl = document.getElementById(id);
    if(sl) sl.style.transform = `translateX(${pos*100}%)`;
  });
  ['elec','meca'].forEach(v=>{
    document.querySelectorAll(`[onclick="setBikeType('${v}')"]`).forEach(btn=>{
      btn.style.color = v===t ? 'var(--blue)' : 'var(--sub)';
    });
  });
}

function swapPlanFromTo(){
  const fromEl = document.getElementById('plan-from');
  const toEl   = document.getElementById('plan-to');
  const tmpVal = fromEl.value;
  fromEl.value = toEl.value;
  toEl.value   = tmpVal;
  // Inverser aussi les positions et stations fixes
  const tmpPos   = planFromPos;   planFromPos   = planToPos;   planToPos   = tmpPos;
  const tmpFixed = planFromFixed; planFromFixed = planToFixed; planToFixed = tmpFixed;
}

function syncHourSelect(){
  const t=document.getElementById('plan-hour-time')?.value||'00:00';
  const h=parseInt(t.split(':')[0]);
  const sel=document.getElementById('plan-hour');
  if(sel) sel.value=String(h);
}


function hideBackgroundStations(){
  if(markers && map && map.hasLayer(markers)){
    map.removeLayer(markers);
    window._stationsHidden=true;
  }
}

function showBackgroundStations(){
  if(markers && map && !map.hasLayer(markers)){
    map.addLayer(markers);
  }
  window._stationsHidden=false;
}

function closePlanFloat(){
  // Reset tout
  const pf=document.getElementById('plan-float');
  const expanded=document.getElementById('plan-float-expanded');
  const compact=document.getElementById('plan-float-compact');
  const results=document.getElementById('plan-results');
  // Vider résultats
  if(results) results.innerHTML='';
  // Masquer compact, montrer expanded
  if(compact) compact.style.display='none';
  if(expanded) expanded.style.display='block';
  // Remettre hauteur initiale
  if(pf){ pf.style.maxHeight='250px'; pf.style.opacity='1'; pf.style.pointerEvents=''; }
  // Effacer routes
  if(planLayerGroup){ planLayerGroup.clearLayers(); }
  // Restaurer stations
  showBackgroundStations();
  // Reset état interne
  window._planCombos=null;
  window._openComboIdx=null;
  _openComboIdx=null;
  // Vider les champs
  const fromEl=document.getElementById('plan-from');
  const toEl=document.getElementById('plan-to');
  if(fromEl) fromEl.value='';
  if(toEl) toEl.value='';
  window._planFromPos=null;
  window._planToPos=null;
}

function initPillSwipe(){
  const pill=document.getElementById('plan-float-compact');
  if(!pill||pill._swipeInit) return;
  pill._swipeInit=true;
  let sx=null,dragged=false;
  const go=(dir)=>{
    const cur=window._openComboIdx??0;
    const n=Math.max(0,Math.min((window._planCombos?.length||1)-1,cur+dir));
    if(n!==cur) selectComboIdx(n);
  };
  pill.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dragged=false;},{passive:true});
  pill.addEventListener('touchmove',e=>{if(sx!==null&&Math.abs(e.touches[0].clientX-sx)>8){dragged=true;e.stopPropagation();}},{passive:true});
  pill.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(dragged&&Math.abs(dx)>30){go(dx<0?1:-1);e.stopPropagation();}
    else if(!dragged){expandPlanFloat();}
    sx=null;dragged=false;
  });
}



function initSliderSwipe(){
  const track=document.getElementById('combo-slider-track');
  if(!track||track._swipeInit) return;
  track._swipeInit=true;
  let sx=null,dragged=false;
  const go=(dir)=>{
    const cur=window._openComboIdx??0;
    const n=Math.max(0,Math.min((window._planCombos?.length||1)-1,cur+dir));
    if(n!==cur) selectComboIdx(n);
  };
  track.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dragged=false;},{passive:true});
  track.addEventListener('touchmove',e=>{if(sx!==null&&Math.abs(e.touches[0].clientX-sx)>8)dragged=true;},{passive:true});
  track.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(dragged&&Math.abs(dx)>30)go(dx<0?1:-1);
    sx=null;dragged=false;
  });
  let md=false,mx=0;
  track.addEventListener('mousedown',e=>{md=true;mx=e.clientX;dragged=false;});
  window.addEventListener('mouseup',e=>{
    if(!md)return;md=false;
    const dx=e.clientX-mx;
    if(Math.abs(dx)>30)go(dx<0?1:-1);
  });
}

/* ═══ BOOT ════════════════════════════════════════════ */
async function boot(){
  initRanges();
  allStations=await loadLatest(); window._lastStationUpdate=Date.now(); updateLiveStatus();
  await computeMovements();
  initMap();
  renderStations();
  initPlanMap();
}
boot();
setInterval(async()=>{ allStations=await loadLatest(); window._lastStationUpdate=Date.now(); updateLiveStatus(); await computeMovements(); renderStations(); },2*60*1000);
</script>
