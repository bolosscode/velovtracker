<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vélo'v Lyon</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f5f7;
  --paper:#fff;
  --ink:#1d1d1f;
  --sub:#6e6e73;
  --dim:#aeaeb2;
  --border:#d2d2d7;
  --border-l:#e5e5ea;
  --blue:#0071e3;
  --green:#28cd41;
  --orange:#ff9f0a;
  --red:#ff3b30;
  --sh:0 1px 4px rgba(0,0,0,.08);
  --sh-md:0 4px 20px rgba(0,0,0,.10);
  --r:12px;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:14px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:300;
  height:52px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-l);
}

.brand{
  font-size:17px;
  font-weight:700;
}

.brand em{
  color:var(--blue);
  font-style:normal;
}

.hd-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.live-pill{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:20px;
  background:#fff;
  border:1px solid var(--border);
  font-size:11px;
}

.live-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
}

.hd-clock{
  font-size:12px;
  color:var(--dim);
}

/* NAV */
nav{
  position:sticky;
  top:52px;
  z-index:200;
  background:#fff;
  border-bottom:1px solid var(--border-l);
  display:flex;
  padding:0 24px;
}

.tab{
  padding:14px 18px;
  cursor:pointer;
  color:var(--sub);
  border-bottom:2px solid transparent;
}

.tab.on{
  color:var(--blue);
  border-bottom-color:var(--blue);
}

/* MAIN */
main{
  max-width:1400px;
  margin:auto;
  padding:20px 24px 60px;
}

.panel{
  display:none;
}

.panel.on{
  display:block;
}

.card{
  background:#fff;
  border-radius:var(--r);
  box-shadow:var(--sh);
  padding:20px;
  margin-bottom:16px;
}

.card-title{
  font-size:11px;
  text-transform:uppercase;
  color:var(--sub);
  margin-bottom:14px;
}

/* MAP */
#map{
  height:calc(100vh - 130px);
  min-height:500px;
  border-radius:var(--r);
  box-shadow:var(--sh-md);
}

/* SEARCH */
.st-search-wrap{
  position:relative;
  margin-bottom:14px;
}

.st-search{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:14px;
}

.st-dropdown{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--sh-md);
  z-index:100;
  max-height:260px;
  overflow-y:auto;
  display:none;
}

.st-dropdown.open{
  display:block;
}

.st-opt{
  padding:10px 14px;
  cursor:pointer;
}

.st-opt:hover{
  background:#f0f7ff;
}

/* RANGE */
.range-picker{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.range-picker input{
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
}

.range-shortcuts{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.range-sc{
  padding:5px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:#fff;
  cursor:pointer;
  font-size:11px;
}

/* HEATMAP */
.hmap-grid{
  display:grid;
  grid-template-columns:80px repeat(24,1fr);
  gap:2px;
  min-width:560px;
}

.hmap-h{
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  color:var(--dim);
}

.hmap-label{
  font-size:10px;
  display:flex;
  align-items:center;
}

.hmap-cell{
  height:24px;
  border-radius:2px;
}

.hmap-scroll{
  overflow-x:auto;
}

/* MISC */
.loader{
  padding:40px;
  text-align:center;
  color:var(--dim);
}

.no-data{
  padding:40px;
  text-align:center;
  color:var(--dim);
}

.err{
  background:#ffeaea;
  border:1px solid #ffcaca;
  color:#d10000;
  padding:14px;
  border-radius:12px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Vélo<em>'</em>v Lyon</div>

  <div class="hd-right">
    <div class="live-pill">
      <div class="live-dot"></div>
      <span id="src-tag">Grand Lyon</span>
    </div>

    <div class="hd-clock" id="clock"></div>
  </div>
</header>

<nav>
  <div class="tab on" data-tab="carte">🗺 Carte</div>
  <div class="tab" data-tab="courbes">📈 Courbes</div>
  <div class="tab" data-tab="heatmap">🌡 Heatmap</div>
</nav>

<main>

<!-- CARTE -->
<div class="panel on" id="tab-carte">
  <div id="map"></div>
</div>

<!-- COURBES -->
<div class="panel" id="tab-courbes">

  <div class="card">

    <div class="card-title">
      Station & période
    </div>

    <div class="st-search-wrap">
      <input
        class="st-search"
        id="search-courbes"
        type="text"
        placeholder="Chercher une station…"
        autocomplete="off"
      >

      <div class="st-dropdown" id="dd-courbes"></div>
    </div>

    <div class="range-picker">
      <label>Du</label>
      <input type="datetime-local" id="rc-start">

      <label>au</label>
      <input type="datetime-local" id="rc-end">
    </div>

    <div class="range-shortcuts">
      <button class="range-sc" onclick="shortcut(1)">1h</button>
      <button class="range-sc" onclick="shortcut(6)">6h</button>
      <button class="range-sc" onclick="shortcut(24)">24h</button>
      <button class="range-sc" onclick="shortcut(168)">1 sem</button>
      <button class="range-sc" onclick="shortcut(720)">1 mois</button>
      <button class="range-sc" onclick="shortcut(8760)">1 an</button>
    </div>

  </div>

  <div id="courbes-content">
    <div class="no-data">
      Sélectionnez une station.
    </div>
  </div>

</div>

<!-- HEATMAP -->
<div class="panel" id="tab-heatmap">
  <div id="heatmap-content">
    <div class="no-data">
      Sélectionnez une station.
    </div>
  </div>
</div>

</main>

<script>
'use strict';

/* STATE */
let allStations = [];
let mapInst = null;
let markerLayer = null;

let selCourbes = null;
let selHeatmap = null;

let chartElec = null;
let chartMeca = null;
let chartFlux = null;

const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const ORDER = [1,2,3,4,5,6,0];

const fmt = d => d.toISOString().slice(0,16);

/* CLOCK */
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR');
}, 1000);

/* TABS */
document.querySelectorAll('.tab').forEach(tab => {

  tab.onclick = () => {

    const t = tab.dataset.tab;

    document.querySelectorAll('.tab')
      .forEach(x => x.classList.remove('on'));

    document.querySelectorAll('.panel')
      .forEach(x => x.classList.remove('on'));

    tab.classList.add('on');

    document.getElementById(`tab-${t}`)
      .classList.add('on');

    if (t === 'carte' && mapInst) {
      mapInst.invalidateSize();
    }

  };

});

/* HELPERS */
function cleanName(n){
  return n.replace(/^\d+\s*[-–]\s*/, '').trim();
}

function stationColor(st){

  if (!st.bike_stands || st.available_bikes === 0) {
    return '#ff3b30';
  }

  return st.available_bikes / st.bike_stands <= .25
    ? '#ff9f0a'
    : '#28cd41';
}

function heatColor(pct){

  const t = Math.max(0, Math.min(1, pct / 100));

  if (t < .5) {
    return `rgba(255,${Math.round(59+t*2*(159-59))},48,.72)`;
  }

  const u = (t-.5)*2;

  return `rgba(${Math.round(255-u*(255-40))},${Math.round(159+u*(205-159))},${Math.round(48+u*(65-48))},.72)`;
}

function chartDefs(){

  return {
    responsive:true,
    scales:{
      x:{
        ticks:{maxTicksLimit:14}
      },
      y:{
        min:0
      }
    }
  };

}

/* DATA */
function parseStation(r){

  let elec = 0;
  let meca = 0;

  try{

    const raw = r.main_stands || r.overflow_stands || '';

    if(raw){

      const s = (typeof raw === 'string'
        ? raw
        : JSON.stringify(raw))
        .replace(/'/g,'"');

      const d = JSON.parse(s);

      elec = d?.availabilities?.electricalBikes ?? 0;

      meca = d?.availabilities?.mechanicalBikes
        ?? (r.available_bikes || 0);

    }

  }catch{}

  return {
    number:r.number,
    name:r.name || '',
    available_bikes:r.available_bikes || 0,
    available_bike_stands:r.available_bike_stands || 0,
    bike_stands:r.bike_stands || 0,
    electrical_bikes:elec,
    mechanical_bikes:meca,
    lat:r.lat,
    lng:r.lng,
  };

}

async function loadLatest(){

  try{

    const r = await fetch(
      'https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1'
    );

    const data = await r.json();

    document.getElementById('src-tag').textContent =
      '⚡ Temps réel';

    return (data.values || []).map(parseStation);

  }catch{

    const r = await fetch('data/latest.json');

    const snap = await r.json();

    document.getElementById('src-tag').textContent =
      '📦 Cache';

    return snap.stations || [];

  }

}

async function fetchDay(date){

  try{

    const r = await fetch(`data/history/${date}.json`);

    return r.ok ? r.json() : null;

  }catch{

    return null;

  }

}

async function fetchRange(startMs, endMs){

  const start = new Date(startMs);
  const end = new Date(endMs);

  const days = (endMs - startMs) / 86400e3;

  const dates = new Set();

  for(let i=0;i<=Math.ceil(days);i++){

    const d = new Date(start);

    d.setDate(d.getDate() + i);

    dates.add(d.toISOString().slice(0,10));

  }

  dates.add(end.toISOString().slice(0,10));

  const results = await Promise.all(
    [...dates].map(fetchDay)
  );

  const all = [];

  results.forEach(snaps => {

    if(snaps?.length){
      all.push(...snaps);
    }

  });

  all.forEach(snap => {

    if(!snap.timestamp && snap.last_update){
      snap.timestamp = snap.last_update;
    }

  });

  return all.filter(snap => {

    const t = new Date(snap.timestamp).getTime();

    return t >= startMs && t <= endMs;

  });

}

function getStationsFromSnapshot(snap){

  if(Array.isArray(snap)){
    return snap;
  }

  if(Array.isArray(snap.stations)){
    return snap.stations;
  }

  return [];

}

/* MAP */
function initMap(){

  mapInst = L.map('map')
    .setView([45.757,4.832],13);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
      attribution:'© OpenStreetMap © CARTO',
      maxZoom:19
    }
  ).addTo(mapInst);

}

function renderMarkers(){

  if(markerLayer){
    markerLayer.clearLayers();
  }

  markerLayer = L.layerGroup().addTo(mapInst);

  allStations.forEach(st => {

    if(!st.lat || !st.lng){
      return;
    }

    const m = L.circleMarker(
      [st.lat, st.lng],
      {
        radius:8,
        fillColor:stationColor(st),
        color:'#fff',
        fillOpacity:.9,
        weight:1.5
      }
    );

    m.bindPopup(`
      <b>${cleanName(st.name)}</b><br><br>
      ⚡ Électriques : ${st.electrical_bikes}<br>
      🔧 Mécaniques : ${st.mechanical_bikes}<br>
      🚲 Total : ${st.available_bikes}
    `);

    markerLayer.addLayer(m);

  });

}

/* SEARCH */
function buildDropdown(inputId, ddId, onSelect){

  const input = document.getElementById(inputId);
  const dd = document.getElementById(ddId);

  input.addEventListener('input', () => {

    const q = input.value.toLowerCase().trim();

    const matches = allStations
      .filter(s => cleanName(s.name).toLowerCase().includes(q))
      .slice(0,12);

    dd.innerHTML = '';

    if(!matches.length || !q){

      dd.classList.remove('open');
      return;

    }

    matches.forEach(s => {

      const el = document.createElement('div');

      el.className = 'st-opt';

      el.textContent = cleanName(s.name);

      el.onclick = () => {

        input.value = cleanName(s.name);

        dd.classList.remove('open');

        onSelect(s);

      };

      dd.appendChild(el);

    });

    dd.classList.add('open');

  });

}

/* RANGE */
function getRange(){

  const s = document.getElementById('rc-start').value;
  const e = document.getElementById('rc-end').value;

  if(!s || !e){
    return null;
  }

  return {
    startMs:new Date(s).getTime(),
    endMs:new Date(e).getTime()
  };

}

function shortcut(hours){

  const now = new Date();

  const start = new Date(now - hours * 3600e3);

  document.getElementById('rc-start').value = fmt(start);

  document.getElementById('rc-end').value = fmt(now);

  if(selCourbes){
    renderCourbes();
  }

  if(selHeatmap){
    renderHeatmap();
  }

}

function initRanges(){

  const now = new Date();

  document.getElementById('rc-start').value =
    fmt(new Date(now - 24*3600e3));

  document.getElementById('rc-end').value =
    fmt(now);

}

/* COURBES */
buildDropdown(
  'search-courbes',
  'dd-courbes',
  st => {

    selCourbes = st;
    selHeatmap = st;

    renderCourbes();
    renderHeatmap();

  }
);

document.getElementById('rc-start')
  .addEventListener('change', () => {

    if(selCourbes){
      renderCourbes();
      renderHeatmap();
    }

  });

document.getElementById('rc-end')
  .addEventListener('change', () => {

    if(selCourbes){
      renderCourbes();
      renderHeatmap();
    }

  });

async function renderCourbes(){

  const content =
    document.getElementById('courbes-content');

  if(!selCourbes){
    return;
  }

  content.innerHTML =
    '<div class="loader">Chargement…</div>';

  const range = getRange();

  if(!range){

    content.innerHTML =
      '<div class="no-data">Choisissez une période.</div>';

    return;

  }

  const snaps = await fetchRange(
    range.startMs,
    range.endMs
  );

  if(!snaps.length){

    content.innerHTML =
      '<div class="no-data">Aucune donnée.</div>';

    return;

  }

  const id = selCourbes.number;

  const labels = [];
  const dataElec = [];
  const dataMeca = [];
  const dataFlux = [];

  snaps.forEach((snap, i) => {

    const stations = getStationsFromSnapshot(snap);

    const st = stations.find(
      s => s.number === id
    );

    const t = new Date(snap.timestamp);

    labels.push(
      t.toLocaleString('fr-FR')
    );

    dataElec.push(st?.electrical_bikes ?? null);

    dataMeca.push(st?.mechanical_bikes ?? null);

    if(i === 0){

      dataFlux.push(0);
      return;

    }

    const prevStations =
      getStationsFromSnapshot(snaps[i-1]);

    const prev =
      prevStations.find(s => s.number === id);

    const delta =
      (st && prev)
      ? st.available_bikes - prev.available_bikes
      : 0;

    dataFlux.push(delta < 0 ? Math.abs(delta) : 0);

  });

  content.innerHTML = `
    <div class="card">
      <div class="card-title">⚡ Vélos électriques</div>
      <canvas id="c-elec"></canvas>
    </div>

    <div class="card">
      <div class="card-title">🔧 Vélos mécaniques</div>
      <canvas id="c-meca"></canvas>
    </div>

    <div class="card">
      <div class="card-title">↕ Départs estimés</div>
      <canvas id="c-flux"></canvas>
    </div>
  `;

  if(chartElec) chartElec.destroy();
  if(chartMeca) chartMeca.destroy();
  if(chartFlux) chartFlux.destroy();

  chartElec = new Chart(
    document.getElementById('c-elec'),
    {
      type:'line',
      data:{
        labels,
        datasets:[{
          label:'Électriques',
          data:dataElec
        }]
      },
      options:chartDefs()
    }
  );

  chartMeca = new Chart(
    document.getElementById('c-meca'),
    {
      type:'line',
      data:{
        labels,
        datasets:[{
          label:'Mécaniques',
          data:dataMeca
        }]
      },
      options:chartDefs()
    }
  );

  chartFlux = new Chart(
    document.getElementById('c-flux'),
    {
      type:'bar',
      data:{
        labels,
        datasets:[{
          label:'Départs',
          data:dataFlux
        }]
      },
      options:chartDefs()
    }
  );

}

/* HEATMAP */
async function renderHeatmap(){

  const content =
    document.getElementById('heatmap-content');

  if(!selHeatmap){
    return;
  }

  content.innerHTML =
    '<div class="loader">Calcul…</div>';

  const range = getRange();

  if(!range){

    content.innerHTML =
      '<div class="no-data">Choisissez une période.</div>';

    return;

  }

  const snaps = await fetchRange(
    range.startMs,
    range.endMs
  );

  if(!snaps.length){

    content.innerHTML =
      '<div class="no-data">Aucune donnée.</div>';

    return;

  }

  const id = selHeatmap.number;

  const bk = {
    elec:Array.from({length:7},
      () => Array.from({length:24}, () => [])
    ),

    meca:Array.from({length:7},
      () => Array.from({length:24}, () => [])
    )
  };

  snaps.forEach(snap => {

    const stations =
      getStationsFromSnapshot(snap);

    const st = stations.find(
      s => s.number === id
    );

    if(!st || !st.bike_stands){
      return;
    }

    const t = new Date(snap.timestamp);

    const hour = t.getHours();

    const dow = t.getDay();

    bk.elec[dow][hour].push(
      (st.electrical_bikes || 0)
      / st.bike_stands * 100
    );

    bk.meca[dow][hour].push(
      (st.mechanical_bikes || 0)
      / st.bike_stands * 100
    );

  });

  function mkGrid(grid){

    let h =
      '<div class="hmap-grid"><div class="hmap-h"></div>';

    for(let i=0;i<24;i++){

      h += `<div class="hmap-h">${i}</div>`;

    }

    ORDER.forEach(d => {

      h += `<div class="hmap-label">${DAYS[d]}</div>`;

      for(let i=0;i<24;i++){

        const vals = grid[d][i];

        if(!vals.length){

          h += '<div class="hmap-cell" style="background:#f0f0f5"></div>';

        }else{

          const avg =
            vals.reduce((a,b)=>a+b,0)
            / vals.length;

          h += `
            <div
              class="hmap-cell"
              style="background:${heatColor(avg)}"
              title="${Math.round(avg)}%"
            ></div>
          `;

        }

      }

    });

    return h + '</div>';

  }

  content.innerHTML = `
    <div class="card">

      <div style="margin-bottom:28px">
        <div class="card-title">
          ⚡ Électriques
        </div>

        <div class="hmap-scroll">
          ${mkGrid(bk.elec)}
        </div>
      </div>

      <div>
        <div class="card-title">
          🔧 Mécaniques
        </div>

        <div class="hmap-scroll">
          ${mkGrid(bk.meca)}
        </div>
      </div>

    </div>
  `;

}

/* BOOT */
async function boot(){

  initRanges();

  try{

    allStations = await loadLatest();

    initMap();

    renderMarkers();

  }catch(e){

    document.getElementById('tab-carte').innerHTML =
      `<div class="err">${e.message}</div>`;

  }

}

boot();
</script>

</body>
</html>
