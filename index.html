}

async function showStationDetail(number, targetEl=null){
  await ensureChartJs();
  const st=allStations.find(s=>s.number===number);
  if(!st) return;
  document.querySelectorAll('#lb-body tr').forEach(r=>r.style.background='');
  const row=document.getElementById('lb-row-'+number);
  if(row) row.style.background='rgba(255,255,255,.06)';
  const detail=targetEl || document.getElementById('stats-detail');
  const view=document.getElementById('lb-view')?.value||'day';
  const isMob=window.innerWidth<=640;
  if(window._chartSD_elec){ try{window._chartSD_elec.destroy();}catch{} window._chartSD_elec=null; }
  const oldCvs=document.getElementById('sd-combined-'+number);
  if(oldCvs){ const ex=Chart.getChart(oldCvs); if(ex) ex.destroy(); }
  detail.innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
    '<div style="min-width:0"><div style="font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+cleanName(st.name)+'</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:-1px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'+st.electrical_bikes+' · <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:inline;vertical-align:-1px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>'+st.mechanical_bikes+' · 🅿️'+st.available_bike_stands+'</div></div></div>'+
    '<div id="sd-tabs-'+number+'" style="display:flex;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.06);border-radius:20px;padding:2px;position:relative;margin-bottom:8px">'+
    '<div id="sd-thumb-'+number+'" style="position:absolute;top:2px;left:2px;height:calc(100% - 4px);width:33.33%;background:rgba(255,255,255,.18);border:0.5px solid rgba(255,255,255,.2);border-radius:18px;transition:transform .18s;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)"></div>'+
    '<div class="sd-tab on" onclick="renderSDSlide(0,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:#fff;cursor:pointer;position:relative;z-index:1">Vélos</div>'+
    '<div class="sd-tab" onclick="renderSDSlide(1,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;position:relative;z-index:1">Mvts</div>'+
    '<div class="sd-tab" onclick="renderSDSlide(2,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;position:relative;z-index:1">Solde</div>'+
    '</div>'+
    '<div id="sd-legend-'+number+'" style="display:flex;gap:10px;font-size:10px;color:rgba(255,255,255,.55);margin-bottom:4px"></div>'+
    '<div style="position:relative;height:'+(isMob?130:160)+'px;margin:0 -14px;width:calc(100% + 28px)"><canvas id="sd-combined-'+number+'" style="position:absolute;inset:0;width:100%!important;height:100%!important"></canvas></div>'+
    '<div id="sd-dots-'+number+'" style="display:flex;justify-content:center;gap:4px;padding:6px 0 2px">'+
    '<div style="height:3px;width:14px;border-radius:2px;background:#34c759;display:inline-block;transition:all .2s"></div>'+
    '<div style="height:3px;width:5px;border-radius:2px;background:#38383a;display:inline-block;transition:all .2s"></div>'+
    '<div style="height:3px;width:5px;border-radius:2px;background:#38383a;display:inline-block;transition:all .2s"></div>'+
    '</div>'+
    '<div id="sd-stats-row" style="display:flex;gap:8px;margin-top:6px"></div>';

  const d=document.getElementById('lb-date').value;
  const mth=document.getElementById('lb-month')?.value;
  const yr=document.getElementById('lb-year')?.value;

  async function loadSnapsByDate(dates){
    const BATCH=16,result=[];
    for(let i=0;i<dates.length;i+=BATCH){
      const batch=dates.slice(i,i+BATCH);
      const res=await Promise.all(batch.map(dt=>fetchDay(dt).catch(()=>null)));
      res.forEach((snaps,j)=>{ if(snaps) result.push({date:batch[j],snaps}); });
    }
    return result;
  }

  let labels=[],dataElec=[],dataMeca=[],dataMvts=[],dataSolde=[];

  if(view==='day'){
    if(!d) return;
    const snaps=await fetchDay(d)||[];
    let prevT=null;
    snaps.forEach(snap=>{
      const sts=getSts(snap),st2=sts.find(x=>x.number===number); if(!st2) return;
      const t=new Date(getTs(snap));
      labels.push(t.getMinutes()===0?t.getHours()+'h':'');
      dataElec.push(st2.electrical_bikes||0);
      dataMeca.push(st2.mechanical_bikes||0);
      const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
      if(prevT!==null){ dataMvts.push(Math.abs(tot-prevT)); dataSolde.push(tot-prevT); }
      else { dataMvts.push(0); dataSolde.push(0); }
      prevT=tot;
    });
  } else if(view==='month'){
    if(!mth) return;
    const [y,mo]=mth.split('-').map(Number);
    const daysInMonth=new Date(y,mo,0).getDate();
    const today=localDateStr();
    const dates=[];
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(ds<=today) dates.push(ds);
    }
    const loaded=await loadSnapsByDate(dates);
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      labels.push(day+'');
      const entry=loaded.find(x=>x.date===ds);
      if(!entry){ dataElec.push(null);dataMeca.push(null);dataMvts.push(null);dataSolde.push(null);continue; }
      let eSum=0,mSum=0,cnt=0,mvtsSum=0,ent=0,sor=0,prevS=null;
      entry.snaps.forEach(snap=>{
        const st2=getSts(snap).find(x=>x.number===number); if(!st2) return;
        eSum+=st2.electrical_bikes||0; mSum+=st2.mechanical_bikes||0; cnt++;
        const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
        if(prevS!==null){ const dd=tot-prevS; mvtsSum+=Math.abs(dd); if(dd>0)ent+=dd; else sor+=dd; }
        prevS=tot;
      });
      dataElec.push(cnt?Math.round(eSum/cnt):null);
      dataMeca.push(cnt?Math.round(mSum/cnt):null);
      dataMvts.push(Math.round(mvtsSum));
      dataSolde.push(ent+sor);
    }
  } else {
    if(!yr) return;
    const today=localDateStr();
    const MONTHS=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
    const allDatesYear=[];
    for(let mo=1;mo<=12;mo++) for(let day=1;day<=new Date(yr,mo,0).getDate();day++){
      const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(ds<=today) allDatesYear.push(ds);
    }
    const allLoadedYear=await loadSnapsByDate(allDatesYear);
    const byDate={};
    allLoadedYear.forEach(({date,snaps})=>{ byDate[date]={snaps}; });
    for(let mo=1;mo<=12;mo++){
      labels.push(MONTHS[mo-1]);
      const daysInM=new Date(yr,mo,0).getDate();
      const mDates=[];
      for(let day=1;day<=daysInM;day++){
        const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        if(ds<=today) mDates.push(ds);
      }
      if(!mDates.length){ dataElec.push(null);dataMeca.push(null);dataMvts.push(null);dataSolde.push(null);continue; }
      const loaded=mDates.map(ds=>byDate[ds]).filter(Boolean);
      let eSum=0,mSum=0,cnt=0,mvtsT=0,soldeT=0;
      loaded.forEach(({snaps})=>{
        let prevS=null;
        snaps.forEach(snap=>{
          const st2=getSts(snap).find(x=>x.number===number); if(!st2) return;
          eSum+=st2.electrical_bikes||0; mSum+=st2.mechanical_bikes||0; cnt++;
          const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
          if(prevS!==null){ const dd=tot-prevS; mvtsT+=Math.abs(dd); soldeT+=dd; }
          prevS=tot;
        });
      });
      dataElec.push(cnt?Math.round(eSum/cnt):null);
      dataMeca.push(cnt?Math.round(mSum/cnt):null);
      dataMvts.push(Math.round(mvtsT/Math.max(1,loaded.length)));
      dataSolde.push(Math.round(soldeT/Math.max(1,loaded.length)));
    }
  }

  window._sdData={labels,dataElec,dataMeca,dataMvts,dataSolde,number,view};
  window._sdSlide=0;
  renderSDSlide(0,number);
} // fin showStationDetail

function renderSDSlide(slideIdx,number){
  window._sdSlide=slideIdx;
  const {labels,dataElec,dataMeca,dataMvts,dataSolde,view}=window._sdData||{};
  if(!labels) return;
  const isLine=view==='day';
  if(window._chartSD_elec){ try{window._chartSD_elec.destroy();}catch{} window._chartSD_elec=null; }
  const cvs=document.getElementById('sd-combined-'+number);
  if(cvs){ const ex=Chart.getChart(cvs); if(ex) ex.destroy(); }
  const tabsCont=document.getElementById('sd-tabs-'+number);
  if(tabsCont){
    [...tabsCont.children].forEach((t,i)=>{ if(t.id&&t.id.startsWith('sd-thumb')) return; t.classList.toggle('on',i-1===slideIdx); t.style.color=i-1===slideIdx?'#f5f5f7':'var(--sub)'; });
    const thumb=document.getElementById('sd-thumb-'+number);
    if(thumb) thumb.style.transform=`translateX(${slideIdx*100}%)`;
  }
  const dotsCont=document.getElementById('sd-dots-'+number);
  if(dotsCont) [...dotsCont.children].forEach((d,i)=>{ d.style.width=i===slideIdx?'14px':'5px'; d.style.background=i===slideIdx?'#34c759':'#38383a'; });
  let datasets=[],legendHtml='',statsHtml='';
  if(slideIdx===0){
    datasets=[
      {label:'Élec',data:dataElec,borderColor:'#0a84ff',backgroundColor:isLine?'#0a84ff18':'#0a84ff88',borderWidth:isLine?1.8:0,borderRadius:2,tension:0,pointRadius:0,spanGaps:true,fill:isLine},

function bikeRecoScore(b){
  if(b.status!=='AVAILABLE'||b.isReserved) return -1;
  const ratingScore=(b.rating?.value??50)/100; // 0-1, défaut neutre si pas noté
  // Fraîcheur révision : 1.0 si <30j, décroît jusqu'à 0 vers 365j
  let freshScore=0.3; // défaut si pas de date connue
  if(b.lastControlDateTime){
    const days=(Date.now()-new Date(b.lastControlDateTime).getTime())/86400000;
    freshScore=Math.max(0,Math.min(1,1-days/365));
  }
  if(b.type==='ELECTRICAL'){
    const battScore=(b.battery?.percentage??0)/100;
    // Batterie pondère fort : un élec à plat n'est pas recommandable même bien noté
    return ratingScore*0.35+freshScore*0.15+battScore*0.5;
  }
  return ratingScore*0.6+freshScore*0.4;
}

function markBestBikes(list){
  const bestElec=list.filter(b=>b.type==='ELECTRICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  const bestMeca=list.filter(b=>b.type==='MECHANICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  return { bestElecId: bestElec&&bikeRecoScore(bestElec)>0?bestElec.id:null, bestMecaId: bestMeca&&bikeRecoScore(bestMeca)>0?bestMeca.id:null };
}

    const popRect=div.getBoundingClientRect();

    if(popRect.top < floatRect.bottom+overlapMargin){
      const shift=(floatRect.bottom+overlapMargin)-popRect.top;
      const currentTop=parseFloat(div.style.top);
      div.style.top=(currentTop+shift)+'px';
    }
  });

  // Fetch live des vélos de cette station (asynchrone, remplit le slot)
  fetchStationBikesLive(s.number).then(bikes=>{
    const slot=document.getElementById('stn-bikes-slot');
    if(!slot) return; // popup fermée entre-temps
    if(!bikes){
      slot.innerHTML='<span style="opacity:.6">Détail vélos indisponible</span>';
      return;
    }
    const list=bikes.filter(b=>b.status!=='REMOVED').sort((a,b)=>{
      if(a.type!==b.type) return a.type==='ELECTRICAL'?-1:1;
      return (b.battery?.percentage||0)-(a.battery?.percentage||0);
    });
    if(!list.length){ slot.innerHTML=''; return; }
    slot.style.textAlign='left'; slot.style.padding='0';
    window._popupBikesList=list;
    const {bestElecId,bestMecaId}=markBestBikes(list);
    slot.innerHTML=list.map((b,i)=>renderBikeRow(b,i,b.id===bestElecId||b.id===bestMecaId)).join('');
    slot.querySelectorAll('.bike-row-live').forEach(el=>{
      el.addEventListener('click', ()=>toggleBikeDetailLive(parseInt(el.dataset.idx)));
    });
    // Recalcule les totaux depuis les données live (plus précis que Grand Lyon)
    const liveElecN=list.filter(b=>b.type==='ELECTRICAL'&&b.status==='AVAILABLE').length;
    const liveMecaN=list.filter(b=>b.type==='MECHANICAL'&&b.status==='AVAILABLE').length;
    const elecEl=document.getElementById('stn-total-elec');
    const mecaEl=document.getElementById('stn-total-meca');
    if(elecEl) elecEl.textContent=liveElecN;
    if(mecaEl) mecaEl.textContent=liveMecaN;

    // Indicateur de scroll custom (les scrollbars overlay macOS/Chrome sont invisibles au repos)
    const track=document.getElementById('stn-scroll-track');
    const thumb=document.getElementById('stn-scroll-thumb');
    if(track&&thumb){
      const updateThumb=()=>{
        const {scrollHeight,clientHeight,scrollTop}=slot;
        if(scrollHeight<=clientHeight+1){ track.style.display='none'; return; }
        track.style.display='block';
        const thumbH=Math.max(20,clientHeight*clientHeight/scrollHeight);
        const maxThumbTop=clientHeight-thumbH;
        const thumbTop=maxThumbTop*(scrollTop/(scrollHeight-clientHeight));
        thumb.style.height=thumbH+'px';
        thumb.style.top=thumbTop+'px';
      };
      updateThumb();
      slot.addEventListener('scroll', updateThumb);
    }
  });

  div.querySelector('#stn-dep-btn')?.addEventListener('click',()=>{
    const {s,lat,lon}=window._popupStation;
    closeStationPopup();
    const depSt=allStations.find(x=>x.number===s.number)||s;
    planFromFixed=depSt; planFromPos={lat,lng:lon};
    window._planFromPos={lat,lng:lon};
    document.getElementById('plan-from').value=cleanName(s.name);
    document.getElementById('plan-from').style.color='';
    expandPlanFloat();
    window._waitingForArr=true;
  });
  div.querySelector('#stn-arr-btn')?.addEventListener('click',()=>{
    const {s,lat,lon}=window._popupStation;
    closeStationPopup();
    const arrSt=allStations.find(x=>x.number===s.number)||s;
    planToFixed=arrSt; planToPos={lat,lng:lon};
    window._planToPos={lat,lng:lon};
    document.getElementById('plan-to').value=cleanName(s.name);
    document.getElementById('plan-to').style.color='';
    window._waitingForArr=false;
    expandPlanFloat();
    setTimeout(()=>computePlan(),200);
  });


}

    const cur=window._openComboIdx??0;
    const n=Math.max(0,Math.min((window._planCombos?.length||1)-1,cur+dir));
    if(n!==cur) selectComboIdx(n);

    if(dragged&&Math.abs(dx)>30)go(dx<0?1:-1);

/* ═══ VÉLOS LIVE (JCDecaux direct, token via data/token.json) ══ */
let _jcdToken = null, _jcdTokenExp = 0;
async function getJcdToken(){
  if(_jcdToken && Date.now() < _jcdTokenExp) return _jcdToken;
  try{
    const r = await fetch(`data/token.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) return null;
    const d = await r.json();
    if(!d.access_token) return null;
    _jcdToken = `${d.token_type||'Taknv1'} ${d.access_token}`;
    // Marge de sécurité : considérer expiré 5 min avant la vraie limite
    const ageMs = Date.now() - new Date(d.updated_at).getTime();
    const remainMs = (d.expires_in||3600)*1000 - ageMs - 5*60*1000;
    _jcdTokenExp = Date.now() + Math.max(0, remainMs);
    return _jcdToken;
  }catch{ return null; }
}

// Chargement global : tous les vélos en 1 appel, indexés par station
let _allBikesByStation = null; // Map<stationNumber, bike[]>
let _allBikesLoadedAt = 0;
let _allBikesLoadingPromise = null;
const ALL_BIKES_REFRESH_MS = 2 * 60 * 1000; // rafraîchir toutes les 2 min

async function loadAllBikesLive(){
  // Évite les chargements concurrents
  if(_allBikesLoadingPromise) return _allBikesLoadingPromise;
  const tok = await getJcdToken();
  if(!tok) return null;
  _allBikesLoadingPromise = (async()=>{
    try{
      const r = await fetch('https://api.cyclocity.fr/contracts/lyon/bikes',{
        headers:{ 'Accept':'application/vnd.bikes.v4+json', 'Authorization':tok }
      });
      if(!r.ok) return null;
      const bikes = await r.json();
      const byStation = new Map();
      for(const b of bikes){
        if(b.status==='REMOVED' || !b.stationNumber) continue;
        if(!byStation.has(b.stationNumber)) byStation.set(b.stationNumber, []);
        byStation.get(b.stationNumber).push(b);
      }
      _allBikesByStation = byStation;
      _allBikesLoadedAt = Date.now();
      window._bikesLiveReady = true;
      return byStation;
    }catch{ return null; }
    finally{ _allBikesLoadingPromise = null; }
  })();
  return _allBikesLoadingPromise;
}

async function ensureAllBikesFresh(){
  if(!_allBikesByStation || Date.now()-_allBikesLoadedAt > ALL_BIKES_REFRESH_MS){
    await loadAllBikesLive();
  }
  return _allBikesByStation;
}

// Rafraîchissement périodique en tâche de fond
setInterval(()=>{ loadAllBikesLive(); }, ALL_BIKES_REFRESH_MS);

// Compat : retourne les vélos d'une station depuis le cache global (jamais de refetch par station)
async function fetchStationBikesLive(stationNumber){
  const byStation = await ensureAllBikesFresh();
  if(!byStation) return null;
  return byStation.get(stationNumber) || [];
}

/* ── Enrichissement itinéraire : liste des vélos de la station départ ── */
async function fetchStationBikes(stationNumber){
  try{
    const bikes=await fetchStationBikesLive(stationNumber);
    if(!bikes) return [];
    return bikes.filter(b=>b.status==='AVAILABLE').map(b=>({
      id: b.number,
      st: b.stationNumber,
      type: b.type==='ELECTRICAL'?'E':'M',
      batt: b.type==='ELECTRICAL'&&b.battery?.percentage!=null
        ? b.battery.percentage
        : null,
      mv: b.battery?.level??null,
      borne: b.standNumber,
      rating: b.rating?.value!=null?b.rating.value/20:null, // 0-100 -> 0-5
      rcount: b.rating?.count||0,
      status: b.isReserved?'S':'A',
    }));
  }catch{ return []; }
}

// 2 vélos recommandés (1 élec + 1 méca), compacts — utilise le même score que le popup station
function renderRecoBikesCompact(bikes){
  if(!bikes.length) return '';
  const toApiShape=b=>({
    type: b.type==='E'?'ELECTRICAL':'MECHANICAL',
    status: b.status==='S'?'RESERVED':'AVAILABLE',
    isReserved: b.status==='S',
    battery: b.batt!=null?{percentage:b.batt}:null,
    rating: b.rating!=null?{value:b.rating*20,count:b.rcount}:null,
    lastControlDateTime: null,
    id:b.id, standNumber:b.borne,
  });
  const shaped=bikes.map(toApiShape);
  const bestElec=shaped.filter(b=>b.type==='ELECTRICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  const bestMeca=shaped.filter(b=>b.type==='MECHANICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  const picks=[bestElec,bestMeca].filter(Boolean);
  if(!picks.length) return '';
  const rows=picks.map(b=>{
    const isElec=b.type==='ELECTRICAL';
    const icon=isElec
      ?'<svg width="8" height="8" viewBox="0 0 24 24" fill="rgba(255,255,255,.8)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'
      :'<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
    const battTxt=isElec&&b.battery?.percentage!=null?`${b.battery.percentage}%`:'';
    return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:8.5px;color:rgba(255,255,255,.5)">${icon}${b.standNumber??'?'}${battTxt?' · '+battTxt:''}</span>`;
  }).join('<span style="color:rgba(255,255,255,.2);margin:0 2px">·</span>');
  return `<div style="margin-top:4px;display:flex;align-items:center;gap:3px">
    <span style="font-size:8px;color:#4ade80">★</span>${rows}
  </div>`;
}

const _comboBikesCache={};
async function loadComboBikes(idx){
  const combo=window._planCombos?.[idx]; if(!combo) return;
  const cacheKey=combo.dep.number+'_'+combo.dist;
  if(_comboBikesCache[cacheKey]) return; // déjà chargé
  const bikes=await fetchStationBikes(combo.dep.number);
  if(!bikes.length) return;
  _comboBikesCache[cacheKey]=bikes;
  // Injecter dans le card actif
  const card=document.querySelector(`.combo-card[data-idx="${idx}"]`);
  if(!card) return;
  const existing=card.querySelector('.combo-bikes-list');
  if(existing) return;
  const bikesList=document.createElement('div');
  bikesList.className='combo-bikes-list';
  bikesList.innerHTML=renderRecoBikesCompact(bikes);
  card.appendChild(bikesList);
}

function walkMinutes(dist){ return Math.max(1, Math.round(dist/1000/5*60)); }
function walkDistM(dist){ return Math.round(dist); }
