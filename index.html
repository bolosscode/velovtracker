<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Vélo'v"/>
<meta name="theme-color" content="#ffffff"/>
<title>Vélo'v Lyon Analytics</title>
<link rel="preconnect" href="https://api.cyclocity.fr" crossorigin>
<link rel="dns-prefetch" href="https://api.cyclocity.fr">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(max-width:640px){
  #stats-layout{grid-template-columns:1fr !important}
  #stats-detail{display:block !important}
  header{height:48px;padding:0 14px}
  .brand{font-size:15px}
  #top-nav{display:none !important}
  #top-nav{display:none !important}

  .card{padding:14px;border:0.5px solid rgba(255,255,255,.1)}
  .loc-row{grid-template-columns:1fr}
  #map{height:100%}

  .params-row{gap:8px}
  .params-row select,.params-row input{font-size:12px;padding:6px 8px}
  #stats-detail{display:none}
  #lb-content{max-height:60vh}
  .combo-card{padding:10px 12px}
  .combo-rank{font-size:18px;min-width:24px}
  .combo-pct{font-size:18px}
}
@media(min-width:641px){
  #bottom-nav{display:none}
  #plan-float{width:calc(100vw / 3 - 20px) !important;right:auto !important}
}
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(12,12,16,.85);backdrop-filter:blur(14px);
  border-top:0.5px solid #38383a;
  display:flex;padding:0;height:60px;
}
#bottom-nav .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:6px 0;
  font-size:18px;font-weight:600;color:#bbb;
  border-bottom:none;border-top:2px solid transparent;
}
#bottom-nav .tab span{font-size:11px;display:block;color:rgba(255,255,255,.55)}
#bottom-nav .tab.on{color:#fff;border-top-color:rgba(255,255,255,.5)}
:root{
  --bg:#0a0a0e;--paper:rgba(12,12,16,.85);--ink:#fff;--sub:rgba(255,255,255,.55);--dim:rgba(255,255,255,.4);
  --border:#38383a;--blue:#f5f5f7;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --radius:14px;--shadow:0 2px 8px rgba(0,0,0,.4);
}
body{background:rgba(12,12,16,.85);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;color-scheme:dark}

header{position:sticky;top:0;z-index:300;height:56px;background:rgba(12,12,16,.85);backdrop-filter:blur(14px);border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:700;font-size:20px;color:#fff}.brand em{color:#fff;font-style:normal}
.clock{font-size:12px;color:rgba(255,255,255,.4)}

nav{position:sticky;top:56px;z-index:250;background:rgba(12,12,16,.85);border-bottom:0.5px solid #38383a;display:flex;padding:0 20px;overflow-x:auto}
nav{position:sticky;top:56px;z-index:250;background:rgba(12,12,16,.85);border-bottom:0.5px solid #38383a;display:flex;padding:0 20px;overflow-x:auto}
.tab.on{color:#fff;border-bottom-color:rgba(255,255,255,.5);background:transparent}

main{max-width:1500px;margin:auto;padding:20px}
.panel{display:none;overflow:hidden}.panel.on{display:block}
.card{background:rgba(12,12,16,.85);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:14px}

#map{height:calc(100vh - 140px);border-radius:var(--radius);overflow:hidden;position:relative;z-index:1}
.map-ctrl{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-btn{padding:6px 14px;border-radius:20px;border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow);font-size:12px;font-weight:600;cursor:pointer;color:rgba(255,255,255,.55);transition:all .15s}
.map-btn.on{background:var(--blue);color:#fff}
.map-rel{position:relative;overflow:hidden}

/* search */
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){
  #stats-layout{grid-template-columns:1fr !important}
  #stats-detail{display:block !important}.loc-row{grid-template-columns:1fr}}
.loc-box{position:relative}
.loc-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.loc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.search{width:100%;padding:10px 12px;border-radius:10px;border:0.5px solid rgba(255,255,255,.12);font-size:13px;outline:none;transition:border-color .15s;color:#fff;}
.search:focus{border-color:var(--blue)}
.dropdown{position:fixed;z-index:9999;background:rgba(12,12,16,.85);border:1px solid rgba(255,255,255,.12);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;max-height:240px;overflow-y:auto;min-width:280px;background:rgba(12,12,16,.85);border:0.5px solid rgba(255,255,255,.12);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:100;max-height:220px;overflow-y:auto}
.dropdown.open{display:block}
.opt{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.opt:last-child{border-bottom:none}
.opt:hover{background:rgba(255,255,255,.1)}
.opt-type{font-size:10px;color:rgba(255,255,255,.4);float:right}

/* params row */
.params-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.params-row label{font-size:11px;font-weight:600;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.params-row select,.params-row input{padding:7px 10px;border-radius:10px;border:0.5px solid rgba(255,255,255,.12);font-size:13px;outline:none}
.params-row select:focus,.params-row input:focus{border-color:var(--blue)}

/* plan map */


/* results */
.combo-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:0.5px solid rgba(255,255,255,.08);cursor:pointer;transition:background .15s}
.combo-card:hover{background:rgba(12,12,16,.85)}
.combo-card.selected{background:rgba(12,12,16,.85);border-left:3px solid var(--blue)}
.combo-card:last-child{border-bottom:none}
.combo-rank{font-size:22px;font-weight:700;color:var(--blue);min-width:32px;text-align:center}
.combo-info{flex:1}
.combo-route{font-weight:600;font-size:13px;margin-bottom:3px}
.combo-meta{font-size:11px;color:rgba(255,255,255,.55);line-height:1.7}
.combo-score{text-align:right;flex-shrink:0}
.combo-pct{font-size:22px;font-weight:700}
.combo-detail{font-size:11px;color:rgba(255,255,255,.4)}
.score-high{color:#30d158}
.score-med{color:#ff9f0a}
.score-low{color:#ff453a}

/* courbes */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .search{padding-left:12px}

/* table leaderboard */
#lb-table{width:100%;border-collapse:collapse;font-size:13px}
#lb-table th{text-align:left;padding:4px 7px;border-bottom:0.5px solid rgba(255,255,255,.08);font-size:10px;font-weight:600;text-transform:uppercase;color:rgba(255,255,255,.55);background:rgba(12,12,16,.85);white-space:nowrap}
#lb-table td{padding:4px 7px;border-bottom:0.5px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums;font-size:12px}
#lb-table tr:hover td{background:rgba(12,12,16,.85)}
.rank-cell{font-weight:700;color:var(--blue);width:40px}
.mv-bar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);vertical-align:middle;margin-left:6px}
.fill-pill{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.fill-high{background:rgba(52,199,89,.15);color:#34c759}
.fill-med{background:rgba(255,159,10,.15);color:#ff9f0a}
.fill-low{background:rgba(255,69,58,.15);color:#ff453a}

.loader,.no-data{padding:40px;text-align:center;color:rgba(255,255,255,.4);background:rgba(12,12,16,.85);border-radius:var(--radius)}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(12,12,16,.85);padding:10px;border-radius:10px;margin-bottom:14px}
.range select,.range input{padding:8px 10px;border-radius:10px;border:0.5px solid rgba(255,255,255,.12);font-size:13px;outline:none}
.btn{padding:8px 18px;border-radius:10px;border:none;background:#f5f5f7;color:#1c1c1e;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.85}
.search::placeholder{color:rgba(255,255,255,.45)}

/* Scrollbar visible (macOS masque les scrollbars par défaut) */
.bikes-scroll{ scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent; }
.bikes-scroll::-webkit-scrollbar{ width:5px; }
.bikes-scroll::-webkit-scrollbar-track{ background:transparent; }
.bikes-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.25); border-radius:3px; }
.bikes-scroll::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.4); }

@media(min-width:768px){
  body{overflow:hidden}
  #tab-map{height:100vh !important;width:100vw !important}
  .map-rel{height:100% !important}
  main{padding:0 !important;margin:0 !important;max-width:100vw !important}
}
.station-popup .leaflet-popup-content-wrapper{background:transparent!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
.station-popup .leaflet-popup-tip-container{display:none}
.station-popup .leaflet-popup-content{margin:0!important;line-height:1.4}
</style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:38px;background:rgba(12,12,16,.85);backdrop-filter:blur(48px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(48px) saturate(200%) brightness(1.05);border:0.5px solid rgba(255,255,255,.14);border-radius:14px;position:absolute;top:10px;left:10px;right:10px;z-index:300;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 24px rgba(0,0,0,.4)">
  <div style="font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em">Vélo'v</div>
  <div style="display:flex;gap:2px">
    <div class="tab on" data-tab="map" style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;cursor:pointer;color:#fff;font-size:12px;font-weight:600"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> Carte</div>
    <div class="tab" data-tab="stats" style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12px;font-weight:600"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Stats</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="refresh-btn" onclick="manualRefresh()" title="Actualiser" style="background:transparent;border:none;cursor:pointer;padding:9px;margin:-6px;display:flex;align-items:center;color:rgba(255,255,255,.5);transition:transform .3s;-webkit-tap-highlight-color:transparent">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
    <div id="live-status" style="font-size:10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px" onclick="toggleSourcePanel()"></div>
  </div>
</header>

<!-- Panneau source de données -->
<div id="source-panel" style="display:none;position:absolute;top:52px;right:10px;z-index:400;width:min(320px,calc(100% - 20px));background:rgba(12,12,16,.85);backdrop-filter:blur(56px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(56px) saturate(220%) brightness(1.08);border-radius:14px;border:0.5px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.4);padding:12px 14px;font-size:11px;color:rgba(255,255,255,.85)">
  <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.4);margin-bottom:8px">Source des données</div>
  <div id="source-content"></div>
</div>





<main style="padding:0;overflow:hidden">



<!-- ═══ CARTE ═══ -->
<div class="panel on" id="tab-map" style="position:relative;display:flex;flex-direction:column;height:100vh;overflow:hidden">
  <div class="map-rel" style="position:relative;flex:1;overflow:hidden">
    <div id="map" style="height:100%;width:100%"></div>

    <!-- Flottant glass -->
    <div id="plan-float" style="position:absolute;top:58px;left:10px;right:10px;z-index:200;background:rgba(12,12,16,.85);backdrop-filter:blur(56px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(56px) saturate(220%) brightness(1.08);border-radius:16px;border:0.5px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 1px 0 0 rgba(255,255,255,.1),0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);overflow:visible;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s;max-height:250px">
      <div id="plan-close-btn" onclick="closePlanFloat()" style="position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:rgba(12,12,16,.85);border:0.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:201"><svg width="8" height="8" viewBox="0 0 8 8" fill="none"><line x1="1.5" y1="1.5" x2="6.5" y2="6.5" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"/><line x1="6.5" y1="1.5" x2="1.5" y2="6.5" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div id="plan-float-expanded" style="padding:8px 10px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <div style="flex:1;background:rgba(255,255,255,.09);border-radius:10px;overflow:visible;border:0.5px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)">
            <div style="position:relative">
              <input id="plan-from" class="search" type="text" placeholder="Départ…" autocomplete="off" style="background:transparent;border-radius:0;border:none;border-bottom:0.5px solid rgba(255,255,255,.08)"/>
              <div class="dropdown" id="plan-from-dd"></div>
            </div>
            <div style="position:relative">
              <input id="plan-to" class="search" type="text" placeholder="Arrivée…" autocomplete="off" style="background:transparent;border-radius:0;border:none;color:#fff"/>
              <div class="dropdown" id="plan-to-dd"></div>
            </div>
          </div>
          <button onclick="swapPlanFromTo()" style="width:30px;height:30px;border-radius:8px;border:0.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);cursor:pointer;font-size:15px;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 16V4m0 0L3 8m4-4 4 4"/><path d="M17 8v12m0 0 4-4m-4 4-4-4"/></svg></button>
        </div>
        <!-- Ligne 1 : now/plan + élec/méca + calculer -->
        <div style="display:flex;gap:6px;align-items:center">
          <div style="display:flex;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.06);border-radius:20px;padding:2px;position:relative;flex-shrink:0">
            <div id="toggle-slider" style="position:absolute;top:2px;left:2px;height:calc(100% - 4px);width:50%;background:rgba(255,255,255,.18);border:0.5px solid rgba(255,255,255,.2);border-radius:18px;transition:transform .18s;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)"></div>
            <button id="btn-now" onclick="setModeNow()" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/></svg></button>
            <button id="btn-plan" onclick="setModePlan()" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;color:rgba(255,255,255,.38);cursor:pointer;display:flex;align-items:center"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
          </div>
          <div style="display:flex;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.06);border-radius:20px;padding:2px;position:relative;flex-shrink:0">
            <div id="type-slider-now" style="position:absolute;top:2px;left:2px;height:calc(100% - 4px);width:50%;background:rgba(255,255,255,.18);border:0.5px solid rgba(255,255,255,.2);border-radius:18px;transition:transform .15s;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)"></div>
            <button onclick="setBikeType('elec')" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;cursor:pointer;color:#fff;display:flex;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
            <button onclick="setBikeType('meca')" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,.38);display:flex;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button>
          </div>
          <select id="plan-type" style="display:none"><option value="elec">elec</option><option value="meca">meca</option><option value="any" selected>any</option></select>
          <button class="btn" onclick="computePlan()" style="margin-left:auto;padding:5px 14px;font-size:11px;border-radius:20px;background:rgba(255,255,255,.9);color:#111;border:none;font-weight:700;cursor:pointer;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
        <!-- Ligne 2 : params plan (masqués par défaut) -->
        <div id="plan-params" style="display:none;gap:6px;align-items:center;margin-top:6px">
          <select id="plan-dow" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:11px;flex:1"><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option><option value="0">Dimanche</option></select>
          <input type="time" id="plan-hour-time" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:11px;outline:none;flex:1" oninput="syncHourSelect()"/>
          <select id="plan-hour" style="display:none"></select>
          <select id="plan-radius" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:11px"><option value="300">300m</option><option value="500" selected>500m</option><option value="800">800m</option><option value="1200">1.2km</option></select>
        </div>
      </div>

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dl=(lat2-lat1)*Math.PI/180,dg=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dl/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function decodePolyline(encoded,precision=6){
  let i=0,lat=0,lng=0; const coords=[],f=Math.pow(10,precision);
  while(i<encoded.length){
    let b,s=0,r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1); s=0;r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lng+=(r&1)?~(r>>1):(r>>1);
    coords.push([lat/f,lng/f]);
  }
  return coords;
}

function parseStation(r){
  let elec=0,meca=0;
  try{
    const raw=r.main_stands||r.overflow_stands||'';
    if(raw){
      const s=(typeof raw==='string'?raw:JSON.stringify(raw)).replace(/'/g,'"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
      const d=JSON.parse(s); elec=d?.availabilities?.electricalBikes??0; meca=d?.availabilities?.mechanicalBikes??(r.available_bikes||0);
    }
  }catch{}
  return { number:r.number,name:r.name||'',
    available_bikes:r.available_bikes||0, available_bike_stands:r.available_bike_stands||0,
    bike_stands:r.bike_stands||0, electrical_bikes:elec, mechanical_bikes:meca,
    lat:r.lat, lng:r.lng };
}
async function loadLatest(){
  try{
    // Source primaire : API Grand Lyon directe
    const r=await fetch('https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1',{signal:AbortSignal.timeout(8000),cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      const rows = j.values || [];
      window._dataSource = 'grandlyon';
      // last_update de la première station = fraîcheur réelle des données
      window._dataTimestamp = rows[0]?.last_update || null;
      return rows.map(parseStation);
    }
  }catch{}
  try{
    // Fallback : fichier local data/latest.json
    const r=await fetch(`data/latest.json?t=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!r.ok) throw new Error('no local');
    const d=await r.json();
    window._dataSource = 'local';
    window._dataTimestamp = d.timestamp || null;
    return (d.stations||[]).map(s=>({...s,number:parseInt(s.number)||s.number}));
  }catch{ window._dataSource=null; window._dataTimestamp=null; return []; }
}

const _idbName='velov-cache', _idbStore='days', _idbVer=1;
let _idb=null;
function openIDB(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(_idbName,_idbVer);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(_idbStore);
    req.onsuccess=e=>{ _idb=e.target.result; res(_idb); };
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(key){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(_idbStore,'readonly');
      const req=tx.objectStore(_idbStore).get(key);
      req.onsuccess=()=>res(req.result??null);
      req.onerror=()=>res(null);
    });
  }catch{ return null; }
}
async function idbSet(key,val){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(_idbStore,'readwrite');
      tx.objectStore(_idbStore).put(val,key);
      tx.oncomplete=()=>res();
      tx.onerror=()=>res();
    });
  }catch{}
}

const _fetchDayCache={};
async function fetchDay(date){
  if(_fetchDayCache[date]) return _fetchDayCache[date];
  const today=localDateStr();
  // Vérifier IDB pour les dates passées
  if(date!==today){
    const cached=await idbGet(date);
    if(cached){ _fetchDayCache[date]=cached; return cached; }
  }
  try{
    if(date===today){
      const r=await fetch(`data/today.json?t=${Date.now()}`,{cache:'no-store'});
      if(!r.ok) return null;
      const data=await r.json();
      return data.base&&data.deltas ? expandDeltas(data) : Array.isArray(data)?data:null;
    }
    // Essayer .json.gz d'abord, puis .json en fallback
    for(const ext of ['.json.gz','.json']){
      const r=await fetch(`data/history/${date}${ext}`,{signal:AbortSignal.timeout(3000)});
      if(!r.ok) continue;
      let data;
      if(ext==='.json.gz'){
        const blob=await r.blob();
        const ds=new DecompressionStream('gzip');
        const stream=blob.stream().pipeThrough(ds);
        const text=await new Response(stream).text();
        data=JSON.parse(text);
      } else {
        data=await r.json();
      }
      const result=data.base&&data.deltas?expandDeltas(data):Array.isArray(data)?data:null;
      if(result && date!==today){
        _fetchDayCache[date]=result;
        idbSet(date,result); // persist IDB
      }
      return result;
    }
    return null;
  }catch{ return null; }
}

function expandDeltas(data){
  const base = data.base;
  const snapshots = [];
  const baseState = {};
  (base.s||[]).forEach(st=>{ baseState[st.n]={...st}; });
  const baseSnap = {t: base.t, s: Object.values(baseState)};
  if(base.meteo) baseSnap.meteo = base.meteo;
  snapshots.push(baseSnap);
  let lastMeteo = base.meteo || null;
  for(const delta of (data.deltas||[])){
    for(const d of (delta.d||[])){
      const n=d.n;
      if(!baseState[n]) baseState[n]={n};
      Object.assign(baseState[n], d);
    }
    const snap = {t: delta.t, s: Object.values(baseState).map(st=>({...st}))};
    // Propager la dernière météo connue si le delta n'en a pas
    if(delta.meteo){ lastMeteo=delta.meteo; snap.meteo=delta.meteo; }
    else if(lastMeteo){ snap.meteo=lastMeteo; }
    snapshots.push(snap);
  }
  return snapshots;
}
function getTs(snap){ return snap.timestamp||snap.t||''; }
function getSts(snap){
  let a=[];
  if(Array.isArray(snap)) a=snap;
  else if(Array.isArray(snap?.stations)) a=snap.stations;
  else if(Array.isArray(snap?.s)) a=snap.s;
  return a.map(st=>{
    if(!st.n) return st;
    return {number:st.n,available_bikes:st.b??0,available_bike_stands:st.s??0,
      bike_stands:st.c??0,electrical_bikes:st.e??0,mechanical_bikes:st.m??0,lat:st.la,lng:st.ln};
  });
}
async function fetchRange(startMs,endMs){
  const days=Math.ceil((endMs-startMs)/86400e3);
  const step=days<=14?1:days<=30?1:days<=90?3:days<=180?5:10;
  const dates=new Set();
  for(let i=0;i<=days;i+=step){ const d=new Date(startMs);d.setDate(d.getDate()+i);dates.add(d.toISOString().slice(0,10)); }
  dates.add(new Date(endMs).toISOString().slice(0,10));
  const results=await Promise.all([...dates].map(fetchDay));
  const all=[];
  results.forEach(s=>{if(s?.length)all.push(...s);});
  return all.filter(s=>{const t=new Date(getTs(s)).getTime();return t>=startMs&&t<=endMs;})
    .sort((a,b)=>new Date(getTs(a))-new Date(getTs(b)));
}
function calcMvFromSnaps(snaps){
  const mv={};
  for(let i=1;i<snaps.length;i++){
    const prev=getSts(snaps[i-1]),curr=getSts(snaps[i]);
    curr.forEach(c=>{
      const p=prev.find(s=>s.number===c.number); if(!p) return;
      const d=Math.abs(c.available_bikes-p.available_bikes);
      if(d>0) mv[c.number]=(mv[c.number]||0)+d;
    });
  }
  return mv;
}

}

function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:false}).setView([45.757,4.832],13); L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:20}).addTo(map);
  map.on('zoomend', renderStations);
}
function renderStations(){
  if(markers) markers.clearLayers();
  markers=L.layerGroup();
  if(!window._stationsHidden) markers.addTo(map);
  const zoom=map?map.getZoom():13;

  // Clustering au zoom faible
  if(zoom < 13){
    const cellSize=zoom>=11?0.015:0.03;
    const cells={};
    allStations.filter(s=>s.lat&&s.lng).forEach(st=>{
      const cx=Math.round(st.lat/cellSize), cy=Math.round(st.lng/cellSize);
      const key=cx+'_'+cy;
      if(!cells[key]) cells[key]={lat:0,lng:0,count:0,bikes:0,stands:0};
      cells[key].lat+=st.lat; cells[key].lng+=st.lng;
      cells[key].count++; cells[key].bikes+=st.available_bikes||0; cells[key].stands+=st.bike_stands||1;
    });
    Object.values(cells).forEach(cell=>{
      const lat=cell.lat/cell.count, lng=cell.lng/cell.count;
      const ratio=cell.bikes/cell.stands;
      const color=ratio>=0.4?'#1a7a3e':ratio>=0.15?'#f59e0b':'#b52a2a';
      const r=Math.max(14,Math.min(26,10+cell.count*1.5));
      const icon=L.divIcon({html:`<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 6px rgba(0,0,0,.4)">${cell.count}</div>`,iconSize:[r*2,r*2],iconAnchor:[r,r],className:''});
      markers.addLayer(L.marker([lat,lng],{icon}));
    });
    return;
  }

  // Stations individuelles avec taille variable
  allStations.forEach(st=>{
    if(!st.lat||!st.lng) return;
    const mv=todayMv[st.number]||0;
    const m=L.circleMarker([st.lat,st.lng],{radius:8,fillColor:stationColor(st),color:'#fff',weight:1.5,fillOpacity:.9});
    m.on('click',(e)=>{ L.DomEvent.stopPropagation(e);
      if(window._waitingForArr){
        const pos={lat:st.lat,lng:st.lng};
        const arrSt=allStations.find(x=>x.number===st.number)||st;
        planToFixed=arrSt; planToPos=pos; window._planToPos=pos;
        document.getElementById('plan-to').value=cleanName(st.name);
        window._waitingForArr=false;
        expandPlanFloat();
        setTimeout(()=>computePlan(),200);
      } else {
        showStationPopup(st, st.lat, st.lng);
      }
    });
    markers.addLayer(m);
  });
}

function buildDropdown(inputId, ddId, opts){
  const input=document.getElementById(inputId), dd=document.getElementById(ddId);

  input.addEventListener('input',()=>{
    const q=input.value.trim();
    dd.innerHTML='';
    if(!q){ dd.classList.remove('open'); return; }

    // Stations locales (instantané)
    const stMatches=allStations
      .filter(s=>cleanName(s.name).toLowerCase().includes(q.toLowerCase()))
      .slice(0,5);

    // Lieux lyonnais connus (instantané)
    const lieuMatches=LIEUX_LYON
      .filter(l=>l.name.toLowerCase().includes(q.toLowerCase()))
      .slice(0,3);

    const render=(geoResults=[])=>{
      dd.innerHTML='';
      stMatches.forEach(st=>{
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`${cleanName(st.name)} <span class="opt-type">🚲 station</span>`;
        el.onclick=()=>{ input.value=cleanName(st.name); dd.classList.remove('open'); opts.onStation?.(st); };
        dd.appendChild(el);
      });
      geoResults.forEach(geo=>{
        const el=document.createElement('div'); el.className='opt';
        const geoType=geo.type||geo.class||'';
        const isShop=geoType==='shop'||geoType==='office'||geoType==='company'||geoType==='commercial'||(geo.extratags?.office)||(geo.extratags?.company);
        const icon=isShop?'🏢':'📍';
        const typeLabel=isShop?'entreprise':'adresse';
        const shortName=geo.display_name.split(',').slice(0,2).join(',').trim();
        el.innerHTML=`${shortName} <span class="opt-type">${icon} ${typeLabel}</span>`;
        el.onclick=()=>{
          input.value=geo.display_name.split(',').slice(0,2).join(',');
          dd.classList.remove('open');
          const pos={lat:parseFloat(geo.lat),lng:parseFloat(geo.lon)};
          opts.onGeoPos?.(pos);
        };
        dd.appendChild(el);
      });
      // Lieux locaux
      lieuMatches.forEach(l=>{
        if(geoResults.some(g=>g.display_name?.includes(l.name))) return; // dédoublonner
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`<span style="font-size:14px">${l.type}</span><div><div style="font-weight:500">${l.name}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">Lyon</div></div>`;
        el.onclick=()=>{ input.value=l.name; dd.classList.remove('open'); opts.onGeoPos?.({lat:l.lat,lng:l.lng}); };
        dd.appendChild(el);
      });
      if(stMatches.length||geoResults.length||lieuMatches.length){
        positionDropdown(inputId, ddId);
        dd.classList.add('open');
      } else dd.classList.remove('open');
    };

    render(); // afficher les stations tout de suite

    // Géocodage Nominatim avec debounce 400ms
    clearTimeout(_nominatimDebounce[inputId]);
    if(q.length>=3){
      _nominatimDebounce[inputId]=setTimeout(async()=>{
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+', Lyon, France')}&limit=6&addressdetails=1&extratags=1`);
          const data=await r.json();
          render(data);
        }catch{}
      },200);
    }
  });

  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}

async function computeLeaderboard(){
  const content=document.getElementById('lb-content');
  content.innerHTML='<div class="loader">Calcul…</div>';
  const view=document.getElementById('lb-view').value;

  if(view==='day'){
    const d=document.getElementById('lb-date').value;
    if(!d){ content.innerHTML='<div class="no-data">Sélectionnez une date.</div>'; return; }
    const today=localDateStr();
    let snaps=[];
    if(d===today){
      // Jour J : utiliser latest.json (données live JCDecaux)
      try{
        const r=await fetch(`data/latest.json?t=${Date.now()}`,{cache:'no-store'});
        if(r.ok){
          const data=await r.json();
          // Construire un snapshot unique depuis latest
          const stations=(data.stations||[]).map(s=>({...s,t:data.timestamp}));
          snaps=[{t:data.timestamp,stations}];
        }
      }catch(e){ console.warn('latest.json fetch error',e); }
    } else {
      snaps=await fetchDay(d)||[];
    }
    showDayMeteo(d);
    if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
    lbMvCache=calcMvFromSnaps(snaps);
  } else {
    // Mois ou Année — agréger plusieurs jours
    let dates=[];
    if(view==='month'){
      const m=document.getElementById('lb-month').value;
      if(!m){ content.innerHTML='<div class="no-data">Sélectionnez un mois.</div>'; return; }
      const [y,mo]=m.split('-').map(Number);
      const days=new Date(y,mo,0).getDate();
      for(let d=1;d<=days;d++) dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    } else {
      const y=document.getElementById('lb-year').value;
      for(let mo=1;mo<=12;mo++) for(let d=1;d<=new Date(y,mo,0).getDate();d++)
        dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    }
    // Limiter aux dates passées
    const today=localDateStr();
    dates=dates.filter(d=>d<=today);
    content.innerHTML=`<div class="loader">Calcul sur ${dates.length} jours…</div>`;
    // Agréger les mouvements
    const cumul={};
    let loaded=0;
    for(const d of dates){
      const snaps=await fetchDay(d)||[];
      const mv=calcMvFromSnaps(snaps);
      for(const [num,v] of Object.entries(mv)) cumul[num]=(cumul[num]||0)+v;
      loaded++;
      if(loaded%10===0) content.innerHTML=`<div class="loader">${loaded}/${dates.length} jours…</div>`;
    }
    lbMvCache=cumul;

function renderLbTable(mvData){
  const head=document.getElementById('lb-head'), body=document.getElementById('lb-body');
  if(!head||!body) return;
  const view=document.getElementById('lb-view')?.value||'day';
  const isDay=view==='day';
  const sortKey=document.getElementById('lb-sort')?.value||'mv';
  const sortLabels={
    mv:'Mvts', rotation:'Rotation', stands:'Places libres',
    fill:'Remplissage', elec:'Élec', meca:'Méca', bikes:'Vélos'
  };
  const ctxLabel=isDay?'Stock':'Rotation';
  head.innerHTML=`<tr><th>#</th><th>Station</th><th>${sortLabels[sortKey]||'Valeur'}</th><th>${ctxLabel}</th></tr>`;
  const maxMv=Math.max(1,...Object.values(mvData));
  const rows=allStations.map(st=>{
    const mv=mvData[st.number]||0, fill=st.bike_stands?st.available_bikes/st.bike_stands:0, rot=st.bike_stands?mv/st.bike_stands:0;
    return {...st,mv,fill,rot};
  });
  const sorters={mv:(a,b)=>b.mv-a.mv,rotation:(a,b)=>b.rot-a.rot,bikes:(a,b)=>b.available_bikes-a.available_bikes,
    elec:(a,b)=>b.electrical_bikes-a.electrical_bikes,meca:(a,b)=>b.mechanical_bikes-a.mechanical_bikes,
    stands:(a,b)=>b.available_bike_stands-a.available_bike_stands,fill:(a,b)=>b.fill-a.fill};
  rows.sort(sorters[sortKey]||sorters.mv);
  const sortVal=(st)=>{
    switch(sortKey){
      case 'mv': return st.mv;
      case 'rotation': return (Math.round(st.rot*100)/100).toFixed(2);
      case 'stands': return st.available_bike_stands;
      case 'fill': return Math.round(st.fill*100)+'%';
      case 'elec': return st.electrical_bikes;
      case 'meca': return st.mechanical_bikes;
      case 'bikes': return st.available_bikes;
      default: return st.mv;
    }
  };
  // Métrique contextuelle
  const ctxVal=(st)=>{
    if(isDay){
      // Stock actuel : élec + méca
      const e=st.electrical_bikes, m=st.mechanical_bikes;
      return `<span style="font-size:10px;color:#0a84ff;font-weight:600">${e}</span><span style="color:rgba(255,255,255,.45);margin:0 2px">/</span><span style="font-size:10px;color:#ff9f0a;font-weight:600">${m}</span>`;
    } else {
      // Rotation = mvts / capacité
      const rot=st.bike_stands>0?(st.mv/st.bike_stands).toFixed(1):'—';
      const rotNum=parseFloat(rot);
      const rotCol=rotNum>=2?'#34c759':rotNum>=1?'#ff9f0a':'#8e8e93';
      return `<span style="font-size:11px;font-weight:600;color:${rotCol}">${rot}x</span>`;
    }
  };
  body.innerHTML=rows.map((st,i)=>{
    return `<tr onclick="toggleStationDetail(${st.number},this)" style="cursor:pointer" id="lb-row-${st.number}">
      <td class="rank-cell">${i+1}</td>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${cleanName(st.name)}</td>
      <td style="font-weight:600;color:#fff">${sortVal(st)}</td>
      <td style="text-align:right">${ctxVal(st)}</td></tr>
      <tr class="detail-row" id="lb-detail-${st.number}" style="display:none">
        <td colspan="4" style="padding:0">
          <div id="stats-detail-${st.number}" style="padding:14px;background:rgba(12,12,16,.85);border-bottom:0.5px solid rgba(255,255,255,.08)"></div>
        </td>
      </tr>`;
  }).join('');
}

async function showDayMeteo(date){
  const snaps=await fetchDay(date);
  if(!snaps||!snaps.length) return;
  let totalPrecip=0,totalTemp=0,nMeteo=0,rainySnaps=0;
  snaps.forEach(s=>{
    const m=s.meteo; if(!m) return;
    totalPrecip+=m.precipitation||0;
    if(m.temp!==undefined) totalTemp+=m.temp;
    if(m.rain) rainySnaps++;
    nMeteo++;
  });
  if(!nMeteo) return;
  const avgTemp=Math.round(totalTemp/nMeteo*10)/10;
  const rainyPct=Math.round(rainySnaps/nMeteo*100);
  const icon=rainyPct>50?'🌧️':rainyPct>20?'⛅':'☀️';
  const el=document.getElementById('lb-meteo');
  if(el) el.textContent=`${icon} ${avgTemp}°C · ${(totalPrecip/nMeteo).toFixed(1)} mm/h moy · ${rainyPct}% pluvieux`;
}

// WMO weather codes → emoji + label
function meteoFromCode(code, rain){
  if(rain || code>=51) return {icon:'🌧️', label:'Pluvieux', rainy:true};
  if(code>=45)         return {icon:'🌫️', label:'Brouillard', rainy:false};
  if(code>=3)          return {icon:'☁️',  label:'Nuageux', rainy:false};
  if(code>=1)          return {icon:'⛅',  label:'Peu nuageux', rainy:false};
  return                      {icon:'☀️',  label:'Ensoleillé', rainy:false};
}

async function fetchCurrentMeteo(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.75&longitude=4.83&current=precipitation,rain,weathercode,temperature_2m,windspeed_10m,winddirection_10m&timezone=Europe%2FParis');
    if(!r.ok) return null;
    const d=await r.json();
    const cur=d.current||{};
    return {
      precipitation: cur.precipitation||0,
      rain: (cur.precipitation||0)>0.1,
      weathercode: cur.weathercode||0,
      temp: cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m*10)/10 : null,
      wind: cur.windspeed_10m !== undefined ? Math.round(cur.windspeed_10m) : null,
      winddir: cur.winddirection_10m !== undefined ? Math.round(cur.winddirection_10m) : null,
    };
  }catch{ return null; }
}

  }

  const maxWeeksLive=13; // ~90 jours, largement suffisant vu wRec=exp(-dayIdx/45)

  for(let i=0;;i++){
    const d=new Date(today2); d.setDate(d.getDate()-i);
    if(d<dataStart) break;
    if(d.getDay()===targetDow){
      targetDates.push(d.toISOString().slice(0,10));

    }
  }
  // Bonus saisonnier (tous modes) : même semaine ±7j l'an dernier
  // → capte les variations saisonnières (ex: août moins chargé qu'octobre)
  // Coût : max 15 jours de plus, un seul batch supplémentaire, impact négligeable même en Live
  {

    for(let off=-7; off<=7; off++){
      const d=new Date(lastYear); d.setDate(d.getDate()+off);

  function meteoW(snapMeteo,rainy){

      if(dep.number===arr.number) continue;
      const pd=stationProba[dep.number],pa=stationProba[arr.number];
      const depPct=pd?.dep??null,arrPct=pa?.arr??null;
      const depProb=pd?.depProb??null,arrProb=pa?.arrProb??null;
      if(depPct===null||arrPct===null) continue;
      const dist=haversine(dep.lat,dep.lng,arr.lat,arr.lng);
      const rideMin=Math.round(dist/1000/bikeSpeedKmh*60);
      const scoreBase=(depProb!==null&&arrProb!==null)?Math.round(depProb*0.6+arrProb*0.4):Math.round((depPct||0)*0.6+(arrPct||0)*0.4);
      let score=scoreBase;
      if(isNowMode){
        const liveDep=allStations.find(s=>s.number===dep.number);
        const liveArr=allStations.find(s=>s.number===arr.number);
        if(isNowMode&&liveDep&&liveDep.bike_stands>0){
          const liveDepCount=bikeType==='elec'?(liveDep.electrical_bikes||0):bikeType==='meca'?(liveDep.mechanical_bikes||0):(liveDep.available_bikes||0);
          if(liveDepCount===0){
            score=0; // Aucun vélo disponible maintenant → score 0
          } else {
            const liveDepPct=liveDepCount/liveDep.bike_stands*100;
            const liveArrPct=liveArr&&liveArr.bike_stands>0?liveArr.available_bike_stands/liveArr.bike_stands*100:50;
            score=Math.round(liveDepPct*0.5+liveArrPct*0.2+scoreBase*0.3);
          }
        }
        // Mode plan : score = pur historique pondéré
        // scoreBase déjà calculé ci-dessus
      }
      const liveDep2=allStations.find(s=>s.number===dep.number);
      const liveArr2=allStations.find(s=>s.number===arr.number);

      // Batterie : pénalisation si aucun élec viable
      let battPenalty=false;
      const stBikesRaw=(_allBikesByStation?.get(dep.number)||[]);
      const stBikes=stBikesRaw.filter(b=>b.status==='AVAILABLE'&&b.type==='ELECTRICAL').map(b=>({
        batt: b.battery?.percentage!=null?b.battery.percentage:null
      }));
      if(bikeType==='elec'&&stBikes.length>0){
        const distKm=dist/1000;
        const minBatt=Math.ceil(distKm/40*100*1.10);
        const hasViable=stBikes.some(b=>b.batt!=null&&b.batt>=minBatt);
        if(!hasViable){ score=0; battPenalty=true; }
      }

      // Prix : surcoût si trajet > limite gratuite
      const priceLimit=bikeType==='meca'?45:30;
      const overMin=Math.max(0,rideMin-priceLimit);
      const overPrice=overMin>0?Math.round(overMin*0.10*100)/100:0;

      // Segmentation : suggérer station relai si trajet trop long
      let relaiStation=null;
      if(overMin>2){
        const midLat=(dep.lat+arr.lat)/2, midLng=(dep.lng+arr.lng)/2;
        relaiStation=allStations
          .filter(s=>s.number!==dep.number&&s.number!==arr.number&&s.available_bike_stands>0)
          .map(s=>({...s,d:haversine(s.lat,s.lng,midLat,midLng)}))
          .sort((a,b)=>a.d-b.d)[0]||null;
      }

      combos.push({
        dep:Object.assign({},dep,{live:liveDep2||null}),
        arr:Object.assign({},arr,{live:liveArr2||null}),
        depPct,arrPct,depProb,arrProb,
        depN:pd?.depN??null,depElecN:pd?.depElecN??null,depMecaN:pd?.depMecaN??null,arrN:pa?.arrN??null,
        score,dist,rideMin,samples:pd?.samples??0,battPenalty,overPrice,relaiStation
      });
    }
  }
  combos.sort((a,b)=>b.score-a.score);
  const top=combos.slice(0,topN);

  if(!top.length){
    results.innerHTML='<div class="no-data">Pas assez de données historiques pour ces stations.</div>';
    return;
  }

  const meteoNote=isRainy?' 🌧️':'';
  document.getElementById('plan-results-title').textContent=
    `Top ${top.length} combinaisons · ${DOW_NAMES[targetDow]} ${String(targetH).padStart(2,'0')}h · ${bikeType==='elec'?'Élec':bikeType==='meca'?'Méca':'Tous'} · ${allDays.length} jours${meteoNote}`;

  // Warning si station fixée vide/pleine
  const depLiveWarn=planFromFixed&&allStations.find(s=>s.number===planFromFixed.number);
  const depEmptyWarn=depLiveWarn&&(depLiveWarn[depKey]||0)===0;
  const arrLiveWarn=planToFixed&&allStations.find(s=>s.number===planToFixed.number);
  const arrFullWarn=arrLiveWarn&&(arrLiveWarn.available_bike_stands||0)===0;

  const renderComboList=(limit)=>{
    const shown=top.slice(0,limit);
    const html=shown.map((combo,i)=>{
      const sc=Math.round(combo.score??0);
      const bt=document.getElementById('plan-type')?.value||'elec';
      const rColors=bt==='meca'?['#7a1a1a','#a82a2a','#d04444']:['#1a6b36','#2a8a4a','#3eaa62'];
      const rColor=i<3?rColors[i]:'transparent';
      const depCol=(combo.depProb??0)>=60?'#34c759':(combo.depProb??0)>=35?'#ff9f0a':'#ff453a';
      const arrCol=(combo.arrProb??0)>=60?'#34c759':(combo.arrProb??0)>=35?'#ff9f0a':'#ff453a';
      const scCol=sc>=60?'#34c759':sc>=35?'#ff9f0a':'#ff453a';
      const scBg=sc>=60?'#0d2b1a':sc>=35?'#2b1a00':'#2b0a0a';
      const liveElec=combo.dep.live?.electrical_bikes??0;
      const liveMeca=combo.dep.live?.mechanical_bikes??0;
      const livePlaces=combo.arr.live?.available_bike_stands??'?';
      const depDist=planFromFixed?'':` · ${Math.round(combo.dep.dist||0)}m`;

      // Chiffres communs aux deux modes
      const avgElec=combo.depElecN!=null?'~'+Math.round(combo.depElecN):(isNowMode?liveElec:'?');
      const avgMeca=combo.depMecaN!=null?'~'+Math.round(combo.depMecaN):(isNowMode?liveMeca:'?');
      const avgPlaces=combo.arrN!=null?'~'+Math.round(combo.arrN):(isNowMode?livePlaces:'?');
      const dispElec=isNowMode?liveElec:avgElec;
      const dispMeca=isNowMode?liveMeca:avgMeca;
      const dispPlaces=isNowMode?livePlaces:avgPlaces;
      const cardBody=`
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
          <div style="display:flex;gap:5px;align-items:center">
            <div style="display:flex;align-items:center;gap:2px">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span style="font-size:13px;font-weight:700;color:#fff">${dispElec}</span>
            </div>
            <div style="display:flex;align-items:center;gap:2px">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span style="font-size:13px;font-weight:700;color:#fff">${dispMeca}</span>
            </div>
            <div style="display:flex;align-items:center;gap:2px">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg><span style="font-size:13px;font-weight:700;color:#fff">${dispPlaces}</span>
            </div>
          </div>
          ${sc?`<div style="background:${scBg};border-radius:5px;padding:2px 6px;align-self:flex-end"><span style="font-size:11px;font-weight:700;color:${scCol}">${sc}%</span></div>`:''}
        </div>`;
      // Walk times
      const walkDepMin=planFromPos&&!planFromFixed?walkMinutes(haversine(planFromPos.lat,planFromPos.lng,combo.dep.lat,combo.dep.lng)):null;
      const walkArrMin=planToPos&&!planToFixed?walkMinutes(haversine(combo.arr.lat,combo.arr.lng,planToPos.lat,planToPos.lng)):null;
      const walkDepHtml=walkDepMin!=null?`<div style="display:flex;align-items:center;gap:3px;margin-bottom:3px">
        <span style="color:#0a84ff;display:flex;align-items:center">${WALK_SVG}</span>
        <span style="font-size:9px;color:#0a84ff;font-weight:600">${walkDepMin} min</span>
        <div style="flex:1;border-top:1.5px dashed rgba(10,132,255,.35);height:0;margin:0 3px"></div>
        <span style="color:rgba(255,255,255,.4);display:flex;align-items:center">${BIKE_SVG}</span>
      </div>`:'';
      const walkArrHtml=walkArrMin!=null?`<div style="display:flex;align-items:center;gap:3px;margin-top:3px">
        <span style="color:rgba(255,255,255,.4);display:flex;align-items:center">${BIKE_SVG}</span>
        <div style="flex:1;border-top:1.5px dashed rgba(10,132,255,.35);height:0;margin:0 3px"></div>
        <span style="font-size:9px;color:#0a84ff;font-weight:600">${walkArrMin} min</span>
        <span style="color:#0a84ff;display:flex;align-items:center">${WALK_SVG}</span>
      </div>`:'';
      return `<div class="combo-card${i===0?' selected':''}" onclick="toggleComboDetail(${i},this);loadComboBikes(${i})" data-idx="${i}" style="padding:6px 9px;border-radius:8px;margin-bottom:4px;background:rgba(12,12,16,.85);border:0.5px solid rgba(255,255,255,.12);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)">
        ${walkDepHtml}
        <div style="display:flex;align-items:center;gap:8px;padding:${walkDepMin||walkArrMin?'4px 0':0}">
          <div style="width:3px;height:28px;border-radius:2px;background:${rColor};flex-shrink:0"></div>
          <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.5);min-width:14px;flex-shrink:0">${i+1}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cleanName(combo.dep.name)} → ${cleanName(combo.arr.name)}</div>
            <div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:1px;display:flex;align-items:center;gap:4px">
              <span>${Math.round(combo.dist/1000*10)/10}km · ~${combo.rideMin}min</span>
              ${combo.overPrice>0?`<span style="background:rgba(255,159,10,.1);border:0.5px solid rgba(255,159,10,.25);border-radius:4px;padding:1px 4px;font-size:9px;color:#ff9f0a;font-weight:600">+${combo.overPrice.toFixed(2)}€</span>`:''}
              ${combo.battPenalty?`<span style="color:#ff453a;font-size:9px;display:flex;align-items:center;gap:2px"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>batt. insuf.</span>`:''}
            </div>
            ${combo.relaiStation?`<div style="background:rgba(255,159,10,.08);border:0.5px solid rgba(255,159,10,.2);border-radius:5px;padding:2px 6px;margin-top:3px;font-size:9px;color:#ff9f0a;display:flex;align-items:center;gap:3px"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Relai suggéré : ${cleanName(combo.relaiStation.name)}</div>`:''}
          </div>
          ${cardBody}
        </div>
        ${walkArrHtml}
      </div>`;
    }).join('');
    // Desktop : liste + bouton voir plus
    if(window.innerWidth>640){
      const more=top.length>limit
        ?`<div style="text-align:center;padding:8px"><button onclick="window._showMoreCombos()" style="padding:5px 16px;border-radius:20px;border:0.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);font-size:12px;cursor:pointer;color:rgba(255,255,255,.55)">Voir les ${top.length-limit} autres</button></div>`:'';
      return html+more;
    }
    // Mobile : slider swipeable avec dots
    const dots=shown.map((_,i)=>`<div class="cdot${i===0?' on':''}" style="width:${i===0?'14':'5'}px" data-cidx="${i}"></div>`).join('');
    return `<div style="overflow:hidden;padding:0 0px">
      <div id="combo-slider-track" style="display:flex;gap:8px;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform">${html.replace(/margin-bottom:4px/g,'min-width:calc(100% - 18px);flex-shrink:0;margin-bottom:0;margin-left:0px')}</div>
    </div>
    <div class="combo-dots" id="combo-dots" style="display:flex;justify-content:center;gap:5px;padding:6px 0 2px">${dots}</div>`;
  };

  const topScore=top[0]?.score??0;
  const autoLimit=topScore<30?top.length:topScore<50?Math.min(5,top.length):3;
  let _warnHtml='';
  if(isNowMode&&depEmptyWarn) _warnHtml+=`<div style="display:flex;align-items:center;gap:6px;padding:6px 10px 4px;font-size:10px;color:#ff9f0a;background:rgba(255,159,10,.08);border-radius:8px;margin-bottom:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Station vide · stations voisines proposées</div>`;
  if(isNowMode&&arrFullWarn) _warnHtml+=`<div style="display:flex;align-items:center;gap:6px;padding:6px 10px 4px;font-size:10px;color:#ff9f0a;background:rgba(255,159,10,.08);border-radius:8px;margin-bottom:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Station pleine · stations voisines proposées</div>`;
  // Input feedback
  const _fromInput=document.getElementById('plan-from');
  const _toInput=document.getElementById('plan-to');
  if(_fromInput) _fromInput.style.color=depEmptyWarn?'#ff9f0a':'';
  if(_toInput) _toInput.style.color=arrFullWarn?'#ff9f0a':'';
  results.innerHTML=_warnHtml+renderComboList(autoLimit);
  if(window.innerWidth<=640) setTimeout(initSliderSwipe,50);
  window._showMoreCombos=()=>{ results.innerHTML=renderComboList(top.length); drawTop3Routes(); setTimeout(initSliderSwipe,50); };
  window._planCombos=top;
  _openComboIdx=null;
  drawTop3Routes();
  if(typeof hideBackgroundStations==='function') hideBackgroundStations();
  if(window.innerWidth<=640) compactPlanFloat();
}

let planLayerGroup=null;

let _openComboIdx = null;

async function toggleComboDetail(idx, el){
  // Si déjà sélectionné → désélectionner
  if(_openComboIdx === idx){
    document.querySelectorAll('.combo-card').forEach(c=>c.classList.remove('selected'));
    _openComboIdx=null;
    return;
  }
  selectComboIdx(idx);
}

async function selectComboIdx(idx){
  _openComboIdx=idx;
  document.querySelectorAll('.combo-card').forEach((c,i)=>c.classList.toggle('selected',i===idx));
  await showRoute(idx);
  // Compact seulement si le float est encore étendu
  const expanded=document.getElementById('plan-float-expanded');
  if(expanded && expanded.style.display!=='none') compactPlanFloat();
}



async function drawTop3Routes(){
  const top=window._planCombos; if(!top||!top.length) return;

  const bikeType=document.getElementById('plan-type')?.value||'elec';
  const colorsElec=['#1a6b36','#2a8a4a','#3eaa62'];
  const colorsMeca=['#7a1a1a','#a82a2a','#d04444'];
  const colors=bikeType==='meca'?colorsMeca:colorsElec;
  const weights=[4,3,2.5];
  const opacities=[0.95,0.75,0.55];
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);
  const radius=parseInt(document.getElementById('plan-radius').value)||500;
  // Marqueurs départ/arrivée
  // Points départ/arrivée + cercles de rayon
  if(planFromPos&&!planFromFixed){
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:7,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planFromPos.lat,planFromPos.lng],{radius,color:'#1a9e3f',fillColor:'#1a9e3f',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  if(planToPos&&!planToFixed){
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:7,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planToPos.lat,planToPos.lng],{radius,color:'#c0001a',fillColor:'#c0001a',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  // Tracer les 3 premiers en parallèle
  const routePromises=top.slice(0,3).map(async(combo,i)=>{
    let coords=null;
    const bikeT=window._planBikeType||'elec';
    const [vr3,br3]=await Promise.allSettled([
      (async()=>{
        const b3={locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],costing:'bicycle',
          costing_options:{bicycle:{bicycle_type:bikeT==='meca'?'Hybrid':'Road',cycling_speed:bikeT==='meca'?15:22,use_roads:0.1,use_hills:bikeT==='meca'?0:0.7}},directions_type:'none'};
        const r=await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(b3))}`,{signal:AbortSignal.timeout(10000)});
        if(!r.ok) throw 0;
        const d=await r.json(); const leg=d.trip?.legs?.[0]; if(!leg) throw 0;
        return {coords:decodePolyline(leg.shape),dist:(d.trip.summary?.length||0)*1000};
      })(),
      (async()=>{
        const r=await fetch(`https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=trekking&alternativeidx=0&format=geojson`,{signal:AbortSignal.timeout(10000)});
        if(!r.ok) throw 0;
        const d=await r.json(); const geom=d.features?.[0]?.geometry; if(!geom) throw 0;
        return {coords:geom.coordinates.map(([ln,la])=>[la,ln]),dist:parseInt(d.features[0].properties?.['track-length'])||0};
      })()
    ]);
    const cands=[];
    if(vr3.status==='fulfilled') cands.push(vr3.value);
    if(br3.status==='fulfilled') cands.push(br3.value);
    if(cands.length){ cands.sort((a,b)=>a.dist-b.dist); coords=cands[0].coords; }
    return {coords,i,combo};
  });
  const routes=await Promise.all(routePromises);
  // Tracer en ordre inverse (le 1er par-dessus)
  [...routes].reverse().forEach(({coords,i,combo})=>{
    if(coords){
      L.polyline(coords,{color:'#fff',weight:weights[i]+3,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      const pl=L.polyline(coords,{color:colors[i],weight:weights[i],opacity:opacities[i],lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      const _i=i; pl.on('click',()=>selectComboIdx(_i));
      // Zone de clic élargie invisible
      L.polyline(coords,{color:'transparent',weight:20,opacity:0}).on('click',()=>selectComboIdx(_i)).addTo(planLayerGroup);
    }
    // Marqueurs stations
    const depM=L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    depM.bindTooltip(cleanName(combo.dep.name),{direction:'top',permanent:false});
    depM.on('click',()=>selectComboIdx(_i));
    depM.addTo(planLayerGroup);
    const arrM=L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    arrM.bindTooltip(cleanName(combo.arr.name),{direction:'top',permanent:false});
    arrM.on('click',()=>selectComboIdx(_i));
    arrM.addTo(planLayerGroup);

    // Station relai (trajet trop long) — affichée pour le combo principal uniquement
    if(i===0 && combo.relaiStation){
      const relaiIcon=L.divIcon({
        html:`<div style="width:22px;height:22px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>`,
        iconSize:[22,22], iconAnchor:[11,11], className:''
      });
      L.marker([combo.relaiStation.lat,combo.relaiStation.lng],{icon:relaiIcon})
        .bindTooltip(`Relai : ${cleanName(combo.relaiStation.name)}`,{permanent:false,direction:'top'})
        .addTo(planLayerGroup);
    }
  });
  // Zoom sur le premier
  if(routes[0]?.coords) planMap.fitBounds(L.polyline(routes[0].coords).getBounds().pad(.25));
}

async function showRoute(idx){
  // Highlight carte
  document.querySelectorAll('.combo-card').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });

  const combo=window._planCombos?.[idx]; if(!combo) return;
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);

  // Marqueurs départ/arrivée réels
  const radius=parseInt(document.getElementById('plan-radius').value);

  // Points départ/arrivée épurés
  if(planFromPos&&!planFromFixed)
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:8,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:8,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);

  // Stations départ/arrivée
  L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:10,fillColor:'#1a7a3e',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.dep.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);
  L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:10,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.arr.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);

  // Station relai (si trajet trop long pour rester dans la limite gratuite)
  if(combo.relaiStation){
    const relaiIcon=L.divIcon({
      html:`<div style="width:22px;height:22px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>`,
      iconSize:[22,22], iconAnchor:[11,11], className:''
    });
    L.marker([combo.relaiStation.lat,combo.relaiStation.lng],{icon:relaiIcon})
      .bindTooltip(`Relai : ${cleanName(combo.relaiStation.name)}`,{permanent:false,direction:'top'})
      .addTo(planLayerGroup);
  }

  // Routing Valhalla entre les deux stations
  const bikeType=document.getElementById('plan-type').value;
  const speed=bikeType==='meca'?16:21;
  const routeColor=bikeType==='meca'?'#e8001c':'#1a7a3e';
  try{
    const body={
      locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],
      costing:'bicycle',
      costing_options:{bicycle:{bicycle_type:bikeType==='meca'?'Hybrid':'Road',cycling_speed:bikeType==='meca'?15:22,use_roads:0.1,use_hills:bikeType==='meca'?0:0.7}},
      directions_type:'none'
    };
    let coords = null;

    // 1. Brouter — direct, pas de Valhalla (down)
    try {
      const brProfile='trekking';
      const brUrl = `https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=${brProfile}&alternativeidx=0&format=geojson`;
      const rb = await fetch(brUrl, {signal: AbortSignal.timeout(12000)});
      if(rb.ok){
        const db = await rb.json();
        const geom = db.features?.[0]?.geometry;
        if(geom?.type==='LineString') coords = geom.coordinates.map(([lng,lat])=>[lat,lng]);
      }
    } catch(e){ console.warn('Brouter:', e.message); }

    // 2. Fallback OSRM bike
    if(!coords){
      try {
        console.log('Fallback OSRM…');
        const osrmUrl = `https://router.project-osrm.org/route/v1/bike/${combo.dep.lng},${combo.dep.lat};${combo.arr.lng},${combo.arr.lat}?overview=full&geometries=polyline6`;
        const ro = await fetch(osrmUrl, {signal: AbortSignal.timeout(12000)});
        if(ro.ok){
          const dor = await ro.json();
          const geom = dor.routes?.[0]?.geometry;
          if(geom) coords = decodePolyline(geom);
        }
      } catch(e){ console.warn('OSRM:', e.message); }
    }

    // 3. Fallback Valhalla si de retour
    if(!coords){
      try {
        const rv0 = await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(body))}`, {signal: AbortSignal.timeout(8000)});
        if(rv0.ok){
          const dv0 = await rv0.json();
          const leg0 = dv0.trip?.legs?.[0];
          if(leg0) coords = decodePolyline(leg0.shape);
        }
      } catch {}
    }

    if(coords){
      L.polyline(coords,{color:'#fff',weight:8,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      L.polyline(coords,{color:routeColor,weight:5,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      setTimeout(()=>{
        planMap.invalidateSize();
        planMap.fitBounds(L.polyline(coords).getBounds().pad(.2));
      }, 100);
    }
  }catch{}

  // Routing piéton via OSRM foot (bleu pointillé)
  const walkRoutes=[];
  if(planFromPos&&!planFromFixed) walkRoutes.push({from:planFromPos,to:{lat:combo.dep.lat,lng:combo.dep.lng}});
  if(planToPos&&!planToFixed) walkRoutes.push({from:{lat:combo.arr.lat,lng:combo.arr.lng},to:planToPos});
  for(const wr of walkRoutes){
    try{
      const wo=await fetch(`https://router.project-osrm.org/route/v1/foot/${wr.from.lng},${wr.from.lat};${wr.to.lng},${wr.to.lat}?overview=full&geometries=polyline6`,{signal:AbortSignal.timeout(6000)});
      if(wo.ok){
        const wd=await wo.json();
        const wgeom=wd.routes?.[0]?.geometry;
        if(wgeom){
          const wcoords=decodePolyline(wgeom);
          L.polyline(wcoords,{color:'#fff',weight:5,opacity:.3,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
          L.polyline(wcoords,{color:'#0a84ff',weight:2.5,dashArray:'5,6',opacity:.8,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
        }
      }
    }catch{
      // Fallback ligne droite
      L.polyline([[wr.from.lat,wr.from.lng],[wr.to.lat,wr.to.lng]],{color:'#0a84ff',weight:2,dashArray:'5,5',opacity:.6}).addTo(planLayerGroup);
    }
  }

}

let _chartComboA=null, _chartComboB=null;

async function showComboCourbes(combo, targetEl=null){
  await ensureChartJs();
  let zone=targetEl||document.getElementById('plan-courbes-zone');
  if(!zone){
    zone=document.createElement('div');
    zone.id='plan-courbes-zone';
    const card=document.getElementById('plan-results');
    card.appendChild(zone);
  }
  zone.innerHTML='<div class="loader">Chargement des courbes…</div>';

  const nowDate=new Date();
  const dowEl=document.getElementById('plan-dow');
  const hourEl=document.getElementById('plan-hour');
  const targetDow=dowEl&&dowEl.value?parseInt(dowEl.value):nowDate.getDay();
  const targetH2=hourEl&&hourEl.value?parseInt(hourEl.value):nowDate.getHours();
  const today=new Date();
  const promises=[];
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) promises.push(fetchDay(d.toISOString().slice(0,10)));
  }
  const allDays=(await Promise.all(promises)).filter(Boolean);

  const bikeType=document.getElementById('plan-type').value;
  const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';

  const labels=[], depData=[], arrData=[];
  for(let h=0;h<24;h++){
    labels.push(String(h).padStart(2,'0')+'h');
    const dv=[],av=[];
    allDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const sh=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(sh!==h) return;
        const sts=getSts(snap);
        const dep=sts.find(s=>s.number===combo.dep.number);
        const arr=sts.find(s=>s.number===combo.arr.number);
        if(dep?.bike_stands) dv.push((dep[depKey]||0)/dep.bike_stands*100);
        if(arr?.bike_stands) av.push(arr.available_bike_stands/arr.bike_stands*100);
      });
    });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
    depData.push(avg(dv));
    arrData.push(avg(av));
  }

  const bikeLabel=bikeType==='elec'?'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:-1px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Élec':bikeType==='meca'?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:inline;vertical-align:-1px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Méca':'Vélos';
  zone.innerHTML=`
    <div class="card" style="backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);margin-top:0;border-top:none;border-radius:0 0 var(--radius) var(--radius)">
      <div class="card-title">Probabilité sur 24h · ${DOW_NAMES[targetDow]} · ${cleanName(combo.dep.name)} → ${cleanName(combo.arr.name)}</div>
      <canvas id="chart-combo" height="80"></canvas>
    </div>`;

  _chartComboA?.destroy();
  _chartComboA=new Chart(document.getElementById('chart-combo'),{type:'line',
    data:{labels,datasets:[
      {label:`${bikeLabel} dispo au départ`,data:depData,borderColor:'#0a84ff',backgroundColor:'rgba(10,132,255,.08)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
      {label:'🅿️ Place dispo à l\'arrivée',data:arrData,borderColor:'#ff3b30',backgroundColor:'rgba(255,59,48,.06)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
    ]},
    options:{...chartOpts(),scales:{...chartOpts().scales,y:{...chartOpts().scales.y,max:100,ticks:{...chartOpts().scales.y.ticks,callback:v=>v+'%'}}}}
  });
}

let _chartSD_elec=null, _chartSD_meca=null, _chartSD_hmap=null;

let _openDetailNum = null;
async function toggleStationDetail(number, row){
  const detailRow = document.getElementById(`lb-detail-${number}`);
  const detailDiv = document.getElementById(`stats-detail-${number}`);
  if(_openDetailNum === number){
    detailRow.style.display='none';
    row.classList.remove('selected');
    _openDetailNum=null;
    return;
  }
  if(_openDetailNum){
    const old=document.getElementById(`lb-detail-${_openDetailNum}`);
    const oldRow=document.getElementById(`lb-row-${_openDetailNum}`);
    if(old) old.style.display='none';
    if(oldRow) oldRow.classList.remove('selected');
  }
  detailRow.style.display='';

  detailDiv.innerHTML='<div class="loader">Chargement…</div>';
