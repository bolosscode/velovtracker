<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vélo'v Lyon Analytics</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--sub:#6e6e73;--dim:#aeaeb2;
  --border:#d2d2d7;--blue:#0071e3;--green:#28cd41;--orange:#ff9f0a;--red:#ff3b30;
  --radius:14px;--shadow:0 2px 14px rgba(0,0,0,.08);
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}

header{position:sticky;top:0;z-index:300;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:700;font-size:18px}
.brand em{color:var(--blue);font-style:normal}
.clock{font-size:12px;color:var(--dim)}

nav{position:sticky;top:56px;z-index:250;background:#fff;border-bottom:1px solid #ececec;display:flex;padding:0 20px}
.tab{padding:14px 18px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;font-size:13px;font-weight:500}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

main{max-width:1500px;margin:auto;padding:20px}
.panel{display:none}
.panel.on{display:block}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}

#map{height:calc(100vh - 140px);border-radius:var(--radius);overflow:hidden}
#usage-map{height:calc(100vh - 240px);min-height:500px;border-radius:var(--radius);overflow:hidden}

.search-wrap{position:relative;margin-bottom:16px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;outline:none}
.search:focus{border-color:var(--blue)}
.dropdown{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50;max-height:280px;overflow-y:auto}
.dropdown.open{display:block}
.opt{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.opt:last-child{border-bottom:none}
.opt:hover{background:#f0f7ff}

.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.range input{padding:8px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.range input:focus{border-color:var(--blue)}
.shortcuts{display:flex;flex-wrap:wrap;gap:6px}
.shortcuts button{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11px;font-weight:500;transition:all .15s}
.shortcuts button:hover{border-color:var(--blue);color:var(--blue)}

.loader,.no-data{padding:40px;text-align:center;color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="brand">Vélo<em>'</em>v Lyon Analytics</div>
  <div class="clock" id="clock"></div>
</header>

<nav>
  <div class="tab on" data-tab="map">🗺 Stations</div>
  <div class="tab" data-tab="courbes">📈 Utilisation</div>
  <div class="tab" data-tab="heatmap">🔥 Heatmap Lyon</div>
</nav>

<main>

<!-- MAP -->
<div class="panel on" id="tab-map">
  <div id="map"></div>
</div>

<!-- COURBES -->
<div class="panel" id="tab-courbes">
  <div class="card">
    <div class="card-title">Station &amp; période</div>
    <div class="search-wrap">
      <input id="station-search" class="search" type="text" placeholder="Chercher une station…" autocomplete="off"/>
      <div class="dropdown" id="station-dd"></div>
    </div>
    <div class="range">
      <label>Du</label>
      <input type="datetime-local" id="start"/>
      <label>au</label>
      <input type="datetime-local" id="end"/>
      <button onclick="renderCourbes()" style="padding:8px 18px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer">Tracer</button>
    </div>
  </div>
  <div id="courbes-content"><div class="no-data">Sélectionnez une station.</div></div>
</div>

<!-- HEATMAP -->
<div class="panel" id="tab-heatmap">
  <div class="card">
    <div class="card-title">Heatmap des mouvements — période sélectionnée</div>
    <div id="usage-map"></div>
  </div>
</div>

</main>
<script>
'use strict';

/* ── STATE ──────────────────────────────────────────────── */
let allStations = [];
let map = null, usageMap = null;
let markers = null, usageHeatLayer = null, heatMarkers = null;
let selectedStation = null;
let chartElec = null, chartMeca = null;
let todayMv = {};

const fmt = d => d.toISOString().slice(0,16);

/* ── CLOCK ──────────────────────────────────────────────── */
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR');
}, 1000);

/* ── TABS ───────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
    tab.classList.add('on');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('on');
    setTimeout(() => { map?.invalidateSize(); usageMap?.invalidateSize(); }, 120);
  };
});

/* ── UTILS ──────────────────────────────────────────────── */
const cleanName = n => n.replace(/^\d+\s*[-–]\s*/,'').trim();

function stationColor(st) {
  if (!st.bike_stands || st.available_bikes === 0) return '#ff3b30';
  return st.available_bikes/st.bike_stands <= .25 ? '#ff9f0a' : '#28cd41';
}

function chartOpts() {
  return {
    responsive: true,
    plugins: { legend: { labels: { color:'#6e6e73', font:{family:'-apple-system,sans-serif',size:11} } } },
    scales: {
      x: { ticks:{ color:'#aeaeb2', font:{size:10}, maxTicksLimit:16 }, grid:{ color:'#f0f0f5' } },
      y: { beginAtZero:true, ticks:{ color:'#6e6e73' }, grid:{ color:'#f0f0f5' } },
    },
  };
}

/* ── DATA ───────────────────────────────────────────────── */
function parseStation(r) {
  let elec=0, meca=0;
  try {
    const raw = r.main_stands||r.overflow_stands||'';
    if (raw) {
      const s = (typeof raw==='string'?raw:JSON.stringify(raw))
        .replace(/'/g,'"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
      const d = JSON.parse(s);
      elec = d?.availabilities?.electricalBikes ?? 0;
      meca = d?.availabilities?.mechanicalBikes ?? (r.available_bikes||0);
    }
  } catch {}
  return {
    number:r.number, name:r.name||'',
    available_bikes:r.available_bikes||0,
    available_bike_stands:r.available_bike_stands||0,
    bike_stands:r.bike_stands||0,
    electrical_bikes:elec, mechanical_bikes:meca,
    lat:r.lat, lng:r.lng,
  };
}

async function loadLatest() {
  try {
    const r = await fetch('https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1');
    const data = await r.json();
    return (data.values||[]).map(parseStation);
  } catch {
    const r = await fetch('data/latest.json');
    const data = await r.json();
    return data.stations||[];
  }
}

async function fetchDay(date) {
  try {
    const r = await fetch(`data/history/${date}.json`);
    return r.ok ? r.json() : null;
  } catch { return null; }
}

// Normalise les deux formats : ancien {timestamp,stations:[]} et compact {t,s:[]}
function getSnapshotTs(snap) {
  return snap.timestamp || snap.t || '';
}

function getSnapshotStations(snap) {
  let arr = [];
  if (Array.isArray(snap))             arr = snap;
  else if (Array.isArray(snap?.stations)) arr = snap.stations;
  else if (Array.isArray(snap?.s))        arr = snap.s;
  if (!arr.length) return [];
  // Normaliser le format compact vers le format standard
  return arr.map(st => {
    if (st.number !== undefined) return st;
    return {
      number:                st.n,
      available_bikes:       st.b ?? 0,
      available_bike_stands: st.s ?? 0,
      bike_stands:           st.c ?? 0,
      electrical_bikes:      st.e ?? 0,
      mechanical_bikes:      st.m ?? 0,
      status:                st.st || 'OPEN',
      lat:                   st.la,
      lng:                   st.ln,
    };
  });
}

async function fetchRange(startMs, endMs) {
  const days = Math.ceil((endMs-startMs)/86400e3);
  const step = days<=14?1:days<=30?1:days<=90?3:days<=180?5:10;
  const dates = new Set();
  for (let i=0; i<=days; i+=step) {
    const d = new Date(startMs); d.setDate(d.getDate()+i);
    dates.add(d.toISOString().slice(0,10));
  }
  dates.add(new Date(endMs).toISOString().slice(0,10));
  const results = await Promise.all([...dates].map(fetchDay));
  const all = [];
  results.forEach(snaps => { if (snaps?.length) all.push(...snaps); });
  return all
    .filter(s => { const t=new Date(getSnapshotTs(s)).getTime(); return t>=startMs&&t<=endMs; })
    .sort((a,b) => new Date(getSnapshotTs(a))-new Date(getSnapshotTs(b)));
}

/* ── MOUVEMENTS (aujourd'hui) ───────────────────────────── */
async function computeMovements() {
  todayMv = {};
  const snaps = await fetchDay(new Date().toISOString().slice(0,10));
  if (!snaps || snaps.length<2) return;
  for (let i=1; i<snaps.length; i++) {
    const prev = getSnapshotStations(snaps[i-1]);
    const curr = getSnapshotStations(snaps[i]);
    curr.forEach(cst => {
      const pst = prev.find(s => s.number===cst.number);
      if (!pst) return;
      // Mouvements = valeur absolue de la variation (entrées + sorties)
      const delta = Math.abs(cst.available_bikes - pst.available_bikes);
      if (delta > 0) todayMv[cst.number] = (todayMv[cst.number]||0) + delta;
    });
  }
}

/* ── MAP STATIONS ───────────────────────────────────────── */
function initMap() {
  map = L.map('map').setView([45.757,4.832],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO'}).addTo(map);

  usageMap = L.map('usage-map',{preferCanvas:true}).setView([45.757,4.832],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO'}).addTo(usageMap);
}

function renderStations() {
  if (markers) markers.clearLayers();
  markers = L.layerGroup().addTo(map);

  allStations.forEach(st => {
    if (!st.lat||!st.lng) return;
    const mv = todayMv[st.number]||0;
    const m = L.circleMarker([st.lat,st.lng],{
      radius:8, fillColor:stationColor(st), color:'#fff', weight:1.5, fillOpacity:.9,
    });
    m.bindPopup(`
      <div style="min-width:200px;font-family:-apple-system,sans-serif">
        <div style="font-weight:700;margin-bottom:10px;font-size:14px">${cleanName(st.name)}</div>
        ⚡ Électriques : <b>${st.electrical_bikes}</b><br>
        🔧 Mécaniques : <b>${st.mechanical_bikes}</b><br>
        🚲 Total : <b>${st.available_bikes}</b><br>
        🅿️ Places : <b>${st.available_bike_stands}</b><br><br>
        ↕ Mouvements aujourd'hui : <b>${mv}</b>
      </div>`);
    markers.addLayer(m);
  });
}

/* ── SEARCH ─────────────────────────────────────────────── */
function buildSearch() {
  const input = document.getElementById('station-search');
  const dd    = document.getElementById('station-dd');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    dd.innerHTML = '';
    if (!q) { dd.classList.remove('open'); return; }
    const matches = allStations.filter(s => cleanName(s.name).toLowerCase().includes(q)).slice(0,12);
    matches.forEach(st => {
      const el = document.createElement('div');
      el.className = 'opt';
      el.textContent = cleanName(st.name);
      el.onclick = () => {
        input.value = cleanName(st.name);
        dd.classList.remove('open');
        selectedStation = st;
        renderCourbes();
      };
      dd.appendChild(el);
    });
    dd.classList.add('open');
  });
  document.addEventListener('click', e => {
    if (!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}

/* ── RANGE ──────────────────────────────────────────────── */
function getRange() {
  const s = document.getElementById('start').value;
  const e = document.getElementById('end').value;
  if (!s||!e) return null;
  return { startMs:new Date(s).getTime(), endMs:new Date(e).getTime() };
}

function shortcut(hours) {
  const now = new Date();
  document.getElementById('start').value = fmt(new Date(now-hours*3600e3));
  document.getElementById('end').value   = fmt(now);
  if (selectedStation) renderCourbes();
  renderUsageHeatmap();
}

function initRange() {
  const now = new Date();
  document.getElementById('start').value = fmt(new Date(now-24*3600e3));
  document.getElementById('end').value   = fmt(now);
}

['start','end'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (selectedStation) renderCourbes();
  });
});

/* ── COURBES ────────────────────────────────────────────── */
async function renderCourbes() {
  const content = document.getElementById('courbes-content');
  if (!selectedStation) return;
  content.innerHTML = '<div class="loader">Chargement…</div>';

  const range = getRange();
  if (!range) { content.innerHTML = '<div class="no-data">Sélectionnez une période.</div>'; return; }

  const snaps = await fetchRange(range.startMs, range.endMs);
  if (!snaps.length) { content.innerHTML = '<div class="no-data">Aucune donnée.</div>'; return; }

  const id   = selectedStation.number;
  const days = (range.endMs-range.startMs)/86400e3;
  const labels=[], dataElec=[], dataMeca=[];

  snaps.forEach(snap => {
    const sts = getSnapshotStations(snap);
    const st  = sts.find(s => s.number===id);
    if (!st) return;
    const t = new Date(getSnapshotTs(snap));
    labels.push(days<=1
      ? t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
      : t.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    );
    dataElec.push(st.electrical_bikes||0);
    dataMeca.push(st.mechanical_bikes||0);
  });

  content.innerHTML = `
    <div class="card"><div class="card-title">⚡ Électriques</div><canvas id="elec-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">🔧 Mécaniques</div><canvas id="meca-chart" height="80"></canvas></div>`;

  chartElec?.destroy();
  chartMeca?.destroy();

  const mk = (id, data, color, label) => new Chart(document.getElementById(id), {
    type:'line',
    data:{ labels, datasets:[{ label, data, borderColor:color, backgroundColor:color+'18',
      borderWidth:1.8, tension:0, pointRadius:days<=1?0:2, spanGaps:true, fill:true }] },
    options:chartOpts(),
  });

  chartElec = mk('elec-chart', dataElec, '#28cd41', '⚡ Électriques');
  chartMeca = mk('meca-chart', dataMeca, '#0071e3', '🔧 Mécaniques');
}

/* ── HEATMAP USAGE ──────────────────────────────────────── */
async function renderUsageHeatmap() {
  const range = getRange();
  if (!range) return;

  const snaps = await fetchRange(range.startMs, range.endMs);
  if (!snaps||snaps.length<2) return;

  // Compter les mouvements par station sur la période
  const usage = {};
  for (let i=1; i<snaps.length; i++) {
    const prev = getSnapshotStations(snaps[i-1]);
    const curr = getSnapshotStations(snaps[i]);
    curr.forEach(cst => {
      const pst = prev.find(s => s.number===cst.number);
      if (!pst||!cst.lat||!cst.lng) return;
      const delta = Math.abs(cst.available_bikes-pst.available_bikes);
      if (delta<=0) return;
      if (!usage[cst.number]) usage[cst.number]={lat:cst.lat,lng:cst.lng,count:0,number:cst.number};
      usage[cst.number].count += delta;
    });
  }

  const arr = Object.values(usage);
  if (!arr.length) return;
  const max = Math.max(...arr.map(x=>x.count));

  // Couche heatmap
  if (usageHeatLayer) usageMap.removeLayer(usageHeatLayer);
  usageHeatLayer = L.heatLayer(
    arr.map(x=>[x.lat,x.lng,x.count/max]),
    { radius:35, blur:28, maxZoom:17, minOpacity:.4,
      gradient:{0.1:'#2c7bb6',0.3:'#00a6ca',0.5:'#00ccbc',0.7:'#90eb9d',0.85:'#f9d057',1:'#d7191c'} }
  ).addTo(usageMap);

  // Overlay stations : cercles proportionnels + tooltip
  if (heatMarkers) usageMap.removeLayer(heatMarkers);
  heatMarkers = L.layerGroup().addTo(usageMap);

  arr.forEach(x => {
    const st   = allStations.find(s => s.number===x.number);
    const name = st ? cleanName(st.name) : `#${x.number}`;
    const pct  = x.count/max;
    // Rayon proportionnel aux mouvements (4–14px)
    const r    = 4 + Math.round(pct*10);
    // Couleur calée sur le gradient heatmap
    const col  = pct<.3?'#2c7bb6':pct<.6?'#f9d057':'#d7191c';

    const m = L.circleMarker([x.lat,x.lng],{
      radius:r, fillColor:col,
      color:'rgba(255,255,255,.5)', weight:1,
      fillOpacity:.85,
    });

    m.bindTooltip(
      `<b>${name}</b><br>${x.count} mouvement${x.count>1?'s':''}`,
      {direction:'top',offset:[0,-4]}
    );

    heatMarkers.addLayer(m);
  });
}

/* ── BOOT ───────────────────────────────────────────────── */
async function boot() {
  initRange();
  allStations = await loadLatest();
  await computeMovements();
  initMap();
  renderStations();
  buildSearch();
  await renderUsageHeatmap();
}

boot();

setInterval(async () => {
  allStations = await loadLatest();
  await computeMovements();
  renderStations();
  await renderUsageHeatmap();
}, 5*60*1000);
</script>
</body>
</html>
