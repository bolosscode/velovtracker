<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(max-width:640px){
  #stats-layout{grid-template-columns:1fr !important}
  #stats-detail{display:block !important}
  header{height:48px;padding:0 14px}
  .brand{font-size:15px}
  #top-nav{display:none !important}
  #top-nav{display:none !important}

  .card{padding:14px;border:0.5px solid var(--border)}
  .loc-row{grid-template-columns:1fr}
  #map{height:calc(100vh - 50px)}
#tab-plan{height:calc(100vh - 50px)}
  #plan-map{height:260px}
  .params-row{gap:8px}
  .params-row select,.params-row input{font-size:12px;padding:6px 8px}
  #stats-detail{display:none}
  #lb-content{max-height:60vh}
  .combo-card{padding:10px 12px}
  .combo-rank{font-size:18px;min-width:24px}

}
@media(min-width:641px){
  #bottom-nav{display:none !important}
}
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:#1c1c1e;backdrop-filter:blur(14px);
  border-top:0.5px solid #38383a;
  display:flex;padding:0;height:60px;
}
#bottom-nav .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:6px 0;
  font-size:18px;font-weight:600;color:#bbb;

}
#bottom-nav .tab span{font-size:11px;display:block;color:var(--sub)}
#bottom-nav .tab.on{color:#fff;border-top-color:rgba(255,255,255,.3)}
:root{
  --bg:#1c1c1e;--paper:#2c2c2e;--ink:#f5f5f7;--sub:#8e8e93;--dim:#636366;
  --border:#38383a;--blue:#f5f5f7;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --radius:14px;--shadow:0 2px 8px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;color-scheme:dark}

header{position:sticky;top:0;z-index:300;height:56px;background:#1c1c1e;backdrop-filter:blur(14px);border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:700;font-size:20px;color:#fff}.brand em{color:#fff;font-style:normal}
.clock{font-size:12px;color:var(--dim)}

nav{position:sticky;top:56px;z-index:250;background:#1c1c1e;border-bottom:0.5px solid #38383a;display:flex;padding:0 20px;overflow-x:auto}
nav{position:sticky;top:56px;z-index:250;background:#1c1c1e;border-bottom:0.5px solid #38383a;display:flex;padding:0 20px;overflow-x:auto}
.tab.on{color:#fff;border-bottom-color:rgba(255,255,255,.3);background:transparent}

main{max-width:1500px;margin:auto;padding:20px}
.panel{display:none;overflow:hidden}.panel.on{display:block}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}

#map{height:calc(100vh - 50px);border-radius:var(--radius);overflow:hidden;position:relative;z-index:1}
.map-ctrl{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-btn{padding:6px 14px;border-radius:20px;border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow);font-size:12px;font-weight:600;cursor:pointer;color:var(--sub);transition:all .15s}
.map-btn.on{background:var(--blue);color:#fff}
.map-rel{position:relative;overflow:hidden}

/* search */
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){
  #stats-layout{grid-template-columns:1fr !important}
  #stats-detail{display:block !important}.loc-row{grid-template-columns:1fr}}
.loc-box{position:relative}
.loc-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:6px}

.search:focus{border-color:var(--blue)}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#2c2c2e;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.8);display:none;z-index:9999;max-height:240px;overflow-y:auto}
.dropdown.open{display:block}
.opt{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.opt:last-child{border-bottom:none}
.opt:hover{background:#3a3a3c}
.opt-type{font-size:10px;color:var(--dim);float:right}

/* params row */
.params-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.params-row label{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.params-row select,.params-row input{padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.params-row select:focus,.params-row input:focus{border-color:var(--blue)}

/* plan map */


/* results */
.combo-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.combo-card:hover{background:#2c2c2e}

.combo-route{font-weight:600;font-size:13px;margin-bottom:3px}

/* table leaderboard */
#lb-table{width:100%;border-collapse:collapse;font-size:13px}
#lb-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);background:#2c2c2e}

<script>
'use strict';

/* ═══ STATE ═══════════════════════════════════════════ */
let allStations=[], map=null, markers=null, heatLayer=null, heatOn=false;
let selectedStation=null, chartElec=null, chartMeca=null, chartFlux=null;
let todayMv={}, lbMvCache={}, courbesSliderDays=1;
let planMap=null, planRoutes=[], planFromPos=null, planToPos=null;
let planFromFixed=null, planToFixed=null; // station fixée si l'user en a choisi une

const fmt = d => d.toISOString().slice(0,16);
const DOW_NAMES = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ═══ CLOCK & TABS ════════════════════════════════════ */
function updateLiveStatus(){
  const el=document.getElementById('live-status');
  if(!el) return;
  const minAgo=Math.round((Date.now()-(window._lastStationUpdate||Date.now()))/60000);
  if(minAgo<=1) el.innerHTML='<span style="color:#30d158;font-size:10px">● Live</span>';
  else el.innerHTML=`<span style="color:#f59e0b;font-size:10px">● Màj il y a ${minAgo} min</span>`;
}
setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR');
  updateLiveStatus();
},1000);

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    // Sync les deux navs
    document.querySelectorAll('.tab').forEach(t=>{ t.classList.remove('on'); t.style.color='#636366'; });
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    document.querySelectorAll(`.tab[data-tab="${tab.dataset.tab}"]`).forEach(t=>{ t.classList.add('on'); t.style.color='#fff'; });
    document.getElementById('tab-'+tab.dataset.tab).classList.add('on');
    setTimeout(()=>{ map?.invalidateSize(); planMap?.invalidateSize(); },150);
    if(tab.dataset.tab==='map') setTimeout(()=>{ if(!map)initMap(); map?.invalidateSize(); renderStations(); initPlanMap(); },150);
    if(tab.dataset.tab==='stats') quickLeaderboard();
    if(tab.dataset.tab==='plan') initPlanMap();
  };
});

/* ═══ UTILS ═══════════════════════════════════════════ */
const cleanName = n => n.replace(/^\d+\s*[-–]\s*/,'').trim();
function stationColor(st){
  if(!st.bike_stands||st.available_bikes===0) return '#ff3b30';
  return st.available_bikes/st.bike_stands<=.25 ? '#ff9f0a' : '#1a7a3e';
}
function chartOpts(){
  return { responsive:true,
    plugins:{legend:{labels:{color:'#6e6e73',font:{family:'-apple-system,sans-serif',size:11}}}},
    scales:{ x:{ticks:{color:'#aeaeb2',font:{size:10},maxTicksLimit:16},grid:{color:'#f0f0f5'}},
             y:{beginAtZero:true,ticks:{color:'#6e6e73'},grid:{color:'#f0f0f5'}} }};
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dl=(lat2-lat1)*Math.PI/180,dg=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dl/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function decodePolyline(encoded,precision=6){
  let i=0,lat=0,lng=0; const coords=[],f=Math.pow(10,precision);
  while(i<encoded.length){
    let b,s=0,r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1); s=0;r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lng+=(r&1)?~(r>>1):(r>>1);
    coords.push([lat/f,lng/f]);
  }
  return coords;
}
function scoreColor(pct){ return pct>=60?'score-high':pct>=30?'score-med':'score-low'; }

/* ═══ DATA ════════════════════════════════════════════ */
function parseStation(r){
  let elec=0,meca=0;
  try{
    const raw=r.main_stands||r.overflow_stands||'';
    if(raw){
      const s=(typeof raw==='string'?raw:JSON.stringify(raw)).replace(/'/g,'"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
      const d=JSON.parse(s); elec=d?.availabilities?.electricalBikes??0; meca=d?.availabilities?.mechanicalBikes??(r.available_bikes||0);
    }
  }catch{}
  return { number:r.number,name:r.name||'',
    available_bikes:r.available_bikes||0, available_bike_stands:r.available_bike_stands||0,
    bike_stands:r.bike_stands||0, electrical_bikes:elec, mechanical_bikes:meca,
    lat:r.lat, lng:r.lng };
}
async function loadLatest(){
  try{
    const r=await fetch('https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1',{signal:AbortSignal.timeout(8000),cache:'no-store'});
    return (await r.json()).values?.map(parseStation)||[];
  }catch{
    const r=await fetch(`data/latest.json?t=${Date.now()}`,{cache:'no-store'}); const d=await r.json(); return d.stations||[];
  }
}
const _fetchDayCache = {};
async function fetchDay(date){
  if(_fetchDayCache[date]) return _fetchDayCache[date];
  try{
    const today=new Date().toISOString().slice(0,10);
    if(date===today){
      const r=await fetch(`data/today.json?t=${Date.now()}`,{cache:'no-store'});
      if(!r.ok) return null;
      const data=await r.json();
      return data.base&&data.deltas ? expandDeltas(data) : Array.isArray(data)?data:null;
    }
    // Essayer .json.gz d'abord, puis .json en fallback
    for(const ext of ['.json.gz','.json']){
      const r=await fetch(`data/history/${date}${ext}`);
      if(!r.ok) continue;
      let data;
      if(ext==='.json.gz'){
        const blob=await r.blob();
        const ds=new DecompressionStream('gzip');
        const stream=blob.stream().pipeThrough(ds);
        const text=await new Response(stream).text();
        data=JSON.parse(text);
      } else {
        data=await r.json();
      }
      const result = data.base&&data.deltas ? expandDeltas(data) : Array.isArray(data)?data:null;
      if(result && date !== new Date().toISOString().slice(0,10)) _fetchDayCache[date]=result;
      return result;
    }
    return null;
  }catch{ return null; }
}

function expandDeltas(data){
  const base = data.base;
  const snapshots = [];
  const baseState = {};
  (base.s||[]).forEach(st=>{ baseState[st.n]={...st}; });
  const baseSnap = {t: base.t, s: Object.values(baseState)};
  if(base.meteo) baseSnap.meteo = base.meteo;
  snapshots.push(baseSnap);
  let lastMeteo = base.meteo || null;
  for(const delta of (data.deltas||[])){
    for(const d of (delta.d||[])){
      const n=d.n;
      if(!baseState[n]) baseState[n]={n};
      Object.assign(baseState[n], d);
    }
    const snap = {t: delta.t, s: Object.values(baseState).map(st=>({...st}))};
    // Propager la dernière météo connue si le delta n'en a pas
    if(delta.meteo){ lastMeteo=delta.meteo; snap.meteo=delta.meteo; }
    else if(lastMeteo){ snap.meteo=lastMeteo; }
    snapshots.push(snap);
  }
  return snapshots;
}
function getTs(snap){ return snap.timestamp||snap.t||''; }
function getSts(snap){
  let a=[];
  if(Array.isArray(snap)) a=snap;
  else if(Array.isArray(snap?.stations)) a=snap.stations;
  else if(Array.isArray(snap?.s)) a=snap.s;
  return a.map(st=>{
    if(st.number!==undefined) return st;
    return {number:st.n,available_bikes:st.b??0,available_bike_stands:st.s??0,
      bike_stands:st.c??0,electrical_bikes:st.e??0,mechanical_bikes:st.m??0,lat:st.la,lng:st.ln};
  });
}
async function fetchRange(startMs,endMs){
  const days=Math.ceil((endMs-startMs)/86400e3);
  const step=days<=14?1:days<=30?1:days<=90?3:days<=180?5:10;
  const dates=new Set();
  for(let i=0;i<=days;i+=step){ const d=new Date(startMs);d.setDate(d.getDate()+i);dates.add(d.toISOString().slice(0,10)); }
  dates.add(new Date(endMs).toISOString().slice(0,10));
  const results=await Promise.all([...dates].map(fetchDay));
  const all=[];
  results.forEach(s=>{if(s?.length)all.push(...s);});
  return all.filter(s=>{const t=new Date(getTs(s)).getTime();return t>=startMs&&t<=endMs;})
    .sort((a,b)=>new Date(getTs(a))-new Date(getTs(b)));
}
function calcMvFromSnaps(snaps){
  const mv={};
  for(let i=1;i<snaps.length;i++){
    const prev=getSts(snaps[i-1]),curr=getSts(snaps[i]);
    curr.forEach(c=>{
      const p=prev.find(s=>s.number===c.number); if(!p) return;
      const d=Math.abs(c.available_bikes-p.available_bikes);
      if(d>0) mv[c.number]=(mv[c.number]||0)+d;
    });
  }
  return mv;
}

/* ═══ MOVEMENTS ═══════════════════════════════════════ */
async function computeMovements(){
  todayMv={};
  const snaps=await fetchDay(new Date().toISOString().slice(0,10));
  if(!snaps||snaps.length<2) return;
  todayMv=calcMvFromSnaps(snaps);
}

function initMap(){
  if(map) return;
  map=L.map('map').setView([45.757,4.832],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:20}).addTo(map);
  map.on('zoomend', renderStations);
}
let _lastZoomMode = null;
let _stationMarkers = {}; // cache des markers par numéro

function renderStations(){
  if(!map) return;
  const zoom = map.getZoom();
  const mode = zoom < 13 ? 'cluster' : 'individual';

  if(mode === 'cluster'){
    // Cluster — recréer si changement de mode seulement
    if(_lastZoomMode !== 'cluster'){
      if(markers) markers.clearLayers();
      markers = L.layerGroup().addTo(map);
      _stationMarkers = {};
    } else {
      // Mettre à jour les couleurs des clusters
      if(markers) markers.clearLayers();
    }
    const cellSize = zoom>=11 ? 0.015 : 0.03;
    const cells = {};
    allStations.filter(s=>s.lat&&s.lng).forEach(st=>{
      const cx=Math.round(st.lat/cellSize), cy=Math.round(st.lng/cellSize);
      const key=cx+'_'+cy;
      if(!cells[key]) cells[key]={lat:0,lng:0,count:0,bikes:0,stands:0};
      cells[key].lat+=st.lat; cells[key].lng+=st.lng;
      cells[key].count++; cells[key].bikes+=st.available_bikes||0; cells[key].stands+=st.bike_stands||1;
    });
    Object.values(cells).forEach(cell=>{
      const lat=cell.lat/cell.count, lng=cell.lng/cell.count;
      const ratio=cell.bikes/cell.stands;
      const color=ratio>=0.4?'#1a7a3e':ratio>=0.15?'#f59e0b':'#b52a2a';
      const r=Math.max(14,Math.min(26,10+cell.count*1.5));
      const icon=L.divIcon({html:`<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 6px rgba(0,0,0,.4)">${cell.count}</div>`,iconSize:[r*2,r*2],iconAnchor:[r,r],className:''});
      markers.addLayer(L.marker([lat,lng],{icon}));
    });
    _lastZoomMode = 'cluster';
    return;
  }

  // Mode individuel
  if(_lastZoomMode !== 'individual'){
    // Premier rendu individuel — créer tous les markers
    if(markers) markers.clearLayers();
    markers = L.layerGroup().addTo(map);
    _stationMarkers = {};
    allStations.forEach(st=>{
      if(!st.lat||!st.lng) return;
      const m = L.circleMarker([st.lat,st.lng],{radius:8,fillColor:stationColor(st),color:'#fff',weight:1.5,fillOpacity:.9});
      m.on('click',()=>{ if(typeof showStationDetail==='function') showStationDetail(st.number); });
      markers.addLayer(m);
      _stationMarkers[st.number] = m;
    });
    _lastZoomMode = 'individual';
  } else {
    // Mise à jour des couleurs uniquement — pas de recréation
    allStations.forEach(st=>{
      const m = _stationMarkers[st.number];
      if(m) m.setStyle({fillColor: stationColor(st)});
    });
  }
  buildHeatLayer();
}
function buildHeatLayer(){
  if(heatLayer) map.removeLayer(heatLayer);
  const vals=Object.values(todayMv).filter(v=>v>0);
  if(!vals.length) return;
  const maxMv=Math.max(...vals);
  // Seuil : seulement les stations ayant eu au moins 1 mouvement
  const pts=allStations
    .filter(s=>s.lat&&s.lng&&todayMv[s.number]>0)
    .map(s=>[s.lat, s.lng, todayMv[s.number]/maxMv]);
  heatLayer=L.heatLayer(pts,{
    radius:35,        // aura lisible au zoom 13
    blur:20,
    maxZoom:18,
    minOpacity:.1,    // faible pour que les différences soient visibles
    max:1.0,
    gradient:{
      0.0: '#313695',  // bleu foncé = peu de mouvements
      0.3: '#4575b4',
      0.5: '#74add1',
      0.7: '#fdae61',
      0.85:'#f46d43',
      1.0: '#d73027',  // rouge vif = beaucoup de mouvements
    }
  });
  if(heatOn) heatLayer.addTo(map);
}

function buildDropdown(inputId, ddId, opts){
  const input=document.getElementById(inputId), dd=document.getElementById(ddId);

  input.addEventListener('input',()=>{
    const q=input.value.trim();
    dd.innerHTML='';
    if(!q){ dd.classList.remove('open'); return; }

    // Stations locales (instantané)
    const stMatches=allStations
      .filter(s=>cleanName(s.name).toLowerCase().includes(q.toLowerCase()))
      .slice(0,5);

    // Lieux lyonnais connus (instantané)
    const lieuMatches=LIEUX_LYON
      .filter(l=>l.name.toLowerCase().includes(q.toLowerCase()))
      .slice(0,3);

    const render=(geoResults=[])=>{
      dd.innerHTML='';
      stMatches.forEach(st=>{
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`${cleanName(st.name)} <span class="opt-type">🚲 station</span>`;
        el.onclick=()=>{ input.value=cleanName(st.name); dd.classList.remove('open'); opts.onStation?.(st); };
        dd.appendChild(el);
      });
      geoResults.forEach(geo=>{
        const el=document.createElement('div'); el.className='opt';
        const geoType=geo.type||geo.class||'';
        const isShop=geoType==='shop'||geoType==='office'||geoType==='company'||geoType==='commercial'||(geo.extratags?.office)||(geo.extratags?.company);
        const icon=isShop?'🏢':'📍';
        const typeLabel=isShop?'entreprise':'adresse';
        const shortName=geo.display_name.split(',').slice(0,2).join(',').trim();
        el.innerHTML=`${shortName} <span class="opt-type">${icon} ${typeLabel}</span>`;
        el.onclick=()=>{
          input.value=geo.display_name.split(',').slice(0,2).join(',');
          dd.classList.remove('open');
          const pos={lat:parseFloat(geo.lat),lng:parseFloat(geo.lon)};
          opts.onGeoPos?.(pos);
        };
        dd.appendChild(el);
      });
      // Lieux locaux
      lieuMatches.forEach(l=>{
        if(geoResults.some(g=>g.display_name?.includes(l.name))) return; // dédoublonner
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`<span style="font-size:14px">${l.type}</span><div><div style="font-weight:500">${l.name}</div><div style="font-size:11px;color:var(--dim)">Lyon</div></div>`;
        el.onclick=()=>{ input.value=l.name; dd.classList.remove('open'); opts.onGeoPos?.({lat:l.lat,lng:l.lng}); };
        dd.appendChild(el);
      });
      if(stMatches.length||geoResults.length||lieuMatches.length) dd.classList.add('open');
      else dd.classList.remove('open');
    };

    render(); // afficher les stations tout de suite

    // Géocodage Nominatim avec debounce 400ms
    clearTimeout(_nominatimDebounce[inputId]);
    if(q.length>=3){
      _nominatimDebounce[inputId]=setTimeout(async()=>{
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+', Lyon, France')}&limit=6&addressdetails=1&extratags=1`);
          const data=await r.json();
          render(data);
        }catch{}
      },200);
    }
  });

  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}

function onCourbesSlider(){
  const v=parseInt(document.getElementById('courbes-slider').value);
  courbesSliderDays=v;
  const lbl=document.getElementById('courbes-slider-label');
  if(v===1) lbl.textContent="Aujourd'hui";
  else if(v<=7) lbl.textContent=`${v} jours`;
  else if(v<=30) lbl.textContent=`${Math.round(v/7)} sem.`;
  else lbl.textContent=`${Math.round(v/30)} mois`;
}
async function renderCourbes(){
  const content=document.getElementById('courbes-content');
  if(!selectedStation) return;
  content.innerHTML='<div class="loader">Chargement…</div>';
  const days=courbesSliderDays, endMs=Date.now(), startMs=endMs-days*86400e3;
  const snaps=await fetchRange(startMs,endMs);
  if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
  const id=selectedStation.number;
  const labels=[],dataElec=[],dataMeca=[],dataFluxH=[];
  const rawDeltas=[];
  snaps.forEach((snap,i)=>{
    if(i===0) return;
    const prev=getSts(snaps[i-1]),curr=getSts(snap);
    const st=curr.find(s=>s.number===id),pst=prev.find(s=>s.number===id);
    if(st&&pst){ const d=pst.available_bikes-st.available_bikes; rawDeltas.push({ms:new Date(getTs(snap)).getTime(),delta:d>0?d:0}); }
  });
  snaps.forEach(snap=>{
    const st=getSts(snap).find(s=>s.number===id); if(!st) return;
    const t=new Date(getTs(snap)), ms=t.getTime();
    labels.push(days<=1?t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):t.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
    dataElec.push(st.electrical_bikes||0); dataMeca.push(st.mechanical_bikes||0);
    dataFluxH.push(rawDeltas.filter(d=>d.ms>ms-3600e3&&d.ms<=ms).reduce((a,d)=>a+d.delta,0));
  });
  content.innerHTML=`
    <div class="card"><div class="card-title">⚡ Électriques</div><canvas id="elec-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">🔧 Mécaniques</div><canvas id="meca-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">↕ Départs/heure glissante</div><canvas id="flux-chart" height="60"></canvas></div>`;
  chartElec?.destroy(); chartMeca?.destroy(); chartFlux?.destroy();
  const pr=days<=1?0:2;
  const mk=(cid,data,color,label)=>new Chart(document.getElementById(cid),{type:'line',
    data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:color+'18',borderWidth:1.8,tension:0,pointRadius:pr,spanGaps:true,fill:true}]},
    options:chartOpts()});
  chartElec=mk('elec-chart',dataElec,'#1a7a3e','⚡ Électriques');
  chartMeca=mk('meca-chart',dataMeca,'#b52a2a','🔧 Mécaniques');
  chartFlux=new Chart(document.getElementById('flux-chart'),{type:'bar',
    data:{labels,datasets:[{label:'Départs/h',data:dataFluxH,
      backgroundColor:dataFluxH.map(v=>v>5?'rgba(255,59,48,.65)':v>2?'rgba(255,159,10,.6)':'rgba(0,113,227,.5)'),borderWidth:0}]},
    options:chartOpts()});
}

async function computeLeaderboard(){
  const content=document.getElementById('lb-content');
  content.innerHTML='<div class="loader">Calcul…</div>';
  const view=document.getElementById('lb-view').value;

  if(view==='day'){
    const d=document.getElementById('lb-date').value;
    if(!d){ content.innerHTML='<div class="no-data">Sélectionnez une date.</div>'; return; }
    const snaps=await fetchDay(d)||[];
    showDayMeteo(d);
    if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
    lbMvCache=calcMvFromSnaps(snaps);
  } else {
    // Mois ou Année — agréger plusieurs jours
    let dates=[];
    if(view==='month'){
      const m=document.getElementById('lb-month').value;
      if(!m){ content.innerHTML='<div class="no-data">Sélectionnez un mois.</div>'; return; }
      const [y,mo]=m.split('-').map(Number);
      const days=new Date(y,mo,0).getDate();
      for(let d=1;d<=days;d++) dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    } else {
      const y=document.getElementById('lb-year').value;
      const todayY=new Date().toISOString().slice(0,10);
      // Par semaine pour aller plus vite en mode annuel
      const startY=new Date(y+'-01-01');
      const endY=new Date(Math.min(new Date(y+'-12-31'),new Date()));
      for(let d=new Date(startY);d<=endY;d.setDate(d.getDate()+7))
        dates.push(d.toISOString().slice(0,10));
    }
    // Limiter aux dates passées
    const today=new Date().toISOString().slice(0,10);
    dates=dates.filter(d=>d<=today);
    content.innerHTML=`<div class="loader">Calcul sur ${dates.length} jours…</div>`;
    // Agréger les mouvements
    const cumul={};
    let loaded=0;
    for(const d of dates){
      const snaps=await fetchDay(d)||[];
      const mv=calcMvFromSnaps(snaps);
      for(const [num,v] of Object.entries(mv)) cumul[num]=(cumul[num]||0)+v;
      loaded++;
      if(loaded%10===0) content.innerHTML=`<div class="loader">${loaded}/${dates.length} jours…</div>`;
    }
    lbMvCache=cumul;
  }
  content.innerHTML='<div style="overflow-x:auto"><table id="lb-table"><thead id="lb-head"></thead><tbody id="lb-body"></tbody></table></div>';
  renderLbTable(lbMvCache);
  if(view==='day') showDayMeteo(document.getElementById('lb-date').value);
}
function renderLbTable(mvData){
  const head=document.getElementById('lb-head'), body=document.getElementById('lb-body');
  if(!head||!body) return;
  head.innerHTML='<tr><th>#</th><th>Station</th><th>⚡/🔧</th><th>🚲</th><th>🅿️</th><th>↕</th><th>%</th></tr>';
  const sortKey=document.getElementById('lb-sort').value;
  const maxMv=Math.max(1,...Object.values(mvData));
  const rows=allStations.map(st=>{
    const mv=mvData[st.number]||0, fill=st.bike_stands?st.available_bikes/st.bike_stands:0, rot=st.bike_stands?mv/st.bike_stands:0;
    return {...st,mv,fill,rot};
  });
  const sorters={mv:(a,b)=>b.mv-a.mv,rotation:(a,b)=>b.rot-a.rot,bikes:(a,b)=>b.available_bikes-a.available_bikes,
    elec:(a,b)=>b.electrical_bikes-a.electrical_bikes,meca:(a,b)=>b.mechanical_bikes-a.mechanical_bikes,
    stands:(a,b)=>b.available_bike_stands-a.available_bike_stands,fill:(a,b)=>b.fill-a.fill};
  rows.sort(sorters[sortKey]||sorters.mv);
  body.innerHTML=rows.map((st,i)=>{
    const pct=Math.round(st.fill*100), cls=pct>=50?'fill-high':pct>=25?'fill-med':'fill-low';
    const bw=Math.round(st.mv/maxMv*60);
    return `<tr onclick="toggleStationDetail(${st.number},this)" style="cursor:pointer" id="lb-row-${st.number}">
      <td class="rank-cell">${i+1}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cleanName(st.name)}</td>
      <td style="font-size:12px;color:var(--sub)">⚡${st.electrical_bikes} 🔧${st.mechanical_bikes}</td>
      <td><b>${st.available_bikes}</b></td>
      <td>${st.available_bike_stands}</td>
      <td>${st.mv}<span class="mv-bar" style="width:${bw}px"></span></td>
      <td><span class="fill-pill ${cls}">${pct}%</span></td></tr>
      <tr class="detail-row" id="lb-detail-${st.number}" style="display:none">
        <td colspan="7" style="padding:0">
          <div id="stats-detail-${st.number}" style="padding:14px;background:var(--bg);border-bottom:1px solid var(--border)"></div>
        </td>
      </tr>`;
  }).join('');
}

async function showDayMeteo(date){
  const snaps=await fetchDay(date);
  if(!snaps||!snaps.length) return;
  let totalPrecip=0,totalTemp=0,nMeteo=0,rainySnaps=0;
  snaps.forEach(s=>{
    const m=s.meteo; if(!m) return;
    totalPrecip+=m.precipitation||0;
    if(m.temp!==undefined) totalTemp+=m.temp;
    if(m.rain) rainySnaps++;
    nMeteo++;
  });
  if(!nMeteo) return;
  const avgTemp=Math.round(totalTemp/nMeteo*10)/10;
  const rainyPct=Math.round(rainySnaps/nMeteo*100);
  const icon=rainyPct>50?'🌧️':rainyPct>20?'⛅':'☀️';
  const el=document.getElementById('lb-meteo');
  if(el) el.textContent=`${icon} ${avgTemp}°C · ${(totalPrecip/nMeteo).toFixed(1)} mm/h moy · ${rainyPct}% pluvieux`;
}

// WMO weather codes → emoji + label
function meteoFromCode(code, rain){
  if(rain || code>=51) return {icon:'🌧️', label:'Pluvieux', rainy:true};
  if(code>=45)         return {icon:'🌫️', label:'Brouillard', rainy:false};
  if(code>=3)          return {icon:'☁️',  label:'Nuageux', rainy:false};
  if(code>=1)          return {icon:'⛅',  label:'Peu nuageux', rainy:false};
  return                      {icon:'☀️',  label:'Ensoleillé', rainy:false};
}

async function fetchCurrentMeteo(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.75&longitude=4.83&current=precipitation,rain,weathercode,temperature_2m,windspeed_10m,winddirection_10m&timezone=Europe%2FParis');
    if(!r.ok) return null;
    const d=await r.json();
    const cur=d.current||{};
    return {
      precipitation: cur.precipitation||0,
      rain: (cur.precipitation||0)>0.1,
      weathercode: cur.weathercode||0,
      temp: cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m*10)/10 : undefined,
      wind: cur.windspeed_10m !== undefined ? Math.round(cur.windspeed_10m) : undefined,
      winddir: cur.winddirection_10m !== undefined ? Math.round(cur.winddirection_10m) : undefined,
    };
  }catch{ return null; }
}

  // Stations proches du départ — station fixe en tête, puis les proches

  }

  // Stations proches de l'arrivée — station fixe en tête, puis les proches
  const arrCenter = planToFixed ? {lat:planToFixed.lat,lng:planToFixed.lng} : planToPos;
  let arrStations = allStations.filter(s=>s.lat&&s.lng)
    .map(s=>({...s,dist:haversine(arrCenter.lat,arrCenter.lng,s.lat,s.lng)}))
    .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);

  }
  if(!depStations.length||!arrStations.length){

    return;
  }

  // Calculer proba pour chaque station sur l'heure cible
  const stationProba={}; // number → {dep:%, arr:%}
  const allIds=new Set([...depStations.map(s=>s.number),...arrStations.map(s=>s.number)]);

  // Calculer aussi les probas conditions inverses (pour affichage info)
  const invertedRainy = !isRainy;
  function meteoWeightInv(snapMeteo){
    if(!snapMeteo) return 0.8;

    if(sameRain) return 1.0;
    try {
      const snapMonth = snapMeteo._ts ? new Date(snapMeteo._ts).getMonth()+1 : new Date().getMonth()+1;

      return Math.max(0.3, 1.0 - Math.abs(r) * 2);
    } catch { return 0.5; }
  }

    // Matrice r(pluie, mouvements) par (mois, heure) — issue de correlation_meteo.py
  const RAIN_R_MATRIX = {
    1: [-0.019,-0.132,-0.133,-0.018,-0.132,-0.016,0.104,0.071,0.071,0.066,-0.021,-0.508,-0.224,-0.286,-0.224,-0.511,-0.443,-0.268,-0.129,-0.218,-0.278,-0.274,-0.25,-0.264],

    5: [-0.046,-0.26,-0.268,-0.179,-0.282,-0.173,-0.087,-0.04,-0.042,-0.194,-0.363,-0.396,-0.327,-0.363,-0.184,-0.13,-0.196,-0.325,-0.45,-0.523,-0.26,-0.281,-0.352,-0.431],
    6: [0.026,-0.056,0.026,-0.189,-0.121,0,0,-0.189,-0.208,0.013,-0.162,-0.49,-0.595,-0.563,-0.422,0.032,-0.228,0.096,-0.108,-0.188,-0.104,-0.327,-0.466,-0.11],
    7: [-0.023,-0.04,-0.26,0.069,0.116,-0.048,-0.043,0.019,0.09,-0.013,0.161,-0.361,-0.51,-0.299,-0.096,-0.045,-0.039,-0.287,-0.316,-0.438,-0.47,-0.022,-0.533,-0.406],
    8: [-0.018,-0.046,-0.092,-0.205,-0.197,-0.225,-0.047,0.07,0.186,0.181,-0.214,0.017,0.043,0.233,0.125,0.031,-0.125,0.148,0.128,-0.214,-0.248,0.175,-0.084,-0.183],
    9: [-0.025,-0.337,-0.28,-0.203,-0.274,-0.084,-0.084,-0.014,-0.088,-0.089,-0.143,-0.633,-0.187,-0.681,-0.659,-0.802,-0.842,-0.379,-0.114,-0.024,-0.482,-0.417,-0.062,-0.16],
    10: [-0.029,-0.147,-0.104,-0.116,-0.161,-0.136,-0.098,-0.118,-0.077,-0.154,-0.562,-0.526,-0.627,-0.579,-0.356,-0.289,-0.432,-0.646,-0.543,-0.459,-0.515,-0.314,-0.158,0.031],
    11: [-0.006,0.027,0.043,-0.009,0.048,0.116,-0.265,0.032,-0.105,-0.441,-0.623,-0.601,-0.484,-0.424,-0.356,-0.27,-0.424,-0.425,-0.336,-0.525,-0.268,-0.245,-0.358,-0.505],
    12: [0.007,-0.137,-0.209,0.042,-0.168,-0.087,-0.019,-0.071,0.063,-0.04,-0.09,-0.11,-0.127,-0.055,0.015,0.112,0.123,-0.032,0.135,-0.029,-0.109,-0.132,-0.35,-0.087],
  };

  function meteoWeight(snapMeteo){
    if(!snapMeteo) return 0.8;
    const sameRain = snapMeteo.rain === currentlyRainy;
    if(sameRain) return 1.0;
    // Récupérer le r pour le mois et l'heure du snapshot
    try {
      const snapMonth = new Date(snapMeteo._ts||0).getMonth()+1 || new Date().getMonth()+1;
      const r = (RAIN_R_MATRIX[snapMonth]||RAIN_R_MATRIX[1])[targetH] || -0.15;
      return Math.max(0.3, 1.0 - Math.abs(r) * 2);
    } catch {
      return 0.5;
    }
  }

  const _depNAcc={}, _arrNAcc={};
  allIds.forEach(num=>{
    let depSum=0, arrSum=0, wSum=0, samples=0;
    let depHit=0, arrHit=0; // snapshots avec >= 1 vélo/place
    filteredDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const h=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(h!==targetH) return;

        if(!st||!st.bike_stands) return;

        const snapM=snap.meteo; if(snapM) snapM._ts=new Date(getTs(snap)).getTime();
        const w=meteoWeight(snapM);
        const depVal = st[depKey]||0;
        const arrVal = st.available_bike_stands||0;
        depSum += depVal/st.bike_stands*100 * w;
        arrSum += arrVal/st.bike_stands*100 * w;
        wSum   += w;
        // Proba binaire : >= 1 vélo/place disponible
        if(depVal >= 1) depHit += w;
        if(arrVal >= 1) arrHit += w;
        samples++;
        // Accumuler pour moyenne absolue
        _depNAcc[num] = (_depNAcc[num]||0) + depVal * w;
        _arrNAcc[num] = (_arrNAcc[num]||0) + arrVal * w;
      });
    });
    // Calcul inverse
    let depSumI=0,arrSumI=0,wSumI=0,depHitI=0,arrHitI=0;
    filteredDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const h=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(h!==targetH) return;
        const sts=getSts(snap), st=sts.find(s=>s.number===num);

        const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';

        wSumI   += w;
        if((st[depKey]||0)>=1) depHitI += w;

      });
    });
    stationProba[num]={
      dep:     wSum>0 ? Math.round(depSum/wSum)   : null,

      depProb: wSum>0 ? Math.round(depHit/wSum*100) : null,
      arrProb: wSum>0 ? Math.round(arrHit/wSum*100) : null,
      depInv:  wSumI>0 ? Math.round(depSumI/wSumI) : null,
      arrInv:  wSumI>0 ? Math.round(arrSumI/wSumI) : null,
      depProbInv: wSumI>0 ? Math.round(depHitI/wSumI*100) : null,
      arrProbInv: wSumI>0 ? Math.round(arrHitI/wSumI*100) : null,
      samples
    };
  });

  // Générer toutes les combinaisons dep × arr
  const combos=[];
  for(const dep of depStations){
    for(const arr of arrStations){
      if(dep.number===arr.number) continue;
      const pd=stationProba[dep.number], pa=stationProba[arr.number];
      const depPct=pd?.dep??null, arrPct=pa?.arr??null;
      const depProb=pd?.depProb??null, arrProb=pa?.arrProb??null;
      const depPctInv=pd?.depInv??null, arrPctInv=pa?.arrInv??null;
      const depProbInv=pd?.depProbInv??null, arrProbInv=pd?.arrProbInv??null;
      if(depPct===null||arrPct===null) continue;
      // Distance vélo entre les deux stations
      const dist=haversine(dep.lat,dep.lng,arr.lat,arr.lng);
      const rideMin=Math.round(dist/1000/bikeSpeedKmh*60);
      // Score = 60% proba départ + 40% proba arrivée
      const scoreBase = (depProb!==null&&arrProb!==null) ? Math.round(depProb*0.6+arrProb*0.4) : Math.round((depPct||0)*0.6+(arrPct||0)*0.4);
      let score=scoreBase;
      if(isNowMode){
        // Boost/pénalité selon l'état live
        const liveDep=allStations.find(s=>s.number===dep.number);
        const liveArr=allStations.find(s=>s.number===arr.number);
        if(liveDep&&liveDep.bike_stands>0){
          const liveDepPct=(bikeType==='elec'?(liveDep.electrical_bikes||0):bikeType==='meca'?(liveDep.mechanical_bikes||0):(liveDep.available_bikes||0))/liveDep.bike_stands*100;
          score=Math.round(score*0.5+liveDepPct*0.3+(liveArr&&liveArr.bike_stands>0?liveArr.available_bike_stands/liveArr.bike_stands*100*0.2:0));
        }
      }
      const liveDep2=allStations.find(s=>s.number===dep.number);
      const liveArr2=allStations.find(s=>s.number===arr.number);
      const depWithLive = Object.assign({}, dep, {live: liveDep2||null});
      const arrWithLive = Object.assign({}, arr, {live: liveArr2||null});
      combos.push({dep:depWithLive,arr:arrWithLive,depPct,arrPct,depProb,arrProb,depN:pd?.depN??null,arrN:pa?.arrN??null,depPctInv,arrPctInv,score,dist,rideMin,samples:pd?.samples??0});
    }
  }

  combos.sort((a,b)=>b.score-a.score);
  const top=combos.slice(0,topN);

  if(!top.length){
    results.innerHTML='<div class="no-data">Pas assez de données historiques pour ces stations.</div>';
    return;
  }

  const meteoNote=isRainy?' 🌧️ (conditions pluvieuses)':'';
  document.getElementById('plan-results-title').textContent=
    `Top ${top.length} combinaisons · ${DOW_NAMES[targetDow]} ${String(targetH).padStart(2,'0')}h · ${bikeType==='elec'?'⚡ Élec':bikeType==='meca'?'🔧 Méca':'🚲 Tous'} · ${filteredDays.length} sem.${meteoFiltered?' 🌦️ météo filtrée':''}${meteoNote}`;

  // Afficher top 3 par défaut, bouton pour voir plus
  const renderComboList=(limit)=>{
    const shown=top.slice(0,limit);
    const html=shown.map((combo,i)=>{
      const cls=scoreColor(combo.score);
      const depDist=planFromFixed?'':` · ${Math.round(combo.dep.dist||0)}m`;
      const arrDist=planToFixed?'':` · ${Math.round(combo.arr.dist||0)}m`;
      const score=Math.round((combo.depProb??combo.score??0)*0.6+(combo.arrProb??0)*0.4);

      // Données live
      const live=combo.dep.live;
      const liveArr=combo.arr.live;
      const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';
      const liveElec=live?.electrical_bikes??0;
      const liveMeca=live?.mechanical_bikes??0;
      const liveBikes=live?.[depKey]??0;
      const livePlaces=liveArr?.available_bike_stands??'?';

      // Score badge
      const scoreBadge=isNowMode?`<div style="flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${score>=60?'#eaf3de':score>=35?'#faeeda':'#fcebeb'}"><div style="font-size:13px;font-weight:700;line-height:1;color:${score>=60?'#1a7a3e':score>=35?'#c05000':'#b52a2a'}">${score}%</div><div style="font-size:7px;color:${score>=60?'#1a7a3e':score>=35?'#c05000':'#b52a2a'};opacity:.8">score</div></div>`:'';

      // Corps selon mode
      let body='';
      if(isNowMode && live){
        body=`<div style="border-top:0.5px solid var(--border);padding:8px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0">
          <div style="padding-right:10px;border-right:0.5px solid var(--border)">

            <div style="font-size:17px;font-weight:700;color:#1a7a3e;line-height:1">${liveElec}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${combo.depProb??'?'}% · moy ${combo.depN??'?'}</div>
          </div>
          <div style="padding:0 10px;border-right:0.5px solid var(--border)">
            <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#b52a2a;margin-bottom:2px">🔧 Méca</div>
            <div style="font-size:17px;font-weight:700;color:#b52a2a;line-height:1">${liveMeca}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${combo.depMecaProb??combo.depProb??'?'}%</div>
          </div>
          <div style="padding-left:10px">
            <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin-bottom:2px">🅿️ Places</div>
            <div style="font-size:17px;font-weight:700;color:var(--ink);line-height:1">${livePlaces}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${combo.arrProb??'?'}% · moy ${combo.arrN??'?'}</div>
          </div>
        </div>`;
      } else {
        const depElecProb=combo.depProb??combo.depPct??'?';
        const depMecaProb=combo.depMecaProb??combo.depPct??'?';
        const arrProb=combo.arrProb??combo.arrPct??'?';
        const colE=depElecProb>=60?'#1a7a3e':depElecProb>=35?'#c05000':'#b52a2a';
        const colM=depMecaProb>=60?'#1a7a3e':depMecaProb>=35?'#c05000':'#b52a2a';
        const colA=arrProb>=60?'#1a7a3e':arrProb>=35?'#c05000':'#b52a2a';
        body=`<div style="display:grid;grid-template-columns:1fr 1fr;border-top:0.5px solid #f0f0f5">
          <div style="padding:8px 12px;border-right:0.5px solid #f0f0f5">
            <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#aeaeb2;margin-bottom:5px">🚲 Vélo départ</div>
            <div style="display:flex;gap:12px">
              <div><div style="font-size:18px;font-weight:700;color:${colE}">${depElecProb}%</div><div style="font-size:10px;color:#1a7a3e">⚡ Élec</div><div style="font-size:10px;color:#aeaeb2">moy ${combo.depN??'?'}</div></div>
              <div><div style="font-size:18px;font-weight:700;color:${colM}">${depMecaProb}%</div><div style="font-size:10px;color:#b52a2a">🔧 Méca</div></div>
            </div>
          </div>
          <div style="padding:8px 12px">
            <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#aeaeb2;margin-bottom:5px">🅿️ Place arrivée</div>
            <div style="font-size:22px;font-weight:700;color:${colA};margin-top:4px">${arrProb}%</div>
            <div style="font-size:10px;color:#aeaeb2">moy ${combo.arrN??'?'} places</div>
          </div>
        </div>`;
      }

      return `<div class="combo-card${i===0?' selected':''}" onclick="toggleComboDetail(${i},this)" data-idx="${i}" style="overflow:hidden;border-radius:12px;margin-bottom:10px;background:var(--paper);box-shadow:var(--shadow);border:0.5px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px 8px;min-width:0">
          <div style="font-size:20px;font-weight:700;color:#f5f5f7;min-width:24px">${i+1}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🟢 ${cleanName(combo.dep.name)}</div>
            <div style="font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🔴 ${cleanName(combo.arr.name)}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:1px">${Math.round(combo.dist/1000*10)/10} km · ~${combo.rideMin} min${depDist}${combo.rideMin>30&&bikeType==='elec'?' · <span style="color:#f59e0b;font-weight:500">⚠️ >30 min</span>':''}</div>
          </div>
          ${scoreBadge}
        </div>
        ${body}
        ${body}
        ${combo.rideMin>30&&bikeType==='elec'?`<div style="padding:7px 12px;background:#2b1a00;border-top:0.5px solid #38383a;font-size:10px;color:#f59e0b">⚠️ Trajet >30 min — pensez à déposer le VAE à ~26 min pour éviter la surfacturation</div>`:''}
        <div id="combo-detail-${i}" style="display:none;border-top:0.5px solid var(--border)">
          <div id="combo-detail-inner-${i}" style="padding:12px"></div>
        </div>
      </div>`;
    }).join('');
    const more=top.length>limit
      ?`<div style="text-align:center;padding:12px">
          <button onclick="window._showMoreCombos()" style="padding:6px 18px;border-radius:20px;border:1px solid var(--border);background:var(--paper);font-size:12px;cursor:pointer;color:var(--sub)">
            Voir les ${top.length-limit} autres combinaisons
          </button></div>`:'';
    return html+more;
  };
  // Afficher 3 par défaut, élargir auto si les scores sont faibles
  const topScore=top[0]?.score??0;
  const autoLimit=topScore<30 ? top.length : topScore<50 ? Math.min(5,top.length) : 3;
  results.innerHTML=renderComboList(autoLimit);
  window._showMoreCombos=()=>{ results.innerHTML=renderComboList(top.length); showRoute(0); };
  window._planCombos=top;
  initPlanMap(); // s'assurer que la carte est initialisée
  _openComboIdx = null; // reset à chaque nouveau calcul
}

let planLayerGroup=null;

let _openComboIdx = null;

async function toggleComboDetail(idx, el){
  const detailDiv = document.getElementById('combo-detail-'+idx);
  if(!detailDiv) return;
  // Si déjà ouvert, fermer
  if(_openComboIdx === idx){
    detailDiv.style.display='none';
    document.querySelectorAll('.combo-card').forEach(c=>c.classList.remove('selected'));
    _openComboIdx=null;
    return;
  }
  // Fermer l'ancien
  if(_openComboIdx !== null){
    const old=document.getElementById('combo-detail-'+_openComboIdx);
    if(old) old.style.display='none';
  }
  // Ouvrir ce détail
  document.querySelectorAll('.combo-card').forEach((c,i)=>c.classList.toggle('selected',i===idx));
  detailDiv.style.display='';
  _openComboIdx=idx;
  // Routing sur la carte
  await showRoute(idx);
  // Courbes dans la zone accordéon
  const inner=document.getElementById('combo-detail-inner-'+idx);
  inner.innerHTML='<div class="loader">Chargement…</div>';
  await showComboCourbes(window._planCombos?.[idx], inner);
  detailDiv.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function showRoute(idx){
  // Highlight carte
  document.querySelectorAll('.combo-card').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });

  const combo=window._planCombos?.[idx]; if(!combo) return;
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);

  // Marqueurs départ/arrivée réels
  const radius=parseInt(document.getElementById('plan-radius').value);

  if(planFromPos&&!planFromFixed){
    // Point départ — blanc avec bordure verte épaisse
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:9,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:1})
      .bindTooltip('<b>Départ</b>',{permanent:true,direction:'top'}).addTo(planLayerGroup);
    // Cercle rayon — vert foncé, tirets
    L.circle([planFromPos.lat,planFromPos.lng],{radius,color:'#1a9e3f',fillColor:'#1a9e3f',fillOpacity:.07,weight:2,dashArray:'6,4'}).addTo(planLayerGroup);
    // Stations dans le rayon — carré vert vif
    allStations.filter(s=>s.lat&&s.lng&&haversine(planFromPos.lat,planFromPos.lng,s.lat,s.lng)<=radius)
      .forEach(s=>{
        const m=L.circleMarker([s.lat,s.lng],{radius:7,fillColor:'#1a9e3f',color:'#fff',weight:2,fillOpacity:.95});
        m.bindTooltip('🟢 '+cleanName(s.name),{direction:'top'});
        m.addTo(planLayerGroup);
      });
  }
  if(planToPos&&!planToFixed){
    // Point arrivée — blanc avec bordure rouge épaisse
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:9,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:1})
      .bindTooltip('<b>Arrivée</b>',{permanent:true,direction:'top'}).addTo(planLayerGroup);
    // Cercle rayon — rouge foncé, tirets
    L.circle([planToPos.lat,planToPos.lng],{radius,color:'#c0001a',fillColor:'#c0001a',fillOpacity:.07,weight:2,dashArray:'6,4'}).addTo(planLayerGroup);
    // Stations dans le rayon — rouge vif
    allStations.filter(s=>s.lat&&s.lng&&haversine(planToPos.lat,planToPos.lng,s.lat,s.lng)<=radius)
      .forEach(s=>{
        const m=L.circleMarker([s.lat,s.lng],{radius:7,fillColor:'#c0001a',color:'#fff',weight:2,fillOpacity:.95});
        m.bindTooltip('🔴 '+cleanName(s.name),{direction:'top'});
        m.addTo(planLayerGroup);
      });
  }

  // Stations
  L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:10,fillColor:'#1a7a3e',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.dep.name),{permanent:true,direction:'top'}).addTo(planLayerGroup);
  L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:10,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.arr.name),{permanent:true,direction:'top'}).addTo(planLayerGroup);

  // Routing Valhalla entre les deux stations
  const bikeType=document.getElementById('plan-type').value;
  const speed=bikeType==='meca'?16:21;
  const routeColor=bikeType==='meca'?'#e8001c':'#1a7a3e';
  try{
    const body={
      locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],
      costing:'bicycle',
      costing_options:{bicycle:{bicycle_type:'Road',cycling_speed:speed,use_roads:0.4,use_hills:0.2}},
      directions_type:'none'
    };
    let coords = null;

    // 1. Brouter — direct, pas de Valhalla (down)
    try {
      const brUrl = `https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=trekking&alternativeidx=0&format=geojson`;
      const rb = await fetch(brUrl, {signal: AbortSignal.timeout(12000)});
      if(rb.ok){
        const db = await rb.json();
        const geom = db.features?.[0]?.geometry;
        if(geom?.type==='LineString') coords = geom.coordinates.map(([lng,lat])=>[lat,lng]);
      }
    } catch(e){ console.warn('Brouter:', e.message); }

    // 2. Fallback OSRM bike
    if(!coords){
      try {
        console.log('Fallback OSRM…');
        const osrmUrl = `https://router.project-osrm.org/route/v1/bike/${combo.dep.lng},${combo.dep.lat};${combo.arr.lng},${combo.arr.lat}?overview=full&geometries=polyline6`;
        const ro = await fetch(osrmUrl, {signal: AbortSignal.timeout(12000)});
        if(ro.ok){
          const dor = await ro.json();
          const geom = dor.routes?.[0]?.geometry;
          if(geom) coords = decodePolyline(geom);
        }
      } catch(e){ console.warn('OSRM:', e.message); }
    }

    // 3. Fallback Valhalla si de retour
    if(!coords){
      try {
        const rv0 = await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(body))}`, {signal: AbortSignal.timeout(8000)});
        if(rv0.ok){
          const dv0 = await rv0.json();
          const leg0 = dv0.trip?.legs?.[0];
          if(leg0) coords = decodePolyline(leg0.shape);
        }
      } catch {}
    }

    if(coords){
      L.polyline(coords,{color:routeColor,weight:5,opacity:.9}).addTo(planLayerGroup);
      setTimeout(()=>{
        planMap.invalidateSize();
        planMap.fitBounds(L.polyline(coords).getBounds().pad(.2));
      }, 100);
    }
  }catch{}

  // Lignes en pointillés piéton
  if(planFromPos&&!planFromFixed)
    L.polyline([[planFromPos.lat,planFromPos.lng],[combo.dep.lat,combo.dep.lng]],{color:'#6e6e73',weight:2,dashArray:'5,5',opacity:.7}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.polyline([[combo.arr.lat,combo.arr.lng],[planToPos.lat,planToPos.lng]],{color:'#6e6e73',weight:2,dashArray:'5,5',opacity:.7}).addTo(planLayerGroup);

}

let _chartComboA=null, _chartComboB=null;

async function showComboCourbes(combo, targetEl=null){
  let zone=targetEl||document.getElementById('plan-courbes-zone');
  if(!zone){
    zone=document.createElement('div');
    zone.id='plan-courbes-zone';
    const card=document.getElementById('plan-results-card');
    card.appendChild(zone);
  }
  zone.innerHTML='<div class="loader">Chargement des courbes…</div>';

  const nowDate=new Date();
  const dowEl=document.getElementById('plan-dow');
  const hourEl=document.getElementById('plan-hour');
  const targetDow=dowEl&&dowEl.value?parseInt(dowEl.value):nowDate.getDay();
  const targetH2=hourEl&&hourEl.value?parseInt(hourEl.value):nowDate.getHours();
  const today=new Date();
  const promises=[];
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) promises.push(fetchDay(d.toISOString().slice(0,10)));
  }
  const allDays=(await Promise.all(promises)).filter(Boolean);

  const bikeType=document.getElementById('plan-type').value;
  const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';

  const labels=[], depData=[], arrData=[];
  for(let h=0;h<24;h++){
    labels.push(String(h).padStart(2,'0')+'h');
    const dv=[],av=[];
    allDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const sh=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(sh!==h) return;
        const sts=getSts(snap);
        const dep=sts.find(s=>s.number===combo.dep.number);
        const arr=sts.find(s=>s.number===combo.arr.number);
        if(dep?.bike_stands) dv.push((dep[depKey]||0)/dep.bike_stands*100);
        if(arr?.bike_stands) av.push(arr.available_bike_stands/arr.bike_stands*100);
      });
    });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
    depData.push(avg(dv));
    arrData.push(avg(av));
  }

  const bikeLabel=bikeType==='elec'?'⚡ Élec':bikeType==='meca'?'🔧 Méca':'🚲 Vélos';
  zone.innerHTML=`
    <div class="card" style="margin-top:0;border-top:none;border-radius:0 0 var(--radius) var(--radius)">
      <div class="card-title">Probabilité sur 24h · ${DOW_NAMES[targetDow]} · ${cleanName(combo.dep.name)} → ${cleanName(combo.arr.name)}</div>
      <canvas id="chart-combo" height="80"></canvas>
    </div>`;

  _chartComboA?.destroy();
  _chartComboA=new Chart(document.getElementById('chart-combo'),{type:'line',
    data:{labels,datasets:[
      {label:`${bikeLabel} dispo au départ`,data:depData,borderColor:'#1a7a3e',backgroundColor:'rgba(40,205,65,.08)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
      {label:'🅿️ Place dispo à l\'arrivée',data:arrData,borderColor:'#ff3b30',backgroundColor:'rgba(255,59,48,.06)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
    ]},
    options:{...chartOpts(),scales:{...chartOpts().scales,y:{...chartOpts().scales.y,max:100,ticks:{...chartOpts().scales.y.ticks,callback:v=>v+'%'}}}}
  });
}

    const sdMap=L.map('sd-map',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false})
      .setView([st.lat,st.lng],16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {attribution:''}).addTo(sdMap);
    L.circleMarker([st.lat,st.lng],{radius:10,fillColor:stationColor(st),color:'#fff',weight:2,fillOpacity:.95}).addTo(sdMap);
  }
  // Période selon la vue
  const d=document.getElementById('lb-date').value;
  const mth=document.getElementById('lb-month')?.value;
  const yr=document.getElementById('lb-year')?.value;

  let labels=[], dataElec=[], dataMeca=[];

  if(view==='day'){
    if(!d) return;
    const snaps=await fetchDay(d)||[];
    snaps.forEach(snap=>{
      const sts=getSts(snap), st2=sts.find(x=>x.number===number);
      if(!st2) return;
      const t=new Date(getTs(snap));
      labels.push(t.getHours()+'h');
      dataElec.push(st2.electrical_bikes||0);
      dataMeca.push(st2.mechanical_bikes||0);
    });
  } else if(view==='month'){
    if(!mth) return;
    const [y,mo]=mth.split('-').map(Number);
    const daysInMonth=new Date(y,mo,0).getDate();
    // Charger en parallèle par batch de 7 jours
    const allDays=Array.from({length:daysInMonth},(_,i)=>{
      const d=i+1, ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      labels.push(d+''); return ds;
    });
    for(let i=0;i<allDays.length;i+=7){
      const batch=allDays.slice(i,i+7);
      const results=await Promise.all(batch.map(ds=>fetchDay(ds)));
      results.forEach(snaps=>{
        snaps=snaps||[];
        let e=0,m=0;
        snaps.forEach(snap=>{
          const st2=getSts(snap).find(x=>x.number===number);
          if(st2){e+=st2.electrical_bikes||0;m+=st2.mechanical_bikes||0;}
        });
        dataElec.push(Math.round(e/Math.max(1,snaps.length)));
        dataMeca.push(Math.round(m/Math.max(1,snaps.length)));
      });
    }
    if(!yr) return;
    const today=new Date().toISOString().slice(0,10);
    for(let mo=1;mo<=12;mo++){
      labels.push(['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][mo-1]);
      const daysInM=new Date(yr,mo,0).getDate();
      let e=0,m=0,cnt=0;
      for(let day=1;day<=daysInM;day++){
        const dateStr=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        if(dateStr>today) continue;
        const snaps=await fetchDay(dateStr)||[];
        snaps.forEach(snap=>{
          const st2=getSts(snap).find(x=>x.number===number);
          if(st2){e+=st2.electrical_bikes||0;m+=st2.mechanical_bikes||0;cnt++;}
        });
      }
      dataElec.push(Math.round(e/Math.max(1,cnt)));
      dataMeca.push(Math.round(m/Math.max(1,cnt)));
    }
  }

  _chartSD_elec?.destroy();
  _chartSD_meca?.destroy();
  const totalElec=dataElec.reduce((a,b)=>a+(b||0),0);
  const totalMeca=dataMeca.reduce((a,b)=>a+(b||0),0);
  const mvLabel=view==='day'?'vélos moy.':'moy. vélos/j';
  const statsRow=document.getElementById('sd-stats-row');
  if(statsRow) statsRow.innerHTML=
    '<div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px">'+
    '<div style="font-size:15px;font-weight:600;color:#1a7a3e">'+totalElec+'</div>'+
    '<div style="font-size:10px;color:var(--sub)">⚡ '+mvLabel+'</div></div>'+
    '<div style="flex:1;background:#2c2c2e;border-radius:8px;padding:7px 10px">'+
    '<div style="font-size:15px;font-weight:600;color:#b52a2a">'+totalMeca+'</div>'+
    '<div style="font-size:10px;color:var(--sub)">🔧 '+mvLabel+'</div></div>';
  _chartSD_elec=new Chart(document.getElementById('sd-combined'),{type:chartType,
    data:{labels,datasets:[
      {label:'Élec',data:dataElec,borderColor:'#1a7a3e',backgroundColor:chartType==='line'?'#1a7a3e18':'#1a7a3ebb',borderWidth:chartType==='line'?1.8:0,borderRadius:2,tension:0,pointRadius:0,spanGaps:true,fill:chartType==='line'},
      {label:'Méca',data:dataMeca,borderColor:'#b52a2a',backgroundColor:chartType==='line'?'#b52a2a18':'#b52a2abb',borderWidth:chartType==='line'?1.8:0,borderRadius:2,tension:0,pointRadius:0,spanGaps:true,fill:chartType==='line'}
    ]},
    options:chartOpts()});
} // fin showStationDetail

function setModeNow(){
  const sl=document.getElementById('toggle-slider');
  if(sl) sl.style.transform='translateX(0)';
  document.getElementById('btn-now').style.color='var(--blue)';
  document.getElementById('btn-plan').style.color='var(--sub)';
  document.getElementById('plan-params').style.display='none';
  window._planMode='now';
}
function setModePlan(){
  const sl=document.getElementById('toggle-slider');
  if(sl){
    const w=document.getElementById('btn-now').offsetWidth;
    sl.style.transform=`translateX(${w}px)`;
    sl.style.width=document.getElementById('btn-plan').offsetWidth+'px';
  }
  document.getElementById('btn-now').style.color='var(--sub)';
  document.getElementById('btn-plan').style.color='var(--blue)';
  document.getElementById('plan-params').style.display='';
  window._planMode='plan';
}
window._planMode='now';

function setBikeType(t){
  document.getElementById('plan-type').value = t;
  const pos = t==='meca' ? 1 : 0;
  ['type-slider','type-slider-now'].forEach(id=>{
    const sl = document.getElementById(id);
    if(sl) sl.style.transform = `translateX(${pos*100}%)`;
  });
  ['elec','meca'].forEach(v=>{
    document.querySelectorAll(`[onclick="setBikeType('${v}')"]`).forEach(btn=>{
      btn.style.color = v===t ? 'var(--blue)' : 'var(--sub)';
    });
  });
}

function swapPlanFromTo(){
  const fromEl = document.getElementById('plan-from');
  const toEl   = document.getElementById('plan-to');
  const tmpVal = fromEl.value;
  fromEl.value = toEl.value;
  toEl.value   = tmpVal;
  // Inverser aussi les positions et stations fixes
  const tmpPos   = planFromPos;   planFromPos   = planToPos;   planToPos   = tmpPos;
  const tmpFixed = planFromFixed; planFromFixed = planToFixed; planToFixed = tmpFixed;
}

function syncHourSelect(){
  const t=document.getElementById('plan-hour-time')?.value||'00:00';
  const h=parseInt(t.split(':')[0]);
  const sel=document.getElementById('plan-hour');
  if(sel) sel.value=String(h);
}

async function boot(){
  initRanges();
  allStations=await loadLatest(); window._lastStationUpdate=Date.now(); updateLiveStatus();
  await computeMovements();
  initMap();
  renderStations();
}
boot();
setInterval(async()=>{
  allStations=await loadLatest();
  window._lastStationUpdate=Date.now(); updateLiveStatus();
  await computeMovements();
  // Update couleurs seulement, pas recréation complète
  _lastZoomMode=null; // force re-render au prochain renderStations
  renderStations();
},5*60*1000); window._lastStationUpdate=Date.now(); updateLiveStatus();
</script>
