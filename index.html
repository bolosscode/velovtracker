<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Vélo'v Lyon — Flux & Heatmap</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f5f7;
  --paper:#fff;
  --ink:#1d1d1f;
  --sub:#6e6e73;
  --dim:#aeaeb2;
  --border:#d2d2d7;
  --blue:#0071e3;
  --green:#28cd41;
  --orange:#ff9f0a;
  --red:#ff3b30;
  --radius:14px;
  --shadow:0 2px 14px rgba(0,0,0,.08);
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:300;
  height:56px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #ececec;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.brand{
  font-weight:700;
  font-size:18px;
}

.brand em{
  color:var(--blue);
  font-style:normal;
}

.clock{
  font-size:12px;
  color:var(--dim);
}

/* NAV */

nav{
  position:sticky;
  top:56px;
  z-index:250;
  background:#fff;
  border-bottom:1px solid #ececec;
  display:flex;
  padding:0 20px;
}

.tab{
  padding:14px 18px;
  cursor:pointer;
  color:var(--sub);
  border-bottom:2px solid transparent;
}

.tab.on{
  color:var(--blue);
  border-bottom-color:var(--blue);
}

/* MAIN */

main{
  max-width:1600px;
  margin:auto;
  padding:20px;
}

.panel{
  display:none;
}

.panel.on{
  display:block;
}

.card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:18px;
}

.card-title{
  font-size:11px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--sub);
  margin-bottom:14px;
}

/* MAP */

#map{
  height:calc(100vh - 140px);
  border-radius:var(--radius);
  overflow:hidden;
}

/* SEARCH */

.search-wrap{
  position:relative;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
}

.dropdown{
  position:absolute;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:none;
  z-index:50;
  max-height:280px;
  overflow-y:auto;
}

.dropdown.open{
  display:block;
}

.opt{
  padding:10px 14px;
  cursor:pointer;
}

.opt:hover{
  background:#f0f7ff;
}

/* RANGE */

.range{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:14px;
}

.range input{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--border);
}

.shortcuts{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.shortcuts button{
  padding:5px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  cursor:pointer;
  font-size:11px;
}

/* LOADER */

.loader,
.no-data{
  padding:40px;
  text-align:center;
  color:var(--dim);
}

/* LEGEND */

.legend{
  position:absolute;
  bottom:18px;
  left:18px;
  z-index:500;
  background:rgba(255,255,255,.95);
  padding:12px 14px;
  border-radius:12px;
  box-shadow:var(--shadow);
  font-size:12px;
  line-height:1.5;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.legend-dot{
  width:10px;
  height:10px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    Vélo<em>'</em>v Lyon — Flux
  </div>

  <div class="clock" id="clock"></div>
</header>

<nav>

  <div class="tab on" data-tab="map">
    🗺 Carte & Heatmap
  </div>

  <div class="tab" data-tab="courbes">
    📈 Courbes
  </div>

</nav>

<main>

<!-- MAP -->

<div class="panel on" id="tab-map">

  <div class="card">

    <div class="card-title">
      Flux départs + arrivées
    </div>

    <div class="range">

      <label>Du</label>

      <input
        type="datetime-local"
        id="start"
      />

      <label>au</label>

      <input
        type="datetime-local"
        id="end"
      />

    </div>

    <div class="shortcuts">
      <button onclick="shortcut(24)">24h</button>
      <button onclick="shortcut(168)">1 sem</button>
      <button onclick="shortcut(720)">1 mois</button>
      <button onclick="shortcut(2160)">3 mois</button>
      <button onclick="shortcut(8760)">1 an</button>
    </div>

  </div>

  <div style="position:relative">

    <div id="map"></div>

    <div class="legend">

      <div class="legend-row">
        <div
          class="legend-dot"
          style="background:#28cd41"
        ></div>

        Station disponible
      </div>

      <div class="legend-row">
        <div
          class="legend-dot"
          style="background:#ff9f0a"
        ></div>

        Peu de vélos
      </div>

      <div class="legend-row">
        <div
          class="legend-dot"
          style="background:#ff3b30"
        ></div>

        Station vide
      </div>

      <hr style="margin:8px 0">

      🔥 Heatmap = flux total<br>
      ↕ Flux popup = départs + arrivées

    </div>

  </div>

</div>

<!-- COURBES -->

<div class="panel" id="tab-courbes">

  <div class="card">

    <div class="card-title">
      Station & période
    </div>

    <div class="search-wrap">

      <input
        id="station-search"
        class="search"
        type="text"
        placeholder="Chercher une station..."
        autocomplete="off"
      />

      <div
        class="dropdown"
        id="station-dd"
      ></div>

    </div>

  </div>

  <div id="courbes-content">

    <div class="no-data">
      Sélectionnez une station.
    </div>

  </div>

</div>

</main>

<script>
'use strict';

/* =========================================================
   STATE
========================================================= */

let allStations = [];

let map = null;

let markers = null;

let heatLayer = null;

let selectedStation = null;

let chartFlux = null;
let chartElec = null;
let chartMeca = null;

let stationFlows = {};

const fmt =
  d => d.toISOString().slice(0,16);

/* =========================================================
   CLOCK
========================================================= */

setInterval(() => {

  document.getElementById('clock')
    .textContent =
      new Date()
        .toLocaleTimeString('fr-FR');

},1000);

/* =========================================================
   TABS
========================================================= */

document.querySelectorAll('.tab')
  .forEach(tab => {

    tab.onclick = () => {

      document.querySelectorAll('.tab')
        .forEach(t =>
          t.classList.remove('on')
        );

      document.querySelectorAll('.panel')
        .forEach(p =>
          p.classList.remove('on')
        );

      tab.classList.add('on');

      document.getElementById(
        'tab-' + tab.dataset.tab
      ).classList.add('on');

      setTimeout(() => {

        map?.invalidateSize();

      },120);

    };

});

/* =========================================================
   HELPERS
========================================================= */

function cleanName(n){

  return n
    .replace(/^\d+\s*[-–]\s*/,'')
    .trim();

}

function stationColor(st){

  if(
    !st.bike_stands
    || st.available_bikes === 0
  ){
    return '#ff3b30';
  }

  return (
    st.available_bikes
    / st.bike_stands
  ) <= .25
    ? '#ff9f0a'
    : '#28cd41';

}

function chartOpts(){

  return {

    responsive:true,

    plugins:{
      legend:{
        labels:{
          color:'#6e6e73'
        }
      }
    },

    scales:{
      x:{
        ticks:{
          color:'#6e6e73'
        }
      },
      y:{
        beginAtZero:true,
        ticks:{
          color:'#6e6e73'
        }
      }
    }

  };

}

/* =========================================================
   DATA
========================================================= */

function parseStation(r){

  let elec = 0;
  let meca = 0;

  try{

    const raw =
      r.main_stands
      || r.overflow_stands
      || '';

    if(raw){

      const s = (
        typeof raw === 'string'
        ? raw
        : JSON.stringify(raw)
      )
      .replace(/'/g,'"');

      const d = JSON.parse(s);

      elec =
        d?.availabilities?.electricalBikes
        ?? 0;

      meca =
        d?.availabilities?.mechanicalBikes
        ?? (r.available_bikes || 0);

    }

  }catch{}

  return {

    number:r.number,
    name:r.name || '',

    available_bikes:
      r.available_bikes || 0,

    available_bike_stands:
      r.available_bike_stands || 0,

    bike_stands:
      r.bike_stands || 0,

    electrical_bikes:elec,
    mechanical_bikes:meca,

    lat:r.lat,
    lng:r.lng

  };

}

async function loadLatest(){

  try{

    const r = await fetch(
      'https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1'
    );

    const data = await r.json();

    return (
      data.values || []
    ).map(parseStation);

  }catch{

    const r =
      await fetch('data/latest.json');

    const data = await r.json();

    return data.stations || [];

  }

}

async function fetchDay(date){

  try{

    const r = await fetch(
      `data/history/${date}.json`
    );

    return r.ok
      ? r.json()
      : null;

  }catch{

    return null;

  }

}

function getStationsFromSnapshot(snap){

  if(Array.isArray(snap)){
    return snap;
  }

  if(Array.isArray(snap.stations)){
    return snap.stations;
  }

  return [];

}

async function fetchRange(startMs,endMs){

  const start = new Date(startMs);
  const end = new Date(endMs);

  const days = Math.ceil(
    (endMs - startMs)
    / 86400e3
  );

  const dates = new Set();

  for(let i=0;i<=days;i++){

    const d = new Date(start);

    d.setDate(d.getDate()+i);

    dates.add(
      d.toISOString().slice(0,10)
    );

  }

  const results = await Promise.all(
    [...dates].map(fetchDay)
  );

  const all = [];

  results.forEach(snaps => {

    if(snaps?.length){
      all.push(...snaps);
    }

  });

  all.forEach(s => {

    if(
      !s.timestamp
      && s.last_update
    ){
      s.timestamp = s.last_update;
    }

  });

  return all
    .filter(s => {

      const t =
        new Date(s.timestamp)
          .getTime();

      return (
        t >= startMs
        && t <= endMs
      );

    })
    .sort((a,b) =>
      new Date(a.timestamp)
      - new Date(b.timestamp)
    );

}

/* =========================================================
   FLOW COMPUTATION
========================================================= */

async function computeFlows(){

  stationFlows = {};

  const range = getRange();

  if(!range){
    return;
  }

  const snaps =
    await fetchRange(
      range.startMs,
      range.endMs
    );

  if(!snaps || snaps.length < 2){
    return;
  }

  for(let i=1;i<snaps.length;i++){

    const prevStations =
      getStationsFromSnapshot(
        snaps[i-1]
      );

    const currStations =
      getStationsFromSnapshot(
        snaps[i]
      );

    currStations.forEach(curr => {

      const prev =
        prevStations.find(
          s => s.number === curr.number
        );

      if(!prev){
        return;
      }

      const delta =
        curr.available_bikes
        - prev.available_bikes;

      const flux =
        Math.abs(delta);

      if(!stationFlows[curr.number]){

        stationFlows[curr.number] = {

          flow:0,

          lat:curr.lat,
          lng:curr.lng

        };

      }

      stationFlows[curr.number]
        .flow += flux;

    });

  }

}

/* =========================================================
   MAP
========================================================= */

function initMap(){

  map = L.map('map')
    .setView([45.757,4.832],13);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {
      attribution:'© OpenStreetMap © CARTO'
    }
  ).addTo(map);

}

function renderStations(){

  if(markers){
    markers.clearLayers();
  }

  markers =
    L.layerGroup().addTo(map);

  allStations.forEach(st => {

    if(!st.lat || !st.lng){
      return;
    }

    const flow =
      stationFlows[st.number]?.flow || 0;

    const marker =
      L.circleMarker(
        [st.lat,st.lng],
        {
          radius:8,
          fillColor:
            stationColor(st),
          color:'#fff',
          weight:1.5,
          fillOpacity:.95
        }
      );

    marker.bindPopup(`
      <div style="min-width:230px">

        <div style="
          font-weight:700;
          margin-bottom:10px;
          font-size:14px
        ">
          ${cleanName(st.name)}
        </div>

        ⚡ Électriques :
        <b>${st.electrical_bikes}</b><br>

        🔧 Mécaniques :
        <b>${st.mechanical_bikes}</b><br>

        🚲 Total :
        <b>${st.available_bikes}</b><br>

        🅿️ Places :
        <b>${st.available_bike_stands}</b><br><br>

        ↕ Flux total :
        <b>${flow}</b>

      </div>
    `);

    markers.addLayer(marker);

  });

}

/* =========================================================
   HEATMAP
========================================================= */

function renderHeatmap(){

  if(heatLayer){

    map.removeLayer(heatLayer);

  }

  const arr =
    Object.values(stationFlows);

  if(!arr.length){
    return;
  }

  const max =
    Math.max(
      ...arr.map(
        x => x.flow
      )
    );

  const heatData =
    arr.map(x => [

      x.lat,
      x.lng,

      x.flow / max

    ]);

  heatLayer =
    L.heatLayer(
      heatData,
      {
        radius:40,
        blur:30,
        maxZoom:17,
        minOpacity:.35,

        gradient:{
          0.1:'#2c7bb6',
          0.3:'#00a6ca',
          0.5:'#00ccbc',
          0.7:'#90eb9d',
          0.85:'#f9d057',
          1:'#ff3b30'
        }
      }
    ).addTo(map);

}

/* =========================================================
   SEARCH
========================================================= */

function buildSearch(){

  const input =
    document.getElementById(
      'station-search'
    );

  const dd =
    document.getElementById(
      'station-dd'
    );

  input.addEventListener(
    'input',
    () => {

      const q =
        input.value
          .toLowerCase()
          .trim();

      dd.innerHTML = '';

      if(!q){

        dd.classList.remove('open');
        return;

      }

      const matches =
        allStations
          .filter(s =>
            cleanName(s.name)
              .toLowerCase()
              .includes(q)
          )
          .slice(0,12);

      matches.forEach(st => {

        const el =
          document.createElement('div');

        el.className = 'opt';

        el.textContent =
          cleanName(st.name);

        el.onclick = () => {

          input.value =
            cleanName(st.name);

          dd.classList.remove('open');

          selectedStation = st;

          renderCourbes();

        };

        dd.appendChild(el);

      });

      dd.classList.add('open');

    }
  );

}

/* =========================================================
   RANGE
========================================================= */

function getRange(){

  const s =
    document.getElementById('start')
      .value;

  const e =
    document.getElementById('end')
      .value;

  if(!s || !e){
    return null;
  }

  return {

    startMs:
      new Date(s).getTime(),

    endMs:
      new Date(e).getTime()

  };

}

async function shortcut(hours){

  const now = new Date();

  const start =
    new Date(
      now - hours * 3600e3
    );

  document.getElementById('start')
    .value = fmt(start);

  document.getElementById('end')
    .value = fmt(now);

  await refreshFlows();

}

function initRange(){

  const now = new Date();

  document.getElementById('start')
    .value =
      fmt(
        new Date(
          now - 24*3600e3
        )
      );

  document.getElementById('end')
    .value = fmt(now);

}

/* =========================================================
   COURBES
========================================================= */

async function renderCourbes(){

  const content =
    document.getElementById(
      'courbes-content'
    );

  if(!selectedStation){
    return;
  }

  content.innerHTML =
    '<div class="loader">Chargement...</div>';

  const range = getRange();

  if(!range){
    return;
  }

  const snaps =
    await fetchRange(
      range.startMs,
      range.endMs
    );

  if(!snaps.length){

    content.innerHTML =
      '<div class="no-data">Aucune donnée.</div>';

    return;

  }

  const labels = [];

  const fluxData = [];
  const elec = [];
  const meca = [];

  const id =
    selectedStation.number;

  snaps.forEach((snap,i) => {

    const stations =
      getStationsFromSnapshot(snap);

    const st =
      stations.find(
        s => s.number === id
      );

    if(!st){
      return;
    }

    labels.push(
      new Date(snap.timestamp)
        .toLocaleString('fr-FR')
    );

    elec.push(
      st.electrical_bikes || 0
    );

    meca.push(
      st.mechanical_bikes || 0
    );

    if(i === 0){

      fluxData.push(0);

    }else{

      const prevStations =
        getStationsFromSnapshot(
          snaps[i-1]
        );

      const prev =
        prevStations.find(
          s => s.number === id
        );

      const delta =
        prev
        ? Math.abs(
            st.available_bikes
            - prev.available_bikes
          )
        : 0;

      fluxData.push(delta);

    }

  });

  content.innerHTML = `
    <div class="card">
      <div class="card-title">
        Flux total
      </div>
      <canvas id="flux-chart"></canvas>
    </div>

    <div class="card">
      <div class="card-title">
        Électriques
      </div>
      <canvas id="elec-chart"></canvas>
    </div>

    <div class="card">
      <div class="card-title">
        Mécaniques
      </div>
      <canvas id="meca-chart"></canvas>
    </div>
  `;

  chartFlux?.destroy();
  chartElec?.destroy();
  chartMeca?.destroy();

  chartFlux =
    new Chart(
      document.getElementById(
        'flux-chart'
      ),
      {
        type:'line',
        data:{
          labels,
          datasets:[{
            label:'Flux',
            data:fluxData,
            borderWidth:2,
            tension:.15
          }]
        },
        options:chartOpts()
      }
    );

  chartElec =
    new Chart(
      document.getElementById(
        'elec-chart'
      ),
      {
        type:'line',
        data:{
          labels,
          datasets:[{
            label:'Électriques',
            data:elec,
            borderWidth:2,
            tension:.15
          }]
        },
        options:chartOpts()
      }
    );

  chartMeca =
    new Chart(
      document.getElementById(
        'meca-chart'
      ),
      {
        type:'line',
        data:{
          labels,
          datasets:[{
            label:'Mécaniques',
            data:meca,
            borderWidth:2,
            tension:.15
          }]
        },
        options:chartOpts()
      }
    );

}

/* =========================================================
   REFRESH
========================================================= */

async function refreshFlows(){

  await computeFlows();

  renderStations();

  renderHeatmap();

}

/* =========================================================
   BOOT
========================================================= */

async function boot(){

  initRange();

  allStations =
    await loadLatest();

  initMap();

  buildSearch();

  await refreshFlows();

}

boot();

/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(async () => {

  allStations =
    await loadLatest();

  await refreshFlows();

}, 5 * 60 * 1000);
</script>

</body>
</html>
