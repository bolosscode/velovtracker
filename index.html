async function computePlan(){
  // Résultats dans le flottant
  const results=document.getElementById('plan-results');
  const resultsCard=results; // alias pour compatibilité
  _openComboIdx=null;
  window._planCombos=null;
  if(planLayerGroup) planLayerGroup.clearLayers();
  // Vider le cache vélos : sinon une nouvelle recherche réutilisant la même station
  // de départ ne réaffiche jamais les vélos recommandés (DOM neuf, cache obsolète)
  for(const k in _comboBikesCache) delete _comboBikesCache[k];

  // Vérifier les champs AVANT tout chargement
  if(!planFromPos && !planFromFixed){
    resultsCard.style.display='block';
    results.innerHTML='<div class="no-data">Sélectionnez un point de départ.</div>';
    return;
  }
  if(!planToPos && !planToFixed){
    resultsCard.style.display='block';
    results.innerHTML='<div class="no-data">Destination manquante.</div>';
    return;
  }

  // Ouvrir/étendre le flottant
  document.getElementById('plan-float')?.style.setProperty('max-height','80vh');

  // Météo
  const meteo=await fetchCurrentMeteo();
  const meteoEl=document.getElementById('plan-meteo');
  if(meteo&&meteoEl){
    const m=meteoFromCode(meteo.weathercode,meteo.rain);
    const parts=[];
    if(meteo.temp!==undefined) parts.push((m.icon||'')+' '+meteo.temp+'°C');
    if(meteo.wind!==undefined) parts.push(meteo.wind+' km/h');
    meteoEl.textContent=parts.join(' · ');
  }
  const isRainy=(meteo?.precipitation??0)>0.1;
  const currentlyRainy=isRainy;
  const currentPrecip=meteo?.precipitation??0;

  const bikeType=document.getElementById('plan-type').value;
  const radius=parseInt(document.getElementById('plan-radius').value);
  const topN=10;
  const isNowMode=(window._planMode||'now')==='now';
  const now2=new Date();
  const targetDow=isNowMode?now2.getDay():parseInt(document.getElementById('plan-dow')?.value)||now2.getDay();
  const planHourEl=document.getElementById('plan-hour-time');
  const planHourVal=planHourEl?.value?parseInt(planHourEl.value.split(':')[0]):now2.getHours();
  const targetH=isNowMode?now2.getHours():planHourVal;
  const bikeSpeedKmh=bikeType==='meca'?16:22;



  // Charger l'historique — fenêtre adaptée au mode, bonus saisonnier dans les deux :
  //  · Live ("Maintenant")  : 13 dernières semaines + même semaine l'an dernier → rapide
  //  · Planifier            : tout l'historique + même semaine l'an dernier
  results.innerHTML=`<div class="loader">${isNowMode?'Calcul en cours…':'Analyse de l\'historique…'}</div>`;
  const allDays=[];
  const today2=new Date();
  const targetDates=[];
  const dataStart=new Date('2025-01-29');
  const maxWeeksLive=13; // ~90 jours, largement suffisant vu wRec=exp(-dayIdx/45)
  let weeksCollected=0;
  for(let i=0;;i++){
    const d=new Date(today2); d.setDate(d.getDate()-i);
    if(d<dataStart) break;
    if(d.getDay()===targetDow){
      targetDates.push(d.toISOString().slice(0,10));
      weeksCollected++;
      if(isNowMode&&weeksCollected>=maxWeeksLive) break;
    }
  }
  // Bonus saisonnier (tous modes) : même semaine ±7j l'an dernier
  // → capte les variations saisonnières (ex: août moins chargé qu'octobre)
  // Coût : max 15 jours de plus, un seul batch supplémentaire, impact négligeable même en Live
  {
    const lastYear=new Date(today2); lastYear.setFullYear(lastYear.getFullYear()-1);
    for(let off=-7; off<=7; off++){
      const d=new Date(lastYear); d.setDate(d.getDate()+off);
      if(d>=dataStart && d.getDay()===targetDow){
        const ds=d.toISOString().slice(0,10);
        if(!targetDates.includes(ds)) targetDates.push(ds);
      }
    }
  }
  // Colonnes (cache IndexedDB + Web Workers) : l'ordre des jours est conservé (poids de récence)
  (await loadColsMany(targetDates)).filter(Boolean).forEach(d=>allDays.push(d));

  // Stations proches
  // Si station fixée → station prioritaire + voisines si vide/pleine (mode now uniquement)
  const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';
  let depStations, arrStations;
  if(planFromFixed){
    const depLive=isNowMode?allStations.find(s=>s.number===planFromFixed.number):null;
    const depEmpty=depLive&&(depLive[depKey]||0)===0;
    if(depEmpty){
      // Station vide → proposer aussi les voisines
      depStations=allStations.filter(s=>s.lat&&s.lng)
        .map(s=>({...s,dist:haversine(planFromFixed.lat,planFromFixed.lng,s.lat,s.lng)}))
        .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
      // Garder la station fixée en premier quand même
      if(!depStations.find(s=>s.number===planFromFixed.number))
        depStations=[{...planFromFixed,dist:0},...depStations].slice(0,6);
    } else {
      depStations=[{...planFromFixed, dist:0}];
    }
  } else {
    depStations=allStations.filter(s=>s.lat&&s.lng)
      .map(s=>({...s,dist:haversine(planFromPos.lat,planFromPos.lng,s.lat,s.lng)}))
      .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
  }
  if(planToFixed){
    const arrLive=isNowMode?allStations.find(s=>s.number===planToFixed.number):null;
    const arrFull=arrLive&&(arrLive.available_bike_stands||0)===0;
    if(arrFull){
      // Station pleine → proposer aussi les voisines
      arrStations=allStations.filter(s=>s.lat&&s.lng)
        .map(s=>({...s,dist:haversine(planToFixed.lat,planToFixed.lng,s.lat,s.lng)}))
        .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
      if(!arrStations.find(s=>s.number===planToFixed.number))
        arrStations=[{...planToFixed,dist:0},...arrStations].slice(0,6);
    } else {
      arrStations=[{...planToFixed, dist:0}];
    }
  } else {
    arrStations=allStations.filter(s=>s.lat&&s.lng)
      .map(s=>({...s,dist:haversine(planToPos.lat,planToPos.lng,s.lat,s.lng)}))
      .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
  }

  if(!depStations.length||!arrStations.length){
    results.innerHTML='<div class="no-data">Aucune station dans ce rayon. Augmentez le rayon.</div>';
    return;
  }

  // Matrice météo
  const RAIN_R={1:[-0.019,-0.132,-0.133,-0.018,-0.132,-0.016,0.104,0.071,0.071,0.066,-0.021,-0.508,-0.224,-0.286,-0.224,-0.511,-0.443,-0.268,-0.129,-0.218,-0.278,-0.274,-0.25,-0.264],2:[0.001,0.026,0.006,0.067,-0.103,0.057,0.057,0.037,0.077,0.154,0.055,-0.294,-0.246,-0.149,-0.34,-0.379,-0.394,-0.34,-0.248,-0.26,-0.187,-0.309,-0.237,-0.084],3:[-0.003,-0.061,0.095,-0.027,0.045,-0.137,-0.22,-0.188,-0.223,-0.113,0.056,0.077,-0.064,-0.082,-0.23,-0.063,-0.21,-0.114,-0.175,-0.412,-0.359,-0.417,-0.135,-0.276],4:[-0.024,-0.207,-0.155,-0.137,-0.147,-0.229,-0.263,-0.111,-0.118,-0.176,-0.368,-0.434,-0.332,-0.514,-0.494,-0.495,-0.543,-0.284,-0.31,-0.46,-0.349,-0.215,-0.483,-0.209],5:[-0.046,-0.26,-0.268,-0.179,-0.282,-0.173,-0.087,-0.04,-0.042,-0.194,-0.363,-0.396,-0.327,-0.363,-0.184,-0.13,-0.196,-0.325,-0.45,-0.523,-0.26,-0.281,-0.352,-0.431],6:[0.026,-0.056,0.026,-0.189,-0.121,0,0,-0.189,-0.208,0.013,-0.162,-0.49,-0.595,-0.563,-0.422,0.032,-0.228,0.096,-0.108,-0.188,-0.104,-0.327,-0.466,-0.11],7:[-0.023,-0.04,-0.26,0.069,0.116,-0.048,-0.043,0.019,0.09,-0.013,0.161,-0.361,-0.51,-0.299,-0.096,-0.045,-0.039,-0.287,-0.316,-0.438,-0.47,-0.022,-0.533,-0.406],8:[-0.018,-0.046,-0.092,-0.205,-0.197,-0.225,-0.047,0.07,0.186,0.181,-0.214,0.017,0.043,0.233,0.125,0.031,-0.125,0.148,0.128,-0.214,-0.248,0.175,-0.084,-0.183],9:[-0.025,-0.337,-0.28,-0.203,-0.274,-0.084,-0.084,-0.014,-0.088,-0.089,-0.143,-0.633,-0.187,-0.681,-0.659,-0.802,-0.842,-0.379,-0.114,-0.024,-0.482,-0.417,-0.062,-0.16],10:[-0.029,-0.147,-0.104,-0.116,-0.161,-0.136,-0.098,-0.118,-0.077,-0.154,-0.562,-0.526,-0.627,-0.579,-0.356,-0.289,-0.432,-0.646,-0.543,-0.459,-0.515,-0.314,-0.158,0.031],11:[-0.006,0.027,0.043,-0.009,0.048,0.116,-0.265,0.032,-0.105,-0.441,-0.623,-0.601,-0.484,-0.424,-0.356,-0.27,-0.424,-0.425,-0.336,-0.525,-0.268,-0.245,-0.358,-0.505],12:[0.007,-0.137,-0.209,0.042,-0.168,-0.087,-0.019,-0.071,0.063,-0.04,-0.09,-0.11,-0.127,-0.055,0.015,0.112,0.123,-0.032,0.135,-0.029,-0.109,-0.132,-0.35,-0.087]};
  function meteoW(snapMeteo,rainy){
    if(!snapMeteo) return 0.8;
    if(snapMeteo.rain===rainy) return 1.0;
    try{ const mo=new Date(snapMeteo._ts||0).getMonth()+1||new Date().getMonth()+1; const r=(RAIN_R[mo]||RAIN_R[1])[targetH]||-0.15; return Math.max(0.3,1.0-Math.abs(r)*2); }catch{ return 0.5; }
  }

  // Calcul probas depuis l'historique (colonnes)
  const allIds=new Set([...depStations.map(s=>s.number),...arrStations.map(s=>s.number)]);
  const nowMinutes=targetH*60;
  const stationProba=stationProbaFromCols(allIds, allDays, nowMinutes, isRainy, depKey);

  // Générer combinaisons
  const combos=[];
  for(const dep of depStations){
    for(const arr of arrStations){
      if(dep.number===arr.number) continue;
      const pd=stationProba[dep.number],pa=stationProba[arr.number];
      const depPct=pd?.dep??null,arrPct=pa?.arr??null;
      const depProb=pd?.depProb??null,arrProb=pa?.arrProb??null;
      if(depPct===null||arrPct===null) continue;
      const dist=haversine(dep.lat,dep.lng,arr.lat,arr.lng);
      const rideMin=Math.round(dist/1000/bikeSpeedKmh*60);
      const scoreBase=(depProb!==null&&arrProb!==null)?Math.round(depProb*0.6+arrProb*0.4):Math.round((depPct||0)*0.6+(arrPct||0)*0.4);
      let score=scoreBase;
      if(isNowMode){
        const liveDep=allStations.find(s=>s.number===dep.number);
        const liveArr=allStations.find(s=>s.number===arr.number);
        if(isNowMode&&liveDep&&liveDep.bike_stands>0){
          const liveDepCount=bikeType==='elec'?(liveDep.electrical_bikes||0):bikeType==='meca'?(liveDep.mechanical_bikes||0):(liveDep.available_bikes||0);
          if(liveDepCount===0){
            score=0; // Aucun vélo disponible maintenant → score 0
          } else {
            const liveDepPct=liveDepCount/liveDep.bike_stands*100;
            const liveArrPct=liveArr&&liveArr.bike_stands>0?liveArr.available_bike_stands/liveArr.bike_stands*100:50;
            score=Math.round(liveDepPct*0.5+liveArrPct*0.2+scoreBase*0.3);
          }
        }
        // Mode plan : score = pur historique pondéré
        // scoreBase déjà calculé ci-dessus
      }
      const liveDep2=allStations.find(s=>s.number===dep.number);
      const liveArr2=allStations.find(s=>s.number===arr.number);

      // Batterie : détecter si aucun élec n'a l'autonomie pour tout le trajet
      let battPenalty=false, battShortfall=false;
      const stBikesRaw=(_allBikesByStation?.get(dep.number)||[]);
      const stBikes=stBikesRaw.filter(b=>b.status==='AVAILABLE'&&b.type==='ELECTRICAL').map(b=>({
        batt: b.battery?.percentage!=null?b.battery.percentage:null
      }));
      if(bikeType==='elec'&&stBikes.length>0){
        const distKm=dist/1000;
        const minBatt=Math.ceil(distKm/40*100*1.10);
        const hasViable=stBikes.some(b=>b.batt!=null&&b.batt>=minBatt);
        if(!hasViable){ battPenalty=true; battShortfall=true; }
        // Ne plus mettre le score à 0 sèchement : si un relais permet de
        // couvrir le trajet en 2 étapes, la combinaison reste valable.
      }

      // Prix : surcoût si trajet > limite gratuite
      const priceLimit=bikeType==='meca'?45:30;
      const overMin=Math.max(0,rideMin-priceLimit);
      const overPrice=overMin>0?Math.round(overMin*0.10*100)/100:0;

      // Segmentation : suggérer station relai si trajet trop long en temps
      // (dépassement du forfait gratuit) OU si la batterie ne suffit pas
      // pour toute la distance — même mécanisme dans les deux cas.
      let relaiStation=null;
      if(overMin>2||battShortfall){
        const midLat=(dep.lat+arr.lat)/2, midLng=(dep.lng+arr.lng)/2;
        relaiStation=allStations
          .filter(s=>s.number!==dep.number&&s.number!==arr.number&&s.available_bike_stands>0)
          .map(s=>({...s,d:haversine(s.lat,s.lng,midLat,midLng)}))
          .sort((a,b)=>a.d-b.d)[0]||null;
        // Si un relais batterie a été trouvé, ce n'est plus un échec sec :
        // on retire la pénalité de score brutale, le badge visuel reste
        // pour informer, mais la combinaison redevient viable via le relais.
        if(battShortfall&&relaiStation) battPenalty=true;
        else if(battShortfall&&!relaiStation) score=0; // vraiment aucune solution
      }

      combos.push({
        dep:Object.assign({},dep,{live:liveDep2||null}),
        arr:Object.assign({},arr,{live:liveArr2||null}),
        depPct,arrPct,depProb,arrProb,
        depN:pd?.depN??null,depElecN:pd?.depElecN??null,depMecaN:pd?.depMecaN??null,arrN:pa?.arrN??null,
        score,dist,rideMin,samples:pd?.samples??0,battPenalty,overPrice,relaiStation
      });
    }
  }
  combos.sort((a,b)=>b.score-a.score);
  const top=combos.slice(0,topN);

  // Mode instantané : % de risque que la station d'ARRIVÉE soit pleine à l'heure d'arrivée,
  // même jour de la semaine sur les 60 derniers jours (voir fullRiskPct).
  if(isNowMode&&top.length){
    try{
      const nowMin=now2.getHours()*60+now2.getMinutes();
      const colsByDow={};
      const colsFor=async dow=>{
        if(!colsByDow[dow]){
          const dates=lastDays(HIST_PRELOAD_DAYS).filter(d=>new Date(d+'T12:00:00').getDay()===dow);
          colsByDow[dow]=(await loadColsMany(dates)).filter(Boolean);
        }
        return colsByDow[dow];
      };
      for(const cb of top){
        const walkDep=(planFromPos&&!planFromFixed)?walkMinutes(haversine(planFromPos.lat,planFromPos.lng,cb.dep.lat,cb.dep.lng)):0;
        let arrMin=nowMin+walkDep+cb.rideMin, dow=targetDow;
        if(arrMin>=1440){ arrMin-=1440; dow=(targetDow+1)%7; }
        cb.fullRisk=fullRiskPct(await colsFor(dow), cb.arr.number, arrMin);
      }
    }catch(e){ console.warn('risque station pleine indisponible', e); }
  }

  if(!top.length){
    results.innerHTML='<div class="no-data">Pas assez de données historiques pour ces stations.</div>';
    return;
  }

  const meteoNote=isRainy?' 🌧️':'';
  document.getElementById('plan-results-title').textContent=
    `Top ${top.length} combinaisons · ${DOW_NAMES[targetDow]} ${String(targetH).padStart(2,'0')}h · ${bikeType==='elec'?'Élec':bikeType==='meca'?'Méca':'Tous'} · ${allDays.length} jours${meteoNote}`;

  // Warning si station fixée vide/pleine
  const depLiveWarn=planFromFixed&&allStations.find(s=>s.number===planFromFixed.number);
  const depEmptyWarn=depLiveWarn&&(depLiveWarn[depKey]||0)===0;
  const arrLiveWarn=planToFixed&&allStations.find(s=>s.number===planToFixed.number);
  const arrFullWarn=arrLiveWarn&&(arrLiveWarn.available_bike_stands||0)===0;

  const renderComboList=(limit)=>{
    const shown=top.slice(0,limit);
    const html=shown.map((combo,i)=>comboPillHtml(combo,i,false)).join('');
    // Desktop : liste + bouton voir plus
    if(window.innerWidth>640){
      const more=top.length>limit
        ?`<div style="text-align:center;padding:8px"><button onclick="window._showMoreCombos()" style="padding:5px 16px;border-radius:20px;border:0.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);font-size:12px;cursor:pointer;color:rgba(255,255,255,.55)">Voir les ${top.length-limit} autres</button></div>`:'';
      return html+more;
    }
    // Mobile : slider natif scroll-snap (fiable, momentum + snap gérés par le navigateur)
    const dots=shown.map((_,i)=>`<div class="cdot${i===0?' on':''}" style="width:${i===0?'14':'5'}px;cursor:pointer" data-cidx="${i}" onclick="selectComboIdx(${i})"></div>`).join('');
    return `<div id="combo-slider-track" style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 0 2px">${html.replace(/margin-bottom:4px/g,'min-width:calc(100% - 18px);flex-shrink:0;margin-bottom:0;margin-left:0px;scroll-snap-align:start')}</div>
    <div class="combo-dots" id="combo-dots" style="display:flex;justify-content:center;gap:5px;padding:6px 0 2px">${dots}</div>`;
  };

  const topScore=top[0]?.score??0;
  const autoLimit=topScore<30?top.length:topScore<50?Math.min(5,top.length):3;
  let _warnHtml='';
  if(isNowMode&&depEmptyWarn) _warnHtml+=`<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:10.5px;font-weight:800;color:#fff;background:var(--g-cap-alert);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5);border-radius:999px;margin-bottom:6px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Station vide · stations voisines proposées</div>`;
  if(isNowMode&&arrFullWarn) _warnHtml+=`<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:10.5px;font-weight:800;color:#fff;background:var(--g-cap-alert);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5);border-radius:999px;margin-bottom:6px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Station pleine · stations voisines proposées</div>`;
  // Input feedback
  const _fromInput=document.getElementById('plan-from');
  const _toInput=document.getElementById('plan-to');
  if(_fromInput) _fromInput.style.color='';
  if(_toInput) _toInput.style.color='';
  results.innerHTML=_warnHtml+renderComboList(autoLimit);
  if(window.innerWidth<=640) setTimeout(initSliderSwipe,50);
  window._showMoreCombos=()=>{ results.innerHTML=renderComboList(top.length); drawTop3Routes(); loadAllComboBikes(); setTimeout(initSliderSwipe,50); };
  window._planCombos=top;
  _openComboIdx=null;
  drawTop3Routes();
  // Charger les vélos recommandés pour toutes les cards affichées, sans attendre de clic
  loadAllComboBikes();
  if(typeof hideBackgroundStations==='function') hideBackgroundStations();
  if(window.innerWidth<=640) compactPlanFloat();
}

// Trace le segment piéton (adresse ↔ station) via BRouter hiking-mountain,
// factorisé pour être appelable à la fois depuis showRoute (détail) et
// drawTop3Routes (affichage automatique initial — sans ça, le piéton
// n'apparaissait jamais tant qu'on ne cliquait pas explicitement une card).
async function drawWalkSegment(from, to){
  let wcoords=null;
  try{
    const wb=await fetch(`https://brouter.de/brouter?lonlats=${from.lng},${from.lat}|${to.lng},${to.lat}&profile=hiking-mountain&alternativeidx=0&format=geojson`,{signal:AbortSignal.timeout(8000)});
    if(wb.ok){
      const wdB=await wb.json();
      const wgeomB=wdB.features?.[0]?.geometry;
      if(wgeomB?.type==='LineString') wcoords=wgeomB.coordinates.map(([ln,la])=>[la,ln]);
    }
  }catch{}
  if(!wcoords){
    try{
      const wo=await fetch(`https://router.project-osrm.org/route/v1/foot/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=polyline6`,{signal:AbortSignal.timeout(6000)});
      if(wo.ok){
        const wd=await wo.json();
        const wgeom=wd.routes?.[0]?.geometry;
        if(wgeom) wcoords=decodePolyline(wgeom);
      }
    }catch{}
  }
  if(wcoords){
    L.polyline(wcoords,{color:'#fff',weight:5,opacity:.3,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
    L.polyline(wcoords,{color:'#0a84ff',weight:2.5,dashArray:'5,6',opacity:.8,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
  } else {
    L.polyline([[from.lat,from.lng],[to.lat,to.lng]],{color:'#0a84ff',weight:2,dashArray:'5,5',opacity:.6}).addTo(planLayerGroup);
  }
}

async function drawWalkSegments(combo){
  const walkRoutes=[];
  if(planFromPos&&!planFromFixed) walkRoutes.push({from:planFromPos,to:{lat:combo.dep.lat,lng:combo.dep.lng}});
  if(planToPos&&!planToFixed) walkRoutes.push({from:{lat:combo.arr.lat,lng:combo.arr.lng},to:planToPos});
  for(const wr of walkRoutes){
    await drawWalkSegment(wr.from, wr.to);
  }
}

async function drawTop3Routes(){
  const top=window._planCombos; if(!top||!top.length) return;

  const bikeType=document.getElementById('plan-type')?.value||'elec';
  const colorsElec=['#1a6b36','#2a8a4a','#3eaa62'];
  const colorsMeca=['#7a1a1a','#a82a2a','#d04444'];
  const colors=bikeType==='meca'?colorsMeca:colorsElec;
  const weights=[4,3,2.5];
  const opacities=[0.95,0.75,0.55];
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);
  const radius=parseInt(document.getElementById('plan-radius').value)||500;
  // Marqueurs départ/arrivée
  // Points départ/arrivée + cercles de rayon
  if(planFromPos&&!planFromFixed){
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:7,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planFromPos.lat,planFromPos.lng],{radius,color:'#1a9e3f',fillColor:'#1a9e3f',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  if(planToPos&&!planToFixed){
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:7,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planToPos.lat,planToPos.lng],{radius,color:'#c0001a',fillColor:'#c0001a',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  // Tracer les 3 premiers en parallèle
  const routePromises=top.slice(0,3).map(async(combo,i)=>{
    let coords=null;
    const bikeT=window._planBikeType||'elec';
    await new Promise(r=>setTimeout(r, i*150));
    const fetchRoute=async()=>{
      const [vr3,br3]=await Promise.allSettled([
        (async()=>{
          const b3={locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],costing:'bicycle',
            costing_options:{bicycle:{bicycle_type:bikeT==='meca'?'Hybrid':'Road',cycling_speed:bikeT==='meca'?15:22,use_roads:0.1,use_hills:bikeT==='meca'?0:0.7}},directions_type:'none'};
          const r=await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(b3))}`,{signal:AbortSignal.timeout(10000)});
          if(!r.ok) throw 0;
          const d=await r.json(); const leg=d.trip?.legs?.[0]; if(!leg) throw 0;
          return {coords:decodePolyline(leg.shape),dist:(d.trip.summary?.length||0)*1000};
        })(),
        (async()=>{
          const r=await fetch(`https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=trekking&alternativeidx=0&format=geojson`,{signal:AbortSignal.timeout(10000)});
          if(!r.ok) throw 0;
          const d=await r.json(); const geom=d.features?.[0]?.geometry; if(!geom) throw 0;
          return {coords:geom.coordinates.map(([ln,la])=>[la,ln]),dist:parseInt(d.features[0].properties?.['track-length'])||0};
        })()
      ]);
      const cands=[];
      if(vr3.status==='fulfilled') cands.push(vr3.value);
      if(br3.status==='fulfilled') cands.push(br3.value);
      return cands.length ? cands.sort((a,b)=>a.dist-b.dist)[0].coords : null;
    };
    coords=await fetchRoute();
    if(!coords){ await new Promise(r=>setTimeout(r,500)); coords=await fetchRoute(); }
    return {coords,i,combo};
  });
  const routes=await Promise.all(routePromises);

  // Déviation via relais (combo principal uniquement) : vrai trajet routier
  // dep→relais puis relais→arr, dessiné EN PREMIER (donc en-dessous — le
  // tracé vert/rouge normal, ajouté après dans la boucle, le recouvrira
  // partout sauf là où la déviation réelle diverge du trajet direct).
  const mainCombo=routes.find(r=>r.i===0)?.combo;
  if(mainCombo?.relaiStation){
    const fetchLeg=async(from,to)=>{
      try{
        const r=await fetch(`https://brouter.de/brouter?lonlats=${from.lng},${from.lat}|${to.lng},${to.lat}&profile=trekking&alternativeidx=0&format=geojson`,{signal:AbortSignal.timeout(9000)});
        if(!r.ok) return null;
        const d=await r.json();
        const geom=d.features?.[0]?.geometry;
        return geom?.type==='LineString' ? geom.coordinates.map(([ln,la])=>[la,ln]) : null;
      }catch{ return null; }
    };
    const [leg1,leg2]=await Promise.all([
      fetchLeg({lat:mainCombo.dep.lat,lng:mainCombo.dep.lng},{lat:mainCombo.relaiStation.lat,lng:mainCombo.relaiStation.lng}),
      fetchLeg({lat:mainCombo.relaiStation.lat,lng:mainCombo.relaiStation.lng},{lat:mainCombo.arr.lat,lng:mainCombo.arr.lng})
    ]);
    if(leg1&&leg2){
      const relaiCoords=[...leg1,...leg2];
      L.polyline(relaiCoords,{color:'#ff9f0a',weight:5,opacity:.85,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
    }
  }

  // Stocker les tracés + leurs poids/opacités de base pour pouvoir les
  // mettre en valeur au swipe SANS tout effacer/redessiner (voir highlightComboOnMap)
  window._comboRouteLayers={};
  window._comboBaseStyle={};

  // Tracer en ordre inverse (le 1er par-dessus)
  [...routes].reverse().forEach(({coords,i,combo})=>{
    const _i=i;
    if(coords){
      L.polyline(coords,{color:'#fff',weight:weights[i]+3,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      const pl=L.polyline(coords,{color:colors[i],weight:weights[i],opacity:opacities[i],lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      pl.on('click',()=>selectComboIdx(_i));
      window._comboRouteLayers[i]=pl;
      window._comboBaseStyle[i]={weight:weights[i],opacity:opacities[i]};
      // Zone de clic élargie invisible
      L.polyline(coords,{color:'transparent',weight:20,opacity:0}).on('click',()=>selectComboIdx(_i)).addTo(planLayerGroup);
    }
    // Marqueurs stations
    const depM=L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    depM.bindTooltip(cleanName(combo.dep.name),{direction:'top',permanent:false});
    depM.on('click',()=>selectComboIdx(_i));
    depM.addTo(planLayerGroup);
    const arrM=L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    arrM.bindTooltip(cleanName(combo.arr.name),{direction:'top',permanent:false});
    arrM.on('click',()=>selectComboIdx(_i));
    arrM.addTo(planLayerGroup);

    // Station relai (trajet trop long) — affichée pour le combo principal uniquement
    if(i===0 && combo.relaiStation){
      const relaiIcon=L.divIcon({
        html:`<div style="width:22px;height:22px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>`,
        iconSize:[22,22], iconAnchor:[11,11], className:''
      });
      L.marker([combo.relaiStation.lat,combo.relaiStation.lng],{icon:relaiIcon})
        .bindTooltip(`Relai : ${cleanName(combo.relaiStation.name)}`,{permanent:false,direction:'top'})
        .addTo(planLayerGroup);
    }
  });
  // Zoom sur le premier
  if(routes[0]?.coords){
    planMap.fitBounds(L.polyline(routes[0].coords).getBounds().pad(.25),{animate:false});
    // Forcer la resynchronisation visuelle (le zoom interne peut changer sans
    // que le rendu des tuiles suive immédiatement — bug observé sur ce déploiement)
    setTimeout(()=>planMap.invalidateSize({pan:false}), 50);
  }
  // Segments piéton (adresse ↔ station) pour le combo principal, dessinés
  // automatiquement dès l'affichage initial (avant, il fallait cliquer une
  // card en détail pour les voir, ce qui n'arrive plus avec le swipe mobile).
  if(mainCombo) drawWalkSegments(mainCombo);
}

async function showRoute(idx){
  // Highlight carte
  document.querySelectorAll('.combo-card').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });

  const combo=window._planCombos?.[idx]; if(!combo) return;
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);

  // Marqueurs départ/arrivée réels
  const radius=parseInt(document.getElementById('plan-radius').value);

  // Points départ/arrivée épurés
  if(planFromPos&&!planFromFixed)
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:8,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:8,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);

  // Stations départ/arrivée
  L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:10,fillColor:'#1a7a3e',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.dep.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);
  L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:10,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.arr.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);

  // Station relai (si trajet trop long pour rester dans la limite gratuite)
  if(combo.relaiStation){
    const relaiIcon=L.divIcon({
      html:`<div style="width:22px;height:22px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>`,
      iconSize:[22,22], iconAnchor:[11,11], className:''
    });
    L.marker([combo.relaiStation.lat,combo.relaiStation.lng],{icon:relaiIcon})
      .bindTooltip(`Relai : ${cleanName(combo.relaiStation.name)}`,{permanent:false,direction:'top'})
      .addTo(planLayerGroup);
  }

  // Routing Valhalla entre les deux stations
  const bikeType=document.getElementById('plan-type').value;
  const speed=bikeType==='meca'?16:21;
  const routeColor=bikeType==='meca'?'#e8001c':'#1a7a3e';
  try{
    const body={
      locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],
      costing:'bicycle',
      costing_options:{bicycle:{bicycle_type:bikeType==='meca'?'Hybrid':'Road',cycling_speed:bikeType==='meca'?15:22,use_roads:0.1,use_hills:bikeType==='meca'?0:0.7}},
      directions_type:'none'
    };
    let coords = null;

    // 1. Brouter — direct, pas de Valhalla (down)
    try {
      const brProfile='trekking';
      const brUrl = `https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=${brProfile}&alternativeidx=0&format=geojson`;
      const rb = await fetch(brUrl, {signal: AbortSignal.timeout(12000)});
      if(rb.ok){
        const db = await rb.json();
        const geom = db.features?.[0]?.geometry;
        if(geom?.type==='LineString') coords = geom.coordinates.map(([lng,lat])=>[lat,lng]);
      }
    } catch(e){ console.warn('Brouter:', e.message); }

    // 2. Fallback OSRM bike
    if(!coords){
      try {
        console.log('Fallback OSRM…');
        const osrmUrl = `https://router.project-osrm.org/route/v1/bike/${combo.dep.lng},${combo.dep.lat};${combo.arr.lng},${combo.arr.lat}?overview=full&geometries=polyline6`;
        const ro = await fetch(osrmUrl, {signal: AbortSignal.timeout(12000)});
        if(ro.ok){
          const dor = await ro.json();
          const geom = dor.routes?.[0]?.geometry;
          if(geom) coords = decodePolyline(geom);
        }
      } catch(e){ console.warn('OSRM:', e.message); }
    }

    // 3. Fallback Valhalla si de retour
    if(!coords){
      try {
        const rv0 = await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(body))}`, {signal: AbortSignal.timeout(8000)});
        if(rv0.ok){
          const dv0 = await rv0.json();
          const leg0 = dv0.trip?.legs?.[0];
          if(leg0) coords = decodePolyline(leg0.shape);
        }
      } catch {}
    }

    if(coords){
      L.polyline(coords,{color:'#fff',weight:8,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      L.polyline(coords,{color:routeColor,weight:5,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      setTimeout(()=>{
        planMap.invalidateSize();
        planMap.fitBounds(L.polyline(coords).getBounds().pad(.2),{animate:false});
        setTimeout(()=>planMap.invalidateSize({pan:false}), 50);
      }, 100);
    }
  }catch{}

  // Segments piéton (adresse ↔ station), factorisés dans drawWalkSegments
  await drawWalkSegments(combo);
}

let _chartComboA=null, _chartComboB=null;

async function showComboCourbes(combo, targetEl=null){
  await ensureChartJs();
  let zone=targetEl||document.getElementById('plan-courbes-zone');
  if(!zone){
    zone=document.createElement('div');
    zone.id='plan-courbes-zone';
    const card=document.getElementById('plan-results');
    card.appendChild(zone);
  }
  zone.innerHTML='<div class="loader">Chargement des courbes…</div>';

  const nowDate=new Date();
  const dowEl=document.getElementById('plan-dow');
  const hourEl=document.getElementById('plan-hour');
  const targetDow=dowEl&&dowEl.value?parseInt(dowEl.value):nowDate.getDay();
  const targetH2=hourEl&&hourEl.value?parseInt(hourEl.value):nowDate.getHours();
  const today=new Date();
  const promises=[];
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) promises.push(fetchDay(d.toISOString().slice(0,10)));
  }
  const allDays=(await Promise.all(promises)).filter(Boolean);

  const bikeType=document.getElementById('plan-type').value;
  const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';

  const labels=[], depData=[], arrData=[];
  for(let h=0;h<24;h++){
    labels.push(String(h).padStart(2,'0')+'h');
    const dv=[],av=[];
    allDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const sh=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(sh!==h) return;
        const sts=getSts(snap);
        const dep=sts.find(s=>s.number===combo.dep.number);
        const arr=sts.find(s=>s.number===combo.arr.number);
        if(dep?.bike_stands) dv.push((dep[depKey]||0)/dep.bike_stands*100);
        if(arr?.bike_stands) av.push(arr.available_bike_stands/arr.bike_stands*100);
      });
    });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
    depData.push(avg(dv));
    arrData.push(avg(av));
  }

  const bikeLabel=bikeType==='elec'?'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:-1px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Élec':bikeType==='meca'?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:inline;vertical-align:-1px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Méca':'Vélos';
  zone.innerHTML=`
    <div class="card" style="backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);margin-top:0;border-top:none;border-radius:0 0 var(--radius) var(--radius)">
      <div class="card-title">Probabilité sur 24h · ${DOW_NAMES[targetDow]} · ${cleanName(combo.dep.name)} → ${cleanName(combo.arr.name)}</div>
      <canvas id="chart-combo" height="80"></canvas>
    </div>`;

  _chartComboA?.destroy();
  _chartComboA=new Chart(document.getElementById('chart-combo'),{type:'line',
    data:{labels,datasets:[
      {label:`${bikeLabel} dispo au départ`,data:depData,borderColor:'#0a84ff',backgroundColor:'rgba(10,132,255,.08)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
      {label:'🅿️ Place dispo à l\'arrivée',data:arrData,borderColor:'#ff3b30',backgroundColor:'rgba(255,59,48,.06)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
    ]},
    options:{...chartOpts(),scales:{...chartOpts().scales,y:{...chartOpts().scales.y,max:100,ticks:{...chartOpts().scales.y.ticks,callback:v=>v+'%'}}}}
  });
}

let _chartSD_elec=null, _chartSD_meca=null, _chartSD_hmap=null;

async function showStationDetail(number, targetEl=null){
  await ensureChartJs();
  const st=allStations.find(s=>s.number===number);
  if(!st) return;
  const detail=targetEl || document.getElementById('stats-detail');
  const view=document.getElementById('lb-view')?.value||'day';
  const isMob=window.innerWidth<=640;
  if(window._chartSD_elec){ try{window._chartSD_elec.destroy();}catch{} window._chartSD_elec=null; }
  const oldCvs=document.getElementById('sd-combined-'+number);
  if(oldCvs){ const ex=Chart.getChart(oldCvs); if(ex) ex.destroy(); }
  detail.innerHTML=
    `<div class="sx-dhead"><div class="sx-dname">${cleanName(st.name)}</div>
       <span class="sx-chip">${LG.bolt}${st.electrical_bikes}</span><span class="sx-chip">${LG.wrench}${st.mechanical_bikes}</span><span class="sx-chip">P ${st.available_bike_stands}</span></div>
     <div id="sd-tabs-${number}" class="sx-dtabs"><div id="sd-thumb-${number}" class="sx-dthumb"></div>
       ${(view==='day'?['Vélos','Mouvements','Solde']:['Mouvements','Entrées / Sorties','Rotation']).map((t,i)=>`<div class="sd-tab sx-dtab${i===0?' on':''}" onclick="renderSDSlide(${i},${number})">${t}</div>`).join('')}</div>
     <div id="sd-legend-${number}" class="sx-leg"></div>
     <div class="sx-chart"><canvas id="sd-combined-${number}"></canvas></div>
     <div id="sd-dots-${number}" class="sx-dots"><i class="on"></i><i></i><i></i></div>
     <div id="sd-stats-row-${number}" class="sx-stats"></div>`;

  const d=document.getElementById('lb-date').value;
  const mth=document.getElementById('lb-month')?.value;
  const yr=document.getElementById('lb-year')?.value;

  async function loadSnapsByDate(dates){
    const BATCH=16,result=[];
    for(let i=0;i<dates.length;i+=BATCH){
      const batch=dates.slice(i,i+BATCH);
      const res=await Promise.all(batch.map(dt=>fetchDay(dt).catch(()=>null)));
      res.forEach((snaps,j)=>{ if(snaps) result.push({date:batch[j],snaps}); });
    }
    return result;
  }

  let labels=[],dataElec=[],dataMeca=[],dataMvts=[],dataSolde=[],dataEnt=[],dataSor=[];

  if(view==='day'){
    if(!d) return;
    const snaps=await fetchDay(d)||[];
    let prevT=null;
    snaps.forEach(snap=>{
      const sts=getSts(snap),st2=sts.find(x=>x.number===number); if(!st2) return;
      const t=new Date(getTs(snap));
      labels.push(t.getMinutes()===0?t.getHours()+'h':'');
      dataElec.push(st2.electrical_bikes||0);
      dataMeca.push(st2.mechanical_bikes||0);
      const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
      if(prevT!==null){ dataMvts.push(Math.abs(tot-prevT)); dataSolde.push(tot-prevT); }
      else { dataMvts.push(0); dataSolde.push(0); }
      prevT=tot;
    });
  } else if(view==='month'){
    if(!mth) return;
    const [y,mo]=mth.split('-').map(Number);
    const daysInMonth=new Date(y,mo,0).getDate();
    const today=localDateStr();
    const dates=[];
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(ds<=today) dates.push(ds);
    }
    const loaded=await loadSnapsByDate(dates);
    // TOTAUX par jour : mouvements, entrées, sorties (une moyenne de stock n'aurait pas de sens à cette échelle)
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      labels.push(day+'');
      const entry=loaded.find(x=>x.date===ds);
      let mv=0,ent=0,sor=0,prevS=null,seen=false;
      (entry?entry.snaps:[]).forEach(snap=>{
        const st2=getSts(snap).find(x=>x.number===number); if(!st2) return;
        seen=true;
        const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
        if(prevS!==null){ const dd=tot-prevS; mv+=Math.abs(dd); if(dd>0) ent+=dd; else sor+=dd; }
        prevS=tot;
      });
      if(!seen){ dataMvts.push(null); dataEnt.push(null); dataSor.push(null); continue; }
      dataMvts.push(mv); dataEnt.push(ent); dataSor.push(sor);
    }
  } else {
    if(!yr) return;
    const today=localDateStr();
    const MONTHS=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
    const allDatesYear=[];
    for(let mo=1;mo<=12;mo++) for(let day=1;day<=new Date(yr,mo,0).getDate();day++){
      const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(ds<=today) allDatesYear.push(ds);
    }
    const allLoadedYear=await loadSnapsByDate(allDatesYear);
    const byDate={};
    allLoadedYear.forEach(({date,snaps})=>{ byDate[date]={snaps}; });
    // TOTAUX par mois (somme des jours disponibles)
    for(let mo=1;mo<=12;mo++){
      labels.push(MONTHS[mo-1]);
      const daysInM=new Date(yr,mo,0).getDate();
      let mv=0,ent=0,sor=0,seen=false;
      for(let day=1;day<=daysInM;day++){
        const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        if(ds>today) break;
        const e=byDate[ds]; if(!e) continue;
        let prevS=null;
        e.snaps.forEach(snap=>{
          const st2=getSts(snap).find(x=>x.number===number); if(!st2) return;
          seen=true;
          const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
          if(prevS!==null){ const dd=tot-prevS; mv+=Math.abs(dd); if(dd>0) ent+=dd; else sor+=dd; }
          prevS=tot;
        });
      }
      if(!seen){ dataMvts.push(null); dataEnt.push(null); dataSor.push(null); continue; }
      dataMvts.push(mv); dataEnt.push(ent); dataSor.push(sor);
    }
  }
  if(view!=='day') dataSolde=dataEnt.map((e,i)=>e==null?null:e+dataSor[i]);

  window._sdData={labels,dataElec,dataMeca,dataMvts,dataSolde,dataEnt,dataSor,cap:st.bike_stands||0,number,view};
  window._sdSlide=0;
  renderSDSlide(0,number);
} // fin showStationDetail

function renderSDSlide(slideIdx,number){
  window._sdSlide=slideIdx;
  const {labels,dataElec,dataMeca,dataMvts,dataSolde,dataEnt,dataSor,cap,view}=window._sdData||{};
  if(!labels) return;
  const isDay=view==='day', isLine=isDay;
  if(window._chartSD_elec){ try{window._chartSD_elec.destroy();}catch{} window._chartSD_elec=null; }
  const cvs=document.getElementById('sd-combined-'+number);
  if(cvs){ const ex=Chart.getChart(cvs); if(ex) ex.destroy(); }
  const tabsCont=document.getElementById('sd-tabs-'+number);
  if(tabsCont){
    [...tabsCont.querySelectorAll('.sd-tab')].forEach((t,i)=>t.classList.toggle('on',i===slideIdx));
    const thumb=document.getElementById('sd-thumb-'+number);
    if(thumb) thumb.style.transform=`translateX(${slideIdx*100}%)`;
  }
  const dotsCont=document.getElementById('sd-dots-'+number);
  if(dotsCont) [...dotsCont.children].forEach((d,i)=>d.classList.toggle('on',i===slideIdx));
  const W='#ffffff', G='rgba(255,255,255,.5)';
  const sw=(col,txt)=>`<span><i style="background:${col}"></i>${txt}</span>`;
  const box=(v,l)=>`<div class="sx-stat"><div class="sx-stat-v">${v}</div><div class="sx-stat-l">${l}</div></div>`;
  const sum=a=>a.reduce((x,y)=>x+(y||0),0);
  const peak=a=>{ let bi=-1,bv=-Infinity; a.forEach((v,i)=>{ if(v!=null&&v>bv){ bv=v; bi=i; } }); return bi<0?null:{v:bv,label:labels[bi]}; };
  const unit=view==='month'?'jour':'mois';
  const peakTxt=p=>p?`Pic ${view==='month'?'le ':'en '}${p.label}`:'Pic';
  let datasets=[],legendHtml='',statsHtml='',stacked=false;
  if(isDay){

      statsHtml=box(avg(dataElec),LG.bolt+' Élec · moyenne')+box(avg(dataMeca),LG.wrench+' Méca · moyenne');

    } else {

  } else if(slideIdx===0){
    // Mouvements : TOTAL par jour (mois) ou par mois (année)
    datasets=[{label:'Mouvements',data:dataMvts,backgroundColor:'rgba(255,255,255,.6)',borderColor:W,borderWidth:1,borderRadius:3,spanGaps:true}];
    legendHtml=sw(W,`Mouvements · total par ${unit}`);
    const p=peak(dataMvts);
    statsHtml=box(Math.round(sum(dataMvts)),'Total')+box(p?p.v:0,peakTxt(p));
  } else if(slideIdx===1){
    // Entrées / Sorties : sommes, empilées de part et d'autre de l'axe
    stacked=true;
    datasets=[
      {label:'Entrées',data:dataEnt,backgroundColor:'rgba(255,255,255,.85)',borderColor:W,borderWidth:1,borderRadius:2,spanGaps:true},
      {label:'Sorties',data:dataSor,backgroundColor:'rgba(255,255,255,.35)',borderColor:G,borderWidth:1,borderRadius:2,spanGaps:true}
    ];
    legendHtml=sw(W,`▲ Entrées · total par ${unit}`)+sw(G,`▼ Sorties · total par ${unit}`);
    const e=sum(dataEnt), s=sum(dataSor), b=e+s;
    statsHtml=box(Math.round(e),'Entrées')+box(Math.round(Math.abs(s)),'Sorties')+box((b>=0?'+':'')+Math.round(b),'Bilan');

  }
  const legendEl=document.getElementById('sd-legend-'+number);

  if(legendEl) legendEl.innerHTML=legendHtml;

  window._chartSD_elec=new Chart(cvs,{type:chartType,data:{labels,datasets},

// Autonomie estimée d'un vélo élec : même hypothèse (40km à 100%) que le
// calcul de faisabilité utilisé pour le score des itinéraires.
const BIKE_RANGE_KM_AT_100=40;
function battRangeKm(pct){
  return Math.round(pct/100*BIKE_RANGE_KM_AT_100);
}

function bikeRecoScore(b){
  if(b.status!=='AVAILABLE'||b.isReserved) return -1;
  const ratingScore=(b.rating?.value??50)/100; // 0-1, défaut neutre si pas noté
  // Fraîcheur révision : 1.0 si <30j, décroît jusqu'à 0 vers 365j
  let freshScore=0.3; // défaut si pas de date connue
  if(b.lastControlDateTime){
    const days=(Date.now()-new Date(b.lastControlDateTime).getTime())/86400000;
    freshScore=Math.max(0,Math.min(1,1-days/365));
  }
  if(b.type==='ELECTRICAL'){
    const battScore=(b.battery?.percentage??0)/100;
    // Batterie pondère fort : un élec à plat n'est pas recommandable même bien noté
    return ratingScore*0.35+freshScore*0.15+battScore*0.5;
  }
  return ratingScore*0.6+freshScore*0.4;
}

function markBestBikes(list){
  const bestElec=list.filter(b=>b.type==='ELECTRICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  const bestMeca=list.filter(b=>b.type==='MECHANICAL').sort((a,b)=>bikeRecoScore(b)-bikeRecoScore(a))[0];
  return { bestElecId: bestElec&&bikeRecoScore(bestElec)>0?bestElec.id:null, bestMecaId: bestMeca&&bikeRecoScore(bestMeca)>0?bestMeca.id:null };
}

function renderBikeRow(b, i, isRecommended){
  const isElec=b.type==='ELECTRICAL';
  const reserved=b.isReserved;
  const avail=b.status==='AVAILABLE';
  const ic=isRecommended?'#fff':'rgba(255,255,255,.65)';
  const icon=isElec
    ?`<svg width="11" height="11" viewBox="0 0 24 24" fill="${ic}"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`
    :`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${ic}" stroke-width="2.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;
  // Batterie : jauge courte + % (seuils officiels Vélo'v 60 % / 10 %). Méca : tiret.
  let battCells='<div class="sp-none">—</div>';
  if(isElec&&b.battery?.percentage!=null){
    const pct=b.battery.percentage;
    const col=pct>=60?'#fff':pct>=10?'rgba(255,255,255,.55)':'#ff6b6b';
    battCells=`<div class="sp-bar"><i style="width:${Math.max(4,Math.min(100,pct))}%;background:${col}"></i></div><div class="sp-pct">${pct}%</div>`;
  }
  // Notation en 3 colonnes fixes (★ / score / avis) pour garder l'alignement
  let tail='<div class="sp-none3">—</div>';
  const rv=b.rating?.value, rc=b.rating?.count;
  if(reserved){ tail='<div class="sp-flag">réservé</div>'; }
  else if(!avail){ tail=`<div class="sp-flag" title="${b.statusLabel||b.status}">${b.statusLabel||b.status}</div>`; }
  else if(rv){ tail=`<div class="sp-st">★</div><div class="sp-sc">${Math.round(rv)}</div><div class="sp-nb">${rc?'('+rc+')':''}</div>`; }
  return `<div class="bike-row-live sp-row${isRecommended?' reco':''}" data-idx="${i}"${isRecommended?' title="Recommandé"':''} style="${reserved||!avail?'opacity:.5':''}">${icon}${battCells}${tail}</div>`;
}

async function showStationPopup(s, lat, lon){
  closeStationPopup();
  window._popupStation={s,lat,lon};
  const hasDep=!!(window._planFromPos||planFromPos||planFromFixed);
  const pct=s.bike_stands?Math.round(s.available_bikes/s.bike_stands*100):0;
  const cls='rgba(255,255,255,.7)';

  const mapEl0=document.getElementById('map');
  const offsetY0=mapEl0.clientHeight*0.18;
  const targetPoint=map.project([lat,lon], map.getZoom()).subtract([0, offsetY0]);
  const targetLatLng=map.unproject(targetPoint, map.getZoom());
  map.panTo(targetLatLng, {animate:true, duration:0.35});

  // Position finale connue à l'avance (evite d'interroger la carte pendant l'animation)
  const pt={ x: mapEl0.clientWidth/2, y: mapEl0.clientHeight/2 + offsetY0 };
  const mapEl=document.getElementById('map');

    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.26),0 0 22px rgba(0,0,0,.22);
    pointer-events:auto;`;

  // Vélos live JCDecaux (chargement asynchrone) — scroll interne propre à la liste,
  // le header (nom + totaux) et le bouton "Partir d'ici" restent toujours visibles
  const bikesHtml = `<div style="position:relative;margin-bottom:2px;flex-shrink:1">
    <div id="stn-bikes-slot" class="no-native-scrollbar sp-slot" style="font-size:10px;color:rgba(255,255,255,.35);text-align:center;padding:0 8px 0 0;overflow-y:auto;max-height:min(230px,calc(60vh - 120px))">Chargement…</div>
    <div id="stn-scroll-track" class="sp-track" style="display:none"><div id="stn-scroll-thumb" class="sp-thumb"></div></div>
  </div>`;

  const BOLT='<svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const WRENCH='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
  div.innerHTML=`
    <div class="sp-head">
      <span class="sp-name">${cleanName(s.name)}</span>
      <span class="sp-cnt">
        <span>${BOLT}<span id="stn-total-elec" style="color:#fff">${s.electrical_bikes}</span></span>
        <span>${WRENCH}<span id="stn-total-meca">${s.mechanical_bikes}</span></span>
      </span>
    </div>
    ${bikesHtml}
    ${!hasDep?`<button id="stn-dep-btn" class="stn-act">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Partir d'ici</button>`
    :`<button id="stn-arr-btn" class="stn-act">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Arriver ici</button>`}`;

  mapEl.appendChild(div);
  _stationPopupEl=div;
  // Empêcher les clics ET le scroll (trackpad/tactile) de se propager vers Leaflet.
  // Sans ça, Leaflet capte le geste comme un pan de carte au lieu de laisser
  // scroller la liste interne — c'est pour ça que ça ne marchait ni sur Mac
  // (trackpad) ni sur mobile (tactile), seulement à la molette sur Windows.
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);

  // Éviter la superposition avec le flottant de recherche (mobile surtout) :
  // si le popup empiète sur le bas du flottant, on le décale vers le bas

    const liveMecaN=list.filter(b=>b.type==='MECHANICAL'&&b.status==='AVAILABLE').length;
    const elecEl=document.getElementById('stn-total-elec');
    const mecaEl=document.getElementById('stn-total-meca');
    if(elecEl) elecEl.textContent=liveElecN;
    if(mecaEl) mecaEl.textContent=liveMecaN;

    // Indicateur de scroll custom (les scrollbars overlay macOS/Chrome sont invisibles au repos)
    const track=document.getElementById('stn-scroll-track');
    const thumb=document.getElementById('stn-scroll-thumb');
    if(track&&thumb){
      const updateThumb=()=>{
        const {scrollHeight,clientHeight,scrollTop}=slot;
        if(scrollHeight<=clientHeight+1){ track.style.display='none'; slot.classList.remove('fade-top','fade-bottom'); return; }
        track.style.display='block';
        const trackH=track.clientHeight||clientHeight;
        const thumbH=Math.max(20,trackH*clientHeight/scrollHeight);
        const maxThumbTop=trackH-thumbH;
        thumb.style.height=thumbH+'px';
        thumb.style.top=(maxThumbTop*(scrollTop/(scrollHeight-clientHeight)))+'px';
        // Fondu aux bords : indique qu'il reste des vélos au-dessus / en dessous
        slot.classList.toggle('fade-top',scrollTop>2);
        slot.classList.toggle('fade-bottom',scrollTop<scrollHeight-clientHeight-2);
      };
      updateThumb();
      let hideT=null;
      slot.addEventListener('scroll', ()=>{
        updateThumb();
        track.classList.add('active'); clearTimeout(hideT);
        hideT=setTimeout(()=>track.classList.remove('active'),700);
      },{passive:true});
    }
  });

  div.querySelector('#stn-dep-btn')?.addEventListener('click',()=>{
    const {s,lat,lon}=window._popupStation;
    closeStationPopup();
    const depSt=allStations.find(x=>x.number===s.number)||s;
    planFromFixed=depSt; planFromPos={lat,lng:lon};
    window._planFromPos={lat,lng:lon};
    document.getElementById('plan-from').value=cleanName(s.name);
    document.getElementById('plan-from').style.color='';
    expandPlanFloat();
    window._waitingForArr=true;
  });
  div.querySelector('#stn-arr-btn')?.addEventListener('click',()=>{
    const {s,lat,lon}=window._popupStation;
    closeStationPopup();
    const arrSt=allStations.find(x=>x.number===s.number)||s;
    planToFixed=arrSt; planToPos={lat,lng:lon};
    window._planToPos={lat,lng:lon};
    document.getElementById('plan-to').value=cleanName(s.name);
    document.getElementById('plan-to').style.color='';
    window._waitingForArr=false;
    expandPlanFloat();
    setTimeout(()=>computePlan(),200);
  });


}

function initSliderSwipe(){
  const track=document.getElementById('combo-slider-track');
  if(!track) return;
  if(track._swipeInit) return; // already attached
  track._swipeInit=true;
  // Scroll natif : on détecte la card active à l'arrêt du scroll et on synchronise
  // la sélection (route affichée, dots) — plus fiable qu'un swipe touch manuel
  let scrollTimer=null;
  track.addEventListener('scroll',()=>{
    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(()=>{
      const cards=[...track.querySelectorAll('.combo-card')];
      if(!cards.length) return;
      // Card dont le bord gauche est le plus proche du bord gauche visible
      let closest=0, closestDist=Infinity;
      cards.forEach((card,i)=>{
        const dist=Math.abs(card.offsetLeft-track.scrollLeft);
        if(dist<closestDist){ closestDist=dist; closest=i; }
      });
      if(closest!==(window._openComboIdx??0)) selectComboIdx(closest);
    },120);
  },{passive:true});
}

// Fait défiler le slider jusqu'à la card idx (utilisé par les dots + sélection programmatique)
function updateSliderPosition(idx){
  const track=document.getElementById('combo-slider-track');

    [...dotsEl.children].forEach((d,i)=>{
      d.classList.toggle('on', i===idx);
      d.style.width=i===idx?'14px':'5px';
    });
  }
  if(!track) return;
  const card=track.querySelectorAll('.combo-card')[idx];
  if(card) track.scrollTo({left:card.offsetLeft, behavior:'smooth'});
}

function initPillSwipe(){
  const pill=document.getElementById('plan-float-compact');

  let sx=null,dragged=false;
  const go=(dir)=>{
    const cur=window._openComboIdx??0;
    const n=Math.max(0,Math.min((window._planCombos?.length||1)-1,cur+dir));
    if(n!==cur) selectComboIdx(n);
  };
  pill.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dragged=false;},{passive:true});
  pill.addEventListener('touchmove',e=>{if(sx!==null&&Math.abs(e.touches[0].clientX-sx)>8){dragged=true;}},{passive:true});
  pill.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(dragged&&Math.abs(dx)>30){go(dx<0?1:-1);}
    else if(!dragged){expandPlanFloat();}
    sx=null;dragged=false;
  });
}

/* ═══ VÉLOS LIVE (JCDecaux direct, token via data/token.json) ══ */
let _jcdToken = null, _jcdTokenExp = 0;
async function getJcdToken(){
  if(_jcdToken && Date.now() < _jcdTokenExp) return _jcdToken;
  try{
    const r = await fetch(`data/token.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) return null;
    const d = await r.json();
    if(!d.access_token) return null;
    _jcdToken = `${d.token_type||'Taknv1'} ${d.access_token}`;
    // Marge de sécurité : considérer expiré 5 min avant la vraie limite
    const ageMs = Date.now() - new Date(d.updated_at).getTime();
    const remainMs = (d.expires_in||3600)*1000 - ageMs - 5*60*1000;
    _jcdTokenExp = Date.now() + Math.max(0, remainMs);
    return _jcdToken;
  }catch{ return null; }
}

// Chargement global : tous les vélos en 1 appel, indexés par station
let _allBikesByStation = null; // Map<stationNumber, bike[]>
let _allBikesLoadedAt = 0;
let _allBikesLoadingPromise = null;
const ALL_BIKES_REFRESH_MS = 2 * 60 * 1000; // rafraîchir toutes les 2 min

async function loadAllBikesLive(){
  // Évite les chargements concurrents
  if(_allBikesLoadingPromise) return _allBikesLoadingPromise;
  const tok = await getJcdToken();
  if(!tok) return null;
  _allBikesLoadingPromise = (async()=>{
    try{
      const r = await fetch('https://api.cyclocity.fr/contracts/lyon/bikes',{
        headers:{ 'Accept':'application/vnd.bikes.v4+json', 'Authorization':tok }
      });
      if(!r.ok) return null;
      const bikes = await r.json();
      const byStation = new Map();
      for(const b of bikes){
        if(b.status==='REMOVED' || !b.stationNumber) continue;
        if(!byStation.has(b.stationNumber)) byStation.set(b.stationNumber, []);
        byStation.get(b.stationNumber).push(b);
      }
      _allBikesByStation = byStation;
      _allBikesLoadedAt = Date.now();
      window._bikesLiveReady = true;
      return byStation;
    }catch{ return null; }
    finally{ _allBikesLoadingPromise = null; }
  })();
  return _allBikesLoadingPromise;
}

async function ensureAllBikesFresh(){
  if(!_allBikesByStation || Date.now()-_allBikesLoadedAt > ALL_BIKES_REFRESH_MS){
    await loadAllBikesLive();
  }
  return _allBikesByStation;
}

// Rafraîchissement périodique en tâche de fond
setInterval(()=>{ loadAllBikesLive(); }, ALL_BIKES_REFRESH_MS);

// Compat : retourne les vélos d'une station depuis le cache global (jamais de refetch par station)
async function fetchStationBikesLive(stationNumber){
  const byStation = await ensureAllBikesFresh();
  if(!byStation) return null;
  return byStation.get(stationNumber) || [];
}

/* ── Enrichissement itinéraire : liste des vélos de la station départ ── */
async function fetchStationBikes(stationNumber){
  try{
    const bikes=await fetchStationBikesLive(stationNumber);
    if(!bikes) return [];
    return bikes.filter(b=>b.status==='AVAILABLE').map(b=>({
      id: b.number,
      st: b.stationNumber,
      type: b.type==='ELECTRICAL'?'E':'M',
      batt: b.type==='ELECTRICAL'&&b.battery?.percentage!=null
        ? b.battery.percentage
        : null,
      mv: b.battery?.level??null,
      borne: b.standNumber,
      rating: b.rating?.value!=null?b.rating.value/20:null, // 0-100 -> 0-5
      rcount: b.rating?.count||0,
      status: b.isReserved?'S':'A',
    }));
  }catch{ return []; }
}

function loadAllComboBikes(){
  const cards=document.querySelectorAll('.combo-card[data-idx]');
  cards.forEach(card=>{
    const idx=parseInt(card.dataset.idx);
    if(!Number.isNaN(idx)) loadComboBikes(idx);
  });
}

const _comboBikesCache={};
async function loadComboBikes(idx){
  const combo=window._planCombos?.[idx]; if(!combo) return;
  const cacheKey=combo.dep.number+'_'+combo.dist;
  if(_comboBikesCache[cacheKey]){
    fillPillBikes(idx);
    return; // déjà chargé
  }
  const bikes=await fetchStationBikes(combo.dep.number);
  if(!bikes.length) return;
  _comboBikesCache[cacheKey]=bikes;
  fillPillBikes(idx);
}

/* ═══ GÉOLOCALISATION UTILISATEUR ═══ */
function useMyLocation(){
  if(!navigator.geolocation){ alert('Géolocalisation non supportée par ce navigateur.'); return; }
  const btn=document.getElementById('geoloc-btn');
  if(btn) btn.style.opacity='.5';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {latitude:lat, longitude:lng}=pos.coords;
      planFromPos={lat,lng}; planFromFixed=null;
      window._planFromPos={lat,lng};
      const fromInput=document.getElementById('plan-from');
      if(fromInput){ fromInput.value='📍 Ma position'; fromInput.style.color=''; }
      if(btn) btn.style.opacity='1';
    },
    err=>{
      if(btn) btn.style.opacity='1';
      console.warn('Géolocalisation refusée/indisponible', err);
      alert("Impossible d'accéder à votre position. Vérifiez les autorisations de localisation.");
    },
    {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
  );
}

function hideBootSpinner(){
  const el=document.getElementById('boot-spin'); if(!el||el.classList.contains('out')) return;
  const wait=Math.max(0,350-(performance.now()-(window._bootT0||0)));   // pas de flash trop court
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),350); },wait);
}
async function boot(){
  window._bootT0=performance.now();
  // Filet de sécurité : la roue ne reste jamais plus de 8 s
  setTimeout(hideBootSpinner,8000);
  // Démarrer le plus tôt possible, en parallèle du reste (gros payload ~10Mo)
  loadAllBikesLive();

  initRanges();
  allStations=await loadLatest(); window._lastStationUpdate=Date.now(); updateLiveStatus();
  // La carte s'affiche sans attendre les mouvements du jour (ils arrivent ensuite)
  initMap();
  renderStations();
  initPlanMap();
  computeMovements().then(()=>renderStations()).catch(()=>{});
  // Historique : si beaucoup de jours manquent (1re visite), on garde la roue jusqu'à la fin
  // (8 s max) ; sinon le préchargement se fait en arrière-plan sans rien bloquer.
  try{
    const {missing,done}=await preloadHistory();
    if(missing>5) await Promise.race([done,new Promise(r=>setTimeout(r,8000))]);
  }catch(e){ console.warn('préchargement historique', e); }
  hideBootSpinner();
  // Note: le centrage auto au boot a été retiré (map.setView() au démarrage
  // interférait avec le premier clic dans le champ de recherche).
  // Le bouton géoloc explicite (useMyLocation) reste disponible.
}
boot();
setInterval(async()=>{ allStations=await loadLatest(); window._lastStationUpdate=Date.now(); updateLiveStatus(); await computeMovements(); renderStations(); },2*60*1000);
</script>
