<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vélo'v Lyon Analytics</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--sub:#6e6e73;--dim:#aeaeb2;
  --border:#d2d2d7;--blue:#0071e3;--green:#28cd41;--orange:#ff9f0a;--red:#ff3b30;
  --radius:14px;--shadow:0 2px 14px rgba(0,0,0,.08);
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:300;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:700;font-size:18px}.brand em{color:var(--blue);font-style:normal}
.clock{font-size:12px;color:var(--dim)}

nav{position:sticky;top:56px;z-index:250;background:#fff;border-bottom:1px solid #ececec;display:flex;padding:0 20px;overflow-x:auto}
.tab{padding:14px 16px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;font-size:13px;font-weight:500;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

main{max-width:1500px;margin:auto;padding:20px}
.panel{display:none}.panel.on{display:block}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}

#map{height:calc(100vh - 140px);border-radius:var(--radius);overflow:hidden}
.map-ctrl{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-btn{padding:6px 14px;border-radius:20px;border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow);font-size:12px;font-weight:600;cursor:pointer;color:var(--sub);transition:all .15s}
.map-btn.on{background:var(--blue);color:#fff}
.map-rel{position:relative}

/* search */
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){.loc-row{grid-template-columns:1fr}}
.loc-box{position:relative}
.loc-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.loc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none;transition:border-color .15s}
.search:focus{border-color:var(--blue)}
.dropdown{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:100;max-height:220px;overflow-y:auto}
.dropdown.open{display:block}
.opt{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.opt:last-child{border-bottom:none}
.opt:hover{background:#f0f7ff}
.opt-type{font-size:10px;color:var(--dim);float:right}

/* params row */
.params-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.params-row label{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.params-row select,.params-row input{padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.params-row select:focus,.params-row input:focus{border-color:var(--blue)}

/* plan map */
#plan-map{height:380px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}

/* results */
.combo-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.combo-card:hover{background:#f8f9ff}
.combo-card.selected{background:#f0f7ff;border-left:3px solid var(--blue)}
.combo-card:last-child{border-bottom:none}
.combo-rank{font-size:22px;font-weight:700;color:var(--blue);min-width:32px;text-align:center}
.combo-info{flex:1}
.combo-route{font-weight:600;font-size:13px;margin-bottom:3px}
.combo-meta{font-size:11px;color:var(--sub);line-height:1.7}
.combo-score{text-align:right;flex-shrink:0}
.combo-pct{font-size:22px;font-weight:700}
.combo-detail{font-size:11px;color:var(--dim)}
.score-high{color:var(--green)}
.score-med{color:var(--orange)}
.score-low{color:var(--red)}

/* courbes */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .search{padding-left:12px}

/* table leaderboard */
#lb-table{width:100%;border-collapse:collapse;font-size:13px}
#lb-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);background:#fff}
#lb-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums}
#lb-table tr:hover td{background:#f8f8fa}
.rank-cell{font-weight:700;color:var(--blue);width:40px}
.mv-bar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);vertical-align:middle;margin-left:6px}
.fill-pill{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.fill-high{background:rgba(40,205,65,.12);color:#1a7f2b}
.fill-med{background:rgba(255,159,10,.12);color:#a56800}
.fill-low{background:rgba(255,59,48,.12);color:#c0392b}

.loader,.no-data{padding:40px;text-align:center;color:var(--dim)}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.range select,.range input{padding:8px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.btn{padding:8px 18px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.85}
</style>
</head>
<body>

<header>
  <div class="brand">Vélo<em>'</em>v Lyon Analytics</div>
  <div class="clock" id="clock"></div>
</header>

<nav>
  <div class="tab on" data-tab="map">🗺 Carte</div>
  <div class="tab" data-tab="courbes">📈 Courbes</div>
  <div class="tab" data-tab="leaderboard">🏆 Leaderboard</div>
  <div class="tab" data-tab="plan">🚴 Planifier</div>
</nav>

<main>

<!-- ═══ CARTE ═══ -->
<div class="panel on" id="tab-map">
  <div class="map-rel">
    <div class="map-ctrl">
      <button class="map-btn" id="btn-heat" onclick="toggleHeat()">🔥 Heatmap</button>
    </div>
    <div id="map"></div>
  </div>
</div>

<!-- ═══ COURBES ═══ -->
<div class="panel" id="tab-courbes">
  <div class="card">
    <div class="card-title">Station &amp; période</div>
    <div class="search-wrap">
      <input id="station-search" class="search" type="text" placeholder="Chercher une station…" autocomplete="off"/>
      <div class="dropdown" id="station-dd"></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <input type="range" id="courbes-slider" min="1" max="365" value="1"
        style="flex:1;min-width:140px;max-width:340px;accent-color:var(--blue)"
        oninput="onCourbesSlider()">
      <span id="courbes-slider-label" style="font-size:13px;font-weight:600;color:var(--blue);min-width:80px">Aujourd&#39;hui</span>
      <button class="btn" onclick="renderCourbes()">Tracer</button>
    </div>
  </div>
  <div id="courbes-content"><div class="no-data">Sélectionnez une station.</div></div>
</div>

<!-- ═══ LEADERBOARD ═══ -->
<div class="panel" id="tab-leaderboard">
  <div class="card">
    <div class="card-title">Classement des stations</div>
    <div class="range">
      <label>Du</label><input type="datetime-local" id="lb-start"/>
      <label>au</label><input type="datetime-local" id="lb-end"/>
      <select id="lb-sort">
        <option value="mv">Mouvements ↕</option>
        <option value="rotation">Taux de rotation</option>
        <option value="bikes">Vélos dispo</option>
        <option value="elec">⚡ Électriques</option>
        <option value="meca">🔧 Mécaniques</option>
        <option value="stands">Places libres</option>
        <option value="fill">% remplissage</option>
      </select>
      <button class="btn" onclick="computeLeaderboard()">Calculer</button>
    </div>
    <div id="lb-content">
      <div style="overflow-x:auto"><table id="lb-table"><thead id="lb-head"></thead><tbody id="lb-body"></tbody></table></div>
    </div>
  </div>
</div>

<!-- ═══ PLANIFIER ═══ -->
<div class="panel" id="tab-plan">
  <div class="card">
    <div class="card-title">Planifier un trajet</div>
    <div class="loc-row">
      <div class="loc-box">
        <div class="loc-label"><span class="loc-dot" style="background:var(--green)"></span>Point de départ</div>
        <input id="plan-from" class="search" type="text" placeholder="Adresse ou station de départ…" autocomplete="off"/>
        <div class="dropdown" id="plan-from-dd"></div>
      </div>
      <div class="loc-box">
        <div class="loc-label"><span class="loc-dot" style="background:var(--red)"></span>Point d'arrivée</div>
        <input id="plan-to" class="search" type="text" placeholder="Adresse ou station d'arrivée…" autocomplete="off"/>
        <div class="dropdown" id="plan-to-dd"></div>
      </div>
    </div>
    <div class="params-row">
      <label>Jour</label>
      <select id="plan-dow">
        <option value="1">Lundi</option><option value="2">Mardi</option>
        <option value="3">Mercredi</option><option value="4">Jeudi</option>
        <option value="5">Vendredi</option><option value="6">Samedi</option>
        <option value="0">Dimanche</option>
      </select>
      <label>Heure</label>
      <input type="time" id="plan-time"/>
      <label>Type</label>
      <select id="plan-type">
        <option value="elec">⚡ Électrique</option>
        <option value="meca">🔧 Mécanique</option>
        <option value="any">Tous</option>
      </select>
      <label>Rayon stations</label>
      <select id="plan-radius">
        <option value="250">250 m</option>
        <option value="500" selected>500 m</option>
        <option value="750">750 m</option>
        <option value="1000">1 km</option>
      </select>
      <label>Combos</label>
      <select id="plan-top">
        <option value="3">Top 3</option>
        <option value="5" selected>Top 5</option>
        <option value="10">Top 10</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <button class="btn" onclick="computePlan()">🔍 Planifier</button>
      <p style="font-size:12px;color:var(--dim)">Sélectionnez dans les suggestions ou cliquez Planifier</p>
    </div>
  </div>

  <div id="plan-map"></div>

  <div class="card" id="plan-results-card" style="display:none">
    <div class="card-title" id="plan-results-title">Meilleures combinaisons</div>
    <div id="plan-results"></div>
  </div>
</div>

</main>
<script>
'use strict';

/* ═══ STATE ═══════════════════════════════════════════ */
let allStations=[], map=null, markers=null, heatLayer=null, heatOn=false;
let selectedStation=null, chartElec=null, chartMeca=null, chartFlux=null;
let todayMv={}, lbMvCache={}, courbesSliderDays=1;
let planMap=null, planRoutes=[], planFromPos=null, planToPos=null;
let planFromFixed=null, planToFixed=null; // station fixée si l'user en a choisi une

const fmt = d => d.toISOString().slice(0,16);
const DOW_NAMES = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ═══ CLOCK & TABS ════════════════════════════════════ */
setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR'); },1000);

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    tab.classList.add('on');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('on');
    setTimeout(()=>{ map?.invalidateSize(); planMap?.invalidateSize(); },150);
    if(tab.dataset.tab==='leaderboard') quickLeaderboard();
    if(tab.dataset.tab==='plan') initPlanMap();
  };
});

/* ═══ UTILS ═══════════════════════════════════════════ */
const cleanName = n => n.replace(/^\d+\s*[-–]\s*/,'').trim();
function stationColor(st){
  if(!st.bike_stands||st.available_bikes===0) return '#ff3b30';
  return st.available_bikes/st.bike_stands<=.25 ? '#ff9f0a' : '#28cd41';
}
function chartOpts(){
  return { responsive:true,
    plugins:{legend:{labels:{color:'#6e6e73',font:{family:'-apple-system,sans-serif',size:11}}}},
    scales:{ x:{ticks:{color:'#aeaeb2',font:{size:10},maxTicksLimit:16},grid:{color:'#f0f0f5'}},
             y:{beginAtZero:true,ticks:{color:'#6e6e73'},grid:{color:'#f0f0f5'}} }};
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dl=(lat2-lat1)*Math.PI/180,dg=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dl/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function decodePolyline(encoded,precision=6){
  let i=0,lat=0,lng=0; const coords=[],f=Math.pow(10,precision);
  while(i<encoded.length){
    let b,s=0,r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1); s=0;r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lng+=(r&1)?~(r>>1):(r>>1);
    coords.push([lat/f,lng/f]);
  }
  return coords;
}
function scoreColor(pct){ return pct>=60?'score-high':pct>=30?'score-med':'score-low'; }

/* ═══ DATA ════════════════════════════════════════════ */
function parseStation(r){
  let elec=0,meca=0;
  try{
    const raw=r.main_stands||r.overflow_stands||'';
    if(raw){
      const s=(typeof raw==='string'?raw:JSON.stringify(raw)).replace(/'/g,'"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
      const d=JSON.parse(s); elec=d?.availabilities?.electricalBikes??0; meca=d?.availabilities?.mechanicalBikes??(r.available_bikes||0);
    }
  }catch{}
  return { number:r.number,name:r.name||'',
    available_bikes:r.available_bikes||0, available_bike_stands:r.available_bike_stands||0,
    bike_stands:r.bike_stands||0, electrical_bikes:elec, mechanical_bikes:meca,
    lat:r.lat, lng:r.lng };
}
async function loadLatest(){
  try{
    const r=await fetch('https://download.data.grandlyon.com/ws/rdata/jcd_jcdecaux.jcdvelov/all.json?maxfeatures=-1&start=1',{signal:AbortSignal.timeout(8000)});
    return (await r.json()).values?.map(parseStation)||[];
  }catch{
    const r=await fetch('data/latest.json'); const d=await r.json(); return d.stations||[];
  }
}
async function fetchDay(date){
  try{ const r=await fetch(`data/history/${date}.json`); return r.ok?r.json():null; }catch{ return null; }
}
function getTs(snap){ return snap.timestamp||snap.t||''; }
function getSts(snap){
  let a=[];
  if(Array.isArray(snap)) a=snap;
  else if(Array.isArray(snap?.stations)) a=snap.stations;
  else if(Array.isArray(snap?.s)) a=snap.s;
  return a.map(st=>{
    if(st.number!==undefined) return st;
    return {number:st.n,available_bikes:st.b??0,available_bike_stands:st.s??0,
      bike_stands:st.c??0,electrical_bikes:st.e??0,mechanical_bikes:st.m??0,lat:st.la,lng:st.ln};
  });
}
async function fetchRange(startMs,endMs){
  const days=Math.ceil((endMs-startMs)/86400e3);
  const step=days<=14?1:days<=30?1:days<=90?3:days<=180?5:10;
  const dates=new Set();
  for(let i=0;i<=days;i+=step){ const d=new Date(startMs);d.setDate(d.getDate()+i);dates.add(d.toISOString().slice(0,10)); }
  dates.add(new Date(endMs).toISOString().slice(0,10));
  const results=await Promise.all([...dates].map(fetchDay));
  const all=[];
  results.forEach(s=>{if(s?.length)all.push(...s);});
  return all.filter(s=>{const t=new Date(getTs(s)).getTime();return t>=startMs&&t<=endMs;})
    .sort((a,b)=>new Date(getTs(a))-new Date(getTs(b)));
}
function calcMvFromSnaps(snaps){
  const mv={};
  for(let i=1;i<snaps.length;i++){
    const prev=getSts(snaps[i-1]),curr=getSts(snaps[i]);
    curr.forEach(c=>{
      const p=prev.find(s=>s.number===c.number); if(!p) return;
      const d=Math.abs(c.available_bikes-p.available_bikes);
      if(d>0) mv[c.number]=(mv[c.number]||0)+d;
    });
  }
  return mv;
}

/* ═══ MOVEMENTS ═══════════════════════════════════════ */
async function computeMovements(){
  todayMv={};
  const snaps=await fetchDay(new Date().toISOString().slice(0,10));
  if(!snaps||snaps.length<2) return;
  todayMv=calcMvFromSnaps(snaps);
}

/* ═══ MAP ═════════════════════════════════════════════ */
function initMap(){
  map=L.map('map').setView([45.757,4.832],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:20}).addTo(map);
}
function renderStations(){
  if(markers) markers.clearLayers();
  markers=L.layerGroup().addTo(map);
  allStations.forEach(st=>{
    if(!st.lat||!st.lng) return;
    const mv=todayMv[st.number]||0;
    const m=L.circleMarker([st.lat,st.lng],{radius:8,fillColor:stationColor(st),color:'#fff',weight:1.5,fillOpacity:.9});
    m.bindPopup(`<div style="min-width:190px;font-family:-apple-system,sans-serif">
      <b style="font-size:14px">${cleanName(st.name)}</b><br><br>
      ⚡ ${st.electrical_bikes} · 🔧 ${st.mechanical_bikes} · 🚲 ${st.available_bikes}<br>
      🅿️ ${st.available_bike_stands} places · ↕ ${mv} mvts/j</div>`);
    markers.addLayer(m);
  });
  buildHeatLayer();
}
function buildHeatLayer(){
  if(heatLayer) map.removeLayer(heatLayer);
  const maxMv=Math.max(1,...Object.values(todayMv));
  const pts=allStations.filter(s=>s.lat&&s.lng).map(s=>[s.lat,s.lng,(todayMv[s.number]||0)/maxMv]).filter(p=>p[2]>0);
  heatLayer=L.heatLayer(pts,{radius:20,blur:12,maxZoom:17,minOpacity:.4,
    gradient:{0:'#2c7bb6',0.3:'#00ccbc',0.6:'#90eb9d',0.8:'#f9d057',1:'#d7191c'}});
  if(heatOn) heatLayer.addTo(map);
}
function toggleHeat(){
  heatOn=!heatOn;
  const btn=document.getElementById('btn-heat');
  if(heatOn){ heatLayer?.addTo(map); btn.classList.add('on'); }
  else{ if(heatLayer) map.removeLayer(heatLayer); btn.classList.remove('on'); }
}

/* ═══ DROPDOWN GÉNÉRIQUE ═══════════════════════════════ */
let _nominatimDebounce={};

function buildDropdown(inputId, ddId, opts){
  const input=document.getElementById(inputId), dd=document.getElementById(ddId);

  input.addEventListener('input',()=>{
    const q=input.value.trim();
    dd.innerHTML='';
    if(!q){ dd.classList.remove('open'); return; }

    // Stations locales (instantané)
    const stMatches=allStations
      .filter(s=>cleanName(s.name).toLowerCase().includes(q.toLowerCase()))
      .slice(0,5);

    const render=(geoResults=[])=>{
      dd.innerHTML='';
      stMatches.forEach(st=>{
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`${cleanName(st.name)} <span class="opt-type">🚲 station</span>`;
        el.onclick=()=>{ input.value=cleanName(st.name); dd.classList.remove('open'); opts.onStation?.(st); };
        dd.appendChild(el);
      });
      geoResults.forEach(geo=>{
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`${geo.display_name.split(',').slice(0,2).join(',')} <span class="opt-type">📍 adresse</span>`;
        el.onclick=()=>{
          input.value=geo.display_name.split(',').slice(0,2).join(',');
          dd.classList.remove('open');
          const pos={lat:parseFloat(geo.lat),lng:parseFloat(geo.lon)};
          opts.onGeoPos?.(pos);
        };
        dd.appendChild(el);
      });
      if(stMatches.length||geoResults.length) dd.classList.add('open');
      else dd.classList.remove('open');
    };

    render(); // afficher les stations tout de suite

    // Géocodage Nominatim avec debounce 400ms
    clearTimeout(_nominatimDebounce[inputId]);
    if(q.length>=3){
      _nominatimDebounce[inputId]=setTimeout(async()=>{
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+', Lyon, France')}&limit=4&addressdetails=0`);
          const data=await r.json();
          render(data);
        }catch{}
      },400);
    }
  });

  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}

/* ═══ COURBES ═════════════════════════════════════════ */
function buildStationSearch(){
  const input=document.getElementById('station-search'), dd=document.getElementById('station-dd');
  input.addEventListener('input',()=>{
    const q=input.value.toLowerCase().trim(); dd.innerHTML='';
    if(!q){ dd.classList.remove('open'); return; }
    allStations.filter(s=>cleanName(s.name).toLowerCase().includes(q)).slice(0,12).forEach(st=>{
      const el=document.createElement('div'); el.className='opt'; el.textContent=cleanName(st.name);
      el.onclick=()=>{ input.value=cleanName(st.name); dd.classList.remove('open'); selectedStation=st; };
      dd.appendChild(el);
    });
    dd.classList.add('open');
  });
  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}
function onCourbesSlider(){
  const v=parseInt(document.getElementById('courbes-slider').value);
  courbesSliderDays=v;
  const lbl=document.getElementById('courbes-slider-label');
  if(v===1) lbl.textContent="Aujourd'hui";
  else if(v<=7) lbl.textContent=`${v} jours`;
  else if(v<=30) lbl.textContent=`${Math.round(v/7)} sem.`;
  else lbl.textContent=`${Math.round(v/30)} mois`;
}
async function renderCourbes(){
  const content=document.getElementById('courbes-content');
  if(!selectedStation) return;
  content.innerHTML='<div class="loader">Chargement…</div>';
  const days=courbesSliderDays, endMs=Date.now(), startMs=endMs-days*86400e3;
  const snaps=await fetchRange(startMs,endMs);
  if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
  const id=selectedStation.number;
  const labels=[],dataElec=[],dataMeca=[],dataFluxH=[];
  const rawDeltas=[];
  snaps.forEach((snap,i)=>{
    if(i===0) return;
    const prev=getSts(snaps[i-1]),curr=getSts(snap);
    const st=curr.find(s=>s.number===id),pst=prev.find(s=>s.number===id);
    if(st&&pst){ const d=pst.available_bikes-st.available_bikes; rawDeltas.push({ms:new Date(getTs(snap)).getTime(),delta:d>0?d:0}); }
  });
  snaps.forEach(snap=>{
    const st=getSts(snap).find(s=>s.number===id); if(!st) return;
    const t=new Date(getTs(snap)), ms=t.getTime();
    labels.push(days<=1?t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):t.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
    dataElec.push(st.electrical_bikes||0); dataMeca.push(st.mechanical_bikes||0);
    dataFluxH.push(rawDeltas.filter(d=>d.ms>ms-3600e3&&d.ms<=ms).reduce((a,d)=>a+d.delta,0));
  });
  content.innerHTML=`
    <div class="card"><div class="card-title">⚡ Électriques</div><canvas id="elec-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">🔧 Mécaniques</div><canvas id="meca-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">↕ Départs/heure glissante</div><canvas id="flux-chart" height="60"></canvas></div>`;
  chartElec?.destroy(); chartMeca?.destroy(); chartFlux?.destroy();
  const pr=days<=1?0:2;
  const mk=(cid,data,color,label)=>new Chart(document.getElementById(cid),{type:'line',
    data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:color+'18',borderWidth:1.8,tension:0,pointRadius:pr,spanGaps:true,fill:true}]},
    options:chartOpts()});
  chartElec=mk('elec-chart',dataElec,'#28cd41','⚡ Électriques');
  chartMeca=mk('meca-chart',dataMeca,'#0071e3','🔧 Mécaniques');
  chartFlux=new Chart(document.getElementById('flux-chart'),{type:'bar',
    data:{labels,datasets:[{label:'Départs/h',data:dataFluxH,
      backgroundColor:dataFluxH.map(v=>v>5?'rgba(255,59,48,.65)':v>2?'rgba(255,159,10,.6)':'rgba(0,113,227,.5)'),borderWidth:0}]},
    options:chartOpts()});
}

/* ═══ LEADERBOARD ═════════════════════════════════════ */
function quickLeaderboard(){ renderLbTable(todayMv); }
async function computeLeaderboard(){
  const content=document.getElementById('lb-content');
  content.innerHTML='<div class="loader">Calcul…</div>';
  const s=document.getElementById('lb-start').value, e=document.getElementById('lb-end').value;
  if(!s||!e){ content.innerHTML='<div class="no-data">Sélectionnez une période.</div>'; return; }
  const snaps=await fetchRange(new Date(s).getTime(),new Date(e).getTime());
  if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
  lbMvCache=calcMvFromSnaps(snaps);
  content.innerHTML='<div style="overflow-x:auto"><table id="lb-table"><thead id="lb-head"></thead><tbody id="lb-body"></tbody></table></div>';
  renderLbTable(lbMvCache);
}
function renderLbTable(mvData){
  const head=document.getElementById('lb-head'), body=document.getElementById('lb-body');
  if(!head||!body) return;
  head.innerHTML='<tr><th>#</th><th>Station</th><th>⚡ Élec</th><th>🔧 Méca</th><th>Total</th><th>Places</th><th>↕ Mvts</th><th>Remplissage</th></tr>';
  const sortKey=document.getElementById('lb-sort').value;
  const maxMv=Math.max(1,...Object.values(mvData));
  const rows=allStations.map(st=>{
    const mv=mvData[st.number]||0, fill=st.bike_stands?st.available_bikes/st.bike_stands:0, rot=st.bike_stands?mv/st.bike_stands:0;
    return {...st,mv,fill,rot};
  });
  const sorters={mv:(a,b)=>b.mv-a.mv,rotation:(a,b)=>b.rot-a.rot,bikes:(a,b)=>b.available_bikes-a.available_bikes,
    elec:(a,b)=>b.electrical_bikes-a.electrical_bikes,meca:(a,b)=>b.mechanical_bikes-a.mechanical_bikes,
    stands:(a,b)=>b.available_bike_stands-a.available_bike_stands,fill:(a,b)=>b.fill-a.fill};
  rows.sort(sorters[sortKey]||sorters.mv);
  body.innerHTML=rows.map((st,i)=>{
    const pct=Math.round(st.fill*100), cls=pct>=50?'fill-high':pct>=25?'fill-med':'fill-low';
    const bw=Math.round(st.mv/maxMv*60);
    return `<tr><td class="rank-cell">${i+1}</td><td>${cleanName(st.name)}</td>
      <td>⚡ ${st.electrical_bikes}</td><td>🔧 ${st.mechanical_bikes}</td>
      <td><b>${st.available_bikes}</b></td><td>${st.available_bike_stands}</td>
      <td>${st.mv}<span class="mv-bar" style="width:${bw}px"></span></td>
      <td><span class="fill-pill ${cls}">${pct}%</span></td></tr>`;
  }).join('');
}
document.getElementById('lb-sort').addEventListener('change',()=>renderLbTable(Object.keys(lbMvCache).length?lbMvCache:todayMv));

/* ═══ PLANIFIER ════════════════════════════════════════ */
let planHeatMvCache={};

function initPlanMap(){
  if(planMap){ planMap.invalidateSize(); return; }
  planMap=L.map('plan-map').setView([45.757,4.832],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:20}).addTo(planMap);
  L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm-lite/{z}/{x}/{y}.png',
    {maxZoom:20,opacity:0.5}).addTo(planMap);

  buildDropdown('plan-from','plan-from-dd',{
    onStation: st=>{ planFromFixed=st; planFromPos={lat:st.lat,lng:st.lng}; },
    onGeoPos:  pos=>{ planFromPos=pos; planFromFixed=null; },
  });
  buildDropdown('plan-to','plan-to-dd',{
    onStation: st=>{ planToFixed=st; planToPos={lat:st.lat,lng:st.lng}; },
    onGeoPos:  pos=>{ planToPos=pos; planToFixed=null; },
  });

  // Init heure et jour
  const now=new Date();
  document.getElementById('plan-time').value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('plan-dow').value=String(now.getDay());
}



async function computePlan(){
  const resultsCard=document.getElementById('plan-results-card');
  const results=document.getElementById('plan-results');
  resultsCard.style.display='';
  results.innerHTML='<div class="loader">Analyse de l\'historique…</div>';

  const bikeType=document.getElementById('plan-type').value;
  const radius=parseInt(document.getElementById('plan-radius').value);
  const topN=parseInt(document.getElementById('plan-top').value);
  const targetDow=parseInt(document.getElementById('plan-dow').value);
  const timeStr=document.getElementById('plan-time').value;
  const targetH=parseInt(timeStr.split(':')[0]);
  const bikeSpeedKmh=bikeType==='meca'?16:21;

  // Charger historique pour ce jour de semaine
  const today=new Date();
  const dayPromises=[];
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) dayPromises.push(fetchDay(d.toISOString().slice(0,10)));
  }
  const allDays=(await Promise.all(dayPromises)).filter(Boolean);

  // Stations proches du départ (si pas de station fixe)
  const depStations = planFromFixed
    ? [planFromFixed]
    : allStations.filter(s=>s.lat&&s.lng).map(s=>({...s,dist:haversine(planFromPos.lat,planFromPos.lng,s.lat,s.lng)})).filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,5);

  // Stations proches de l'arrivée (si pas de station fixe)
  const arrStations = planToFixed
    ? [planToFixed]
    : allStations.filter(s=>s.lat&&s.lng).map(s=>({...s,dist:haversine(planToPos.lat,planToPos.lng,s.lat,s.lng)})).filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,5);

  if(!depStations.length||!arrStations.length){
    results.innerHTML='<div class="no-data">Aucune station dans ce rayon. Augmentez le rayon.</div>';
    return;
  }

  // Calculer proba pour chaque station sur l'heure cible
  const stationProba={}; // number → {dep:%, arr:%}
  const allIds=new Set([...depStations.map(s=>s.number),...arrStations.map(s=>s.number)]);

  allIds.forEach(num=>{
    const depVals=[],arrVals=[];
    allDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const h=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(h!==targetH) return;
        const sts=getSts(snap), st=sts.find(s=>s.number===num);
        if(!st||!st.bike_stands) return;
        const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';
        depVals.push((st[depKey]||0)/st.bike_stands*100);
        arrVals.push(st.available_bike_stands/st.bike_stands*100);
      });
    });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
    stationProba[num]={dep:avg(depVals),arr:avg(arrVals),samples:depVals.length};
  });

  // Générer toutes les combinaisons dep × arr
  const combos=[];
  for(const dep of depStations){
    for(const arr of arrStations){
      if(dep.number===arr.number) continue;
      const pd=stationProba[dep.number], pa=stationProba[arr.number];
      const depPct=pd?.dep??null, arrPct=pa?.arr??null;
      if(depPct===null||arrPct===null) continue;
      // Distance vélo entre les deux stations
      const dist=haversine(dep.lat,dep.lng,arr.lat,arr.lng);
      const rideMin=Math.round(dist/1000/bikeSpeedKmh*60);
      // Score = 60% proba départ + 40% proba arrivée
      const score=Math.round(depPct*0.6+arrPct*0.4);
      combos.push({dep,arr,depPct,arrPct,score,dist,rideMin,samples:pd?.samples??0});
    }
  }

  combos.sort((a,b)=>b.score-a.score);
  const top=combos.slice(0,topN);

  if(!top.length){
    results.innerHTML='<div class="no-data">Pas assez de données historiques pour ces stations.</div>';
    return;
  }

  document.getElementById('plan-results-title').textContent=
    `Top ${top.length} combinaisons · ${DOW_NAMES[targetDow]} ${targetH}h · ${bikeType==='elec'?'⚡ Élec':bikeType==='meca'?'🔧 Méca':'🚲 Tous'}`;

  results.innerHTML=top.map((c,i)=>{
    const cls=scoreColor(c.score);
    const depDist=planFromFixed?'':` · ${Math.round(c.dep.dist||0)} m à pied`;
    const arrDist=planToFixed?'':` · ${Math.round(c.arr.dist||0)} m à pied`;
    return `<div class="combo-card${i===0?' selected':''}" onclick="showRoute(${i})" data-idx="${i}">
      <div class="combo-rank">${i+1}</div>
      <div class="combo-info">
        <div class="combo-route">🟢 ${cleanName(c.dep.name)} → 🔴 ${cleanName(c.arr.name)}</div>
        <div class="combo-meta">
          Départ${depDist} · ${Math.round(c.dist/1000*10)/10} km · ~${c.rideMin} min<br>
          ⚡ vélo dispo : <b>${c.depPct}%</b> · 🅿️ place dispo : <b>${c.arrPct}%</b>
          ${c.samples?` · ${c.samples} mesures`:''}${arrDist}
        </div>
      </div>
      <div class="combo-score">
        <div class="combo-pct ${cls}">${c.score}%</div>
        <div class="combo-detail">score conjoint</div>
      </div>
    </div>`;
  }).join('');

  // Stocker les combos pour le routing
  window._planCombos=top;
  showRoute(0);
}

let planLayerGroup=null;

async function showRoute(idx){
  // Highlight carte
  document.querySelectorAll('.combo-card').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });

  const combo=window._planCombos?.[idx]; if(!combo) return;
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);

  // Marqueurs départ/arrivée réels
  if(planFromPos&&!planFromFixed){
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:8,fillColor:'#28cd41',color:'#fff',weight:2,fillOpacity:.9})
      .bindTooltip('Départ',{permanent:true,direction:'top'}).addTo(planLayerGroup);
  }
  if(planToPos&&!planToFixed){
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:8,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.9})
      .bindTooltip('Arrivée',{permanent:true,direction:'top'}).addTo(planLayerGroup);
  }

  // Stations
  L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:10,fillColor:'#28cd41',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.dep.name),{permanent:true,direction:'top'}).addTo(planLayerGroup);
  L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:10,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.arr.name),{permanent:true,direction:'top'}).addTo(planLayerGroup);

  // Routing Valhalla entre les deux stations
  const bikeType=document.getElementById('plan-type').value;
  const speed=bikeType==='meca'?16:21;
  const routeColor=bikeType==='meca'?'#e8001c':'#28cd41';
  try{
    const body={
      locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],
      costing:'bicycle',
      costing_options:{bicycle:{bicycle_type:'Road',cycling_speed:speed,use_roads:0.4,use_hills:0.2}},
      directions_type:'none'
    };
    const r=await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(body))}`);
    if(r.ok){
      const data=await r.json();
      const leg=data.trip?.legs?.[0];
      if(leg){
        const coords=decodePolyline(leg.shape);
        L.polyline(coords,{color:routeColor,weight:5,opacity:.9}).addTo(planLayerGroup);
        planMap.fitBounds(L.polyline(coords).getBounds().pad(.2));
      }
    }
  }catch{}

  // Lignes en pointillés piéton depuis/vers les stations si adresse libre
  if(planFromPos&&!planFromFixed)
    L.polyline([[planFromPos.lat,planFromPos.lng],[combo.dep.lat,combo.dep.lng]],{color:'#6e6e73',weight:2,dashArray:'5,5',opacity:.7}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.polyline([[combo.arr.lat,combo.arr.lng],[planToPos.lat,planToPos.lng]],{color:'#6e6e73',weight:2,dashArray:'5,5',opacity:.7}).addTo(planLayerGroup);
}
