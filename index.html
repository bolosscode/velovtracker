<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Vélo'v"/>
<meta name="theme-color" content="#ffffff"/>
<title>Vélo'v Lyon Analytics</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(max-width:640px){
  #stats-layout{grid-template-columns:1fr !important}
  #stats-detail{display:block !important}
  header{height:48px;padding:0 14px}
  .brand{font-size:15px}
  #top-nav{display:none !important}
  #top-nav{display:none !important}

  .card{padding:12px;border:0.5px solid rgba(255,255,255,.08)}
  .loc-row{grid-template-columns:1fr}
  #map{height:100%}

  .params-row{gap:8px}
  .params-row select,.params-row input{font-size:12px;padding:6px 8px}
  #stats-detail{display:none}
  #lb-content{max-height:60vh}
  .combo-card{padding:10px 12px}
  .combo-rank{font-size:18px;min-width:24px}
  .combo-pct{font-size:18px}
}
@media(min-width:641px){
  #plan-float{width:calc(100vw / 3 - 20px);right:auto !important;}
  #bottom-nav{display:none}
}
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:#1c1c1e;backdrop-filter:blur(14px);
  border-top:0.5px solid #38383a;
  display:flex;padding:0;height:60px;
}
#bottom-nav .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:6px 0;
  font-size:18px;font-weight:600;color:#bbb;
  border-bottom:none;border-top:2px solid transparent;
}
#bottom-nav .tab span{font-size:11px;display:block;color:var(--sub)}
#bottom-nav .tab.on{color:#fff;border-top-color:rgba(255,255,255,.3)}
:root{
  --bg:#1c1c1e;--paper:#2c2c2e;--ink:#f5f5f7;--sub:#8e8e93;--dim:#636366;
  --border:#38383a;--blue:#f5f5f7;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  --radius:14px;--shadow:0 2px 8px rgba(0,0,0,.4);
}
body{background:#1c1c1e;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;color-scheme:dark}

header{position:sticky;top:0;z-index:300;height:56px;background:#1c1c1e;backdrop-filter:blur(14px);border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:700;font-size:20px;color:#fff}.brand em{color:#fff;font-style:normal}
.clock{font-size:12px;color:var(--dim)}

nav{position:sticky;top:56px;z-index:250;background:#1c1c1e;border-bottom:0.5px solid #38383a;display:flex;padding:0 20px;overflow-x:auto}
.tab.on{color:#fff;border-bottom-color:rgba(255,255,255,.3);background:transparent}

main{max-width:1500px;margin:auto;padding:20px}
.panel{display:none;overflow:hidden}.panel.on{display:block}
.card{background:rgba(24,24,28,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--radius);border:0.5px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}

#map{height:100%;border-radius:var(--radius);overflow:hidden;position:relative;z-index:1}
.map-ctrl{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-btn{padding:6px 14px;border-radius:20px;border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow);font-size:12px;font-weight:600;cursor:pointer;color:var(--sub);transition:all .15s}
.map-btn.on{background:var(--blue);color:#fff}
.map-rel{position:relative;overflow:hidden}

/* search */
.loc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){
  .loc-row{grid-template-columns:1fr}}
.loc-box{position:relative}
.loc-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.loc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none;transition:border-color .15s;color:#fff;}
.search:focus{border-color:var(--blue)}
.dropdown{position:fixed;z-index:9999;background:#2c2c2e;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;max-height:240px;overflow-y:auto;min-width:280px}
.dropdown.open{display:block}
.opt{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.opt:last-child{border-bottom:none}
.opt:hover{background:#3a3a3c}
.opt-type{font-size:10px;color:var(--dim);float:right}

/* params row */
.params-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.params-row label{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.params-row select,.params-row input{padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.params-row select:focus,.params-row input:focus{border-color:var(--blue)}

/* plan map */


/* results */
.combo-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.combo-card:hover{background:#2c2c2e}
.combo-card.selected{background:#2c2c2e;border-left:3px solid var(--blue)}
.combo-card:last-child{border-bottom:none}
.combo-rank{font-size:22px;font-weight:700;color:var(--blue);min-width:32px;text-align:center}
.combo-info{flex:1}
.combo-route{font-weight:600;font-size:13px;margin-bottom:3px}
.combo-meta{font-size:11px;color:var(--sub);line-height:1.7}
.combo-score{text-align:right;flex-shrink:0}
.combo-pct{font-size:22px;font-weight:700}
.combo-detail-text{font-size:11px;color:var(--dim)}
.score-high{color:#30d158}
.score-med{color:#ff9f0a}
.score-low{color:#ff453a}

/* courbes */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .search{padding-left:12px}

/* table leaderboard */
#lb-table{width:100%;border-collapse:collapse;font-size:13px}
#lb-table th{text-align:left;padding:4px 7px;border-bottom:1px solid var(--border);font-size:10px;font-weight:600;text-transform:uppercase;color:var(--sub);background:#2c2c2e;white-space:nowrap}
#lb-table td{padding:4px 7px;border-bottom:0.5px solid var(--border);font-variant-numeric:tabular-nums;font-size:12px}
#lb-table tr:hover td{background:#2c2c2e}
.rank-cell{font-weight:700;color:var(--blue);width:40px}
.mv-bar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);vertical-align:middle;margin-left:6px}
.fill-pill{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.fill-high{background:#0d2b1a;color:#30d158}
.fill-med{background:#2b1a00;color:#ff9f0a}
.fill-low{background:#2b0a0a;color:#ff453a}

.loader,.no-data{padding:40px;text-align:center;color:var(--dim);background:var(--paper);border-radius:var(--radius)}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);padding:10px;border-radius:10px;margin-bottom:14px}
.range select,.range input{padding:8px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none}
.btn{padding:8px 18px;border-radius:10px;border:none;background:#f5f5f7;color:#1c1c1e;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.85}
.search::placeholder{color:rgba(255,255,255,.4)}

@media(min-width:768px){
  body{overflow:hidden}
  #tab-map{height:100vh !important;width:100vw !important}
  .map-rel{height:100% !important}
  main{padding:0 !important;margin:0 !important;max-width:100vw !important}
}

/* ── Slider combos ── */
.combo-slider-outer{overflow:hidden;margin:0}
.combo-slider-track{display:flex;gap:8px;padding:4px 0 0;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.combo-card-slide{min-width:100%;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.09);cursor:pointer;box-sizing:border-box}
.combo-card-slide.selected{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.combo-dots{display:flex;justify-content:center;gap:5px;padding:6px 0 4px}
.cdot{height:5px;border-radius:3px;background:#636366;transition:all .2s;display:inline-block}
.cdot.on{width:14px!important;background:rgba(255,255,255,.55)}
</style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:38px;background:rgba(16,16,20,.55);backdrop-filter:blur(48px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(48px) saturate(200%) brightness(1.05);border:0.5px solid rgba(255,255,255,.08);border-radius:14px;position:absolute;top:10px;left:10px;right:10px;z-index:300;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 24px rgba(0,0,0,.4)">
  <div style="font-size:15px;font-weight:700;color:#fff">Vélo'v</div>
  <div style="display:flex;gap:2px">
    <div class="tab on" data-tab="map" style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;cursor:pointer;color:#fff;font-size:12px;font-weight:600"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> Carte</div>
    <div class="tab" data-tab="stats" style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;cursor:pointer;color:#636366;font-size:12px;font-weight:600"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Stats</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="live-status" style="font-size:10px"></div>
    <div id="clock" style="font-size:12px;color:#8e8e93"></div>
  </div>
</header>




<main style="padding:0;overflow:hidden">



<!-- ═══ CARTE ═══ -->
<div class="panel on" id="tab-map" style="position:relative;display:flex;flex-direction:column;height:100vh;overflow:hidden">
  <div class="map-rel" style="position:relative;flex:1;overflow:hidden">
    <div id="map" style="height:100%;width:100%"></div>

    <!-- Flottant glass -->
    <div id="plan-float" style="position:absolute;top:58px;left:10px;right:10px;z-index:200;background:rgba(12,12,16,.52);backdrop-filter:blur(56px) saturate(220%) brightness(1.08);-webkit-backdrop-filter:blur(56px) saturate(220%) brightness(1.08);border-radius:16px;border:0.5px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 1px 0 0 rgba(255,255,255,.08),0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);overflow:visible;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s;max-height:250px"><div id="plan-close-btn" onclick="closePlanFloat()" style="position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:#2c2c2e;border:0.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:201"><svg width="8" height="8" viewBox="0 0 8 8" fill="none"><line x1="1.5" y1="1.5" x2="6.5" y2="6.5" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"/><line x1="6.5" y1="1.5" x2="1.5" y2="6.5" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div style="overflow:hidden;border-radius:14px">
      <div id="plan-float-expanded" style="padding:8px 10px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <div style="flex:1;background:rgba(255,255,255,.08);border-radius:10px;overflow:visible;border:0.5px solid rgba(255,255,255,.12)">
            <div style="position:relative">
              <input id="plan-from" class="search" type="text" placeholder="Départ…" autocomplete="off" style="background:transparent;border-radius:0;border:none;border-bottom:0.5px solid rgba(255,255,255,.08)"/>
              <div class="dropdown" id="plan-from-dd"></div>
            </div>
            <div style="position:relative">
              <input id="plan-to" class="search" type="text" placeholder="Arrivée…" autocomplete="off" style="background:transparent;border-radius:0;border:none;color:#fff"/>
              <div class="dropdown" id="plan-to-dd"></div>
            </div>
          </div>
          <button onclick="swapPlanFromTo()" style="width:30px;height:30px;border-radius:8px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);cursor:pointer;font-size:15px;color:#8e8e93;display:flex;align-items:center;justify-content:center;flex-shrink:0">⇅</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;background:rgba(255,255,255,.08);border-radius:20px;padding:2px;position:relative">
            <div id="toggle-slider" style="position:absolute;top:2px;left:2px;height:calc(100% - 4px);width:50%;background:rgba(255,255,255,.15);border-radius:18px;transition:transform .15s;pointer-events:none"></div>
            <button id="btn-now" onclick="setModeNow()" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/></svg></button>
            <button id="btn-plan" onclick="setModePlan()" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;color:rgba(255,255,255,.38);cursor:pointer;display:flex;align-items:center"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
          </div>
          <div id="plan-params" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">
            <select id="plan-dow" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#f5f5f7;font-size:11px"><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option><option value="0">Dimanche</option></select>
            <input type="time" id="plan-hour-time" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#f5f5f7;font-size:11px;outline:none" oninput="syncHourSelect()"/>
            <select id="plan-hour" style="display:none"></select>
            <select id="plan-radius" style="padding:4px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#f5f5f7;font-size:11px"><option value="300">300m</option><option value="500" selected>500m</option><option value="800">800m</option><option value="1200">1.2km</option></select>
          </div>
          <div style="display:flex;background:rgba(255,255,255,.08);border-radius:20px;padding:2px;position:relative">
            <div id="type-slider-now" style="position:absolute;top:2px;left:2px;height:calc(100% - 4px);width:50%;background:rgba(255,255,255,.15);border-radius:18px;transition:transform .15s;pointer-events:none"></div>
            <button onclick="setBikeType('elec')" style="position:relative;z-index:1;padding:5px 12px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;color:#fff"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
            <button onclick="setBikeType('meca')" style="position:relative;z-index:1;padding:4px 11px;border:none;background:transparent;font-size:11px;font-weight:600;cursor:pointer;color:rgba(255,255,255,.38)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button>
          </div>
          <select id="plan-type" style="display:none"><option value="elec">elec</option><option value="meca">meca</option><option value="any" selected>any</option></select>
          <button class="btn" onclick="computePlan()" style="margin-left:auto;padding:5px 14px;font-size:11px;border-radius:20px;background:rgba(255,255,255,.9);color:#111;border:none;font-weight:700;cursor:pointer;flex-shrink:0">🔍</button>
        </div>
      </div>

      <!-- État compact -->
      <div id="plan-float-compact" style="display:none;align-items:center;gap:10px;padding:9px 12px"></div>

      <!-- Résultats (liste compacte) -->
      <div id="plan-results-divider" style="display:none;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1) 15%,rgba(255,255,255,.1) 85%,transparent)"></div>
      <div id="plan-results-inner-header" style="display:none;padding:6px 12px 4px">
        <div id="plan-results-title" style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.3)"></div>
      </div>
      <div id="plan-results" style="overflow-y:auto;max-height:calc(80vh - 220px);padding:0 10px 10px"></div>

      </div>
    </div>


  </div>
</div>

<div class="panel" id="tab-stats" style="padding:10px;overflow-y:auto;max-height:100vh">
  <!-- Contrôles globaux -->
  <div class="card" style="padding:12px;margin-bottom:8px">
    <div class="card-title" style="margin-bottom:8px;font-size:10px">Période &amp; tri</div>
    <div class="range" style="gap:5px;padding:8px">
      <div style="display:flex;background:#2c2c2e;border-radius:20px;padding:2px">
        <button onclick="onLbViewChange('day')" id="lb-pill-day" style="padding:5px 14px;border:none;background:#3a3a3c;color:#fff;font-size:12px;font-weight:600;border-radius:18px;cursor:pointer">Jour</button>
        <button onclick="onLbViewChange('month')" id="lb-pill-month" style="padding:5px 14px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:600;border-radius:18px;cursor:pointer">Mois</button>
        <button onclick="onLbViewChange('year')" id="lb-pill-year" style="padding:5px 14px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:600;border-radius:18px;cursor:pointer">Année</button>
      </div>
      <input type="hidden" id="lb-view" value="day"/>
      <input type="date" id="lb-date"/>
      <input type="month" id="lb-month" style="display:none;padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px"/>
      <select id="lb-year" style="display:none;padding:7px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px"><option value="2025">2025</option><option value="2026" selected>2026</option></select>
      <select id="lb-sort">
        <option value="mv">Mouvements ↕</option>
        <option value="rotation">Taux de rotation</option>
        <option value="stands">Places libres</option>
        <option value="fill">% remplissage</option>
      </select>
      <input id="lb-station-search" type="text" placeholder="🔍 Station…" oninput="filterLbTable(this.value)" style="padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--paper);color:var(--ink);font-size:13px;outline:none;min-width:0;flex:1"/>
      <button class="btn" onclick="computeLeaderboard()">Calculer</button>
    </div>
  </div>

  <!-- Layout responsive : 2 col desktop, 1 col mobile -->
  <div id="stats-layout" style="display:grid">

    <!-- Table -->

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dl=(lat2-lat1)*Math.PI/180,dg=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dl/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function decodePolyline(encoded,precision=6){
  let i=0,lat=0,lng=0; const coords=[],f=Math.pow(10,precision);
  while(i<encoded.length){
    let b,s=0,r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1); s=0;r=0;
    do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lng+=(r&1)?~(r>>1):(r>>1);
    coords.push([lat/f,lng/f]);
  }
  return coords;
}

/* ═══ INDEXEDDB CACHE ════════════════════════════════ */
const _idbName='velov-cache', _idbStore='days', _idbVer=1;
let _idb=null;
function openIDB(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(_idbName,_idbVer);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(_idbStore);
    req.onsuccess=e=>{ _idb=e.target.result; res(_idb); };
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(key){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(_idbStore,'readonly');
      const req=tx.objectStore(_idbStore).get(key);
      req.onsuccess=()=>res(req.result??null);
      req.onerror=()=>res(null);
    });
  }catch{ return null; }
}
async function idbSet(key,val){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(_idbStore,'readwrite');
      tx.objectStore(_idbStore).put(val,key);
      tx.oncomplete=()=>res();
      tx.onerror=()=>res();
    });
  }catch{}
}

const _fetchDayCache={};
async function fetchDay(date){
  if(_fetchDayCache[date]) return _fetchDayCache[date];
  // Limit cache size
  if(Object.keys(_fetchDayCache).length>200){ const oldest=Object.keys(_fetchDayCache)[0]; delete _fetchDayCache[oldest]; }
  const today=new Date().toISOString().slice(0,10);
  // Vérifier IDB pour les dates passées
  if(date!==today){
    const cached=await idbGet(date);
    if(cached){ _fetchDayCache[date]=cached; return cached; }
  }
  try{
    if(date===today){
      const r=await fetch(`data/today.json?t=${Date.now()}`,{cache:'no-store'});
      if(!r.ok) return null;
      const data=await r.json();
      return data.base&&data.deltas ? expandDeltas(data) : Array.isArray(data)?data:null;
    }
    // Essayer .json.gz d'abord, puis .json en fallback
    for(const ext of ['.json.gz','.json']){
      const r=await fetch(`data/history/${date}${ext}`,{signal:AbortSignal.timeout(3000)});
      if(!r.ok) continue;
      let data;
      if(ext==='.json.gz'){
        const blob=await r.blob();
        const ds=new DecompressionStream('gzip');
        const stream=blob.stream().pipeThrough(ds);
        const text=await new Response(stream).text();
        data=JSON.parse(text);
      } else {
        data=await r.json();
      }
      const result=data.base&&data.deltas?expandDeltas(data):Array.isArray(data)?data:null;
      if(result && date!==today){
        _fetchDayCache[date]=result;
        idbSet(date,result); // persist IDB
      }
      return result;
    }
    return null;
  }catch{ return null; }
}

function expandDeltas(data){
  const base = data.base;
  const snapshots = [];
  const baseState = {};
  (base.s||[]).forEach(st=>{ baseState[st.n]={...st}; });
  const baseSnap = {t: base.t, s: Object.values(baseState)};
  if(base.meteo) baseSnap.meteo = base.meteo;
  snapshots.push(baseSnap);
  let lastMeteo = base.meteo || null;
  for(const delta of (data.deltas||[])){
    for(const d of (delta.d||[])){
      const n=d.n;
      if(!baseState[n]) baseState[n]={n};
      Object.assign(baseState[n], d);
    }
    const snap = {t: delta.t, s: Object.values(baseState).map(st=>({...st}))};
    // Propager la dernière météo connue si le delta n'en a pas
    if(delta.meteo){ lastMeteo=delta.meteo; snap.meteo=delta.meteo; }
    else if(lastMeteo){ snap.meteo=lastMeteo; }
    snapshots.push(snap);
  }
  return snapshots;
}
function getTs(snap){ return snap.timestamp||snap.t||''; }
function getSts(snap){
  let a=[];
  if(Array.isArray(snap)) a=snap;
  else if(Array.isArray(snap?.stations)) a=snap.stations;
  else if(Array.isArray(snap?.s)) a=snap.s;
  return a.map(st=>{
    if(st.number!==undefined) return st;
    return {number:st.n,available_bikes:st.b??0,available_bike_stands:st.s??0,
      bike_stands:st.c??0,electrical_bikes:st.e??0,mechanical_bikes:st.m??0,lat:st.la,lng:st.ln};
  });
}
async function fetchRange(startMs,endMs){
  const days=Math.ceil((endMs-startMs)/86400e3);
  const step=days<=14?1:days<=30?1:days<=90?3:days<=180?5:10;
  const dates=new Set();
  for(let i=0;i<=days;i+=step){ const d=new Date(startMs);d.setDate(d.getDate()+i);dates.add(d.toISOString().slice(0,10)); }
  dates.add(new Date(endMs).toISOString().slice(0,10));
  const results=await Promise.all([...dates].map(fetchDay));
  const all=[];
  results.forEach(s=>{if(s?.length)all.push(...s);});
  return all.filter(s=>{const t=new Date(getTs(s)).getTime();return t>=startMs&&t<=endMs;})
    .sort((a,b)=>new Date(getTs(a))-new Date(getTs(b)));
}
function calcMvFromSnaps(snaps){
  const mv={};
  for(let i=1;i<snaps.length;i++){
    const prev=getSts(snaps[i-1]),curr=getSts(snaps[i]);
    curr.forEach(c=>{
      const p=prev.find(s=>s.number===c.number); if(!p) return;
      const d=Math.abs(c.available_bikes-p.available_bikes);
      if(d>0) mv[c.number]=(mv[c.number]||0)+d;
    });
  }
  return mv;
}

  todayMv={};

  todayMv=calcMvFromSnaps(snaps);

function initMap(){

  map=L.map('map',{zoomControl:false}).setView([45.757,4.832],13); L.control.zoom({position:'bottomright'}).addTo(map);

function renderStations(){
  if(markers) markers.clearLayers();
  markers=L.layerGroup();
  if(!window._stationsHidden) markers.addTo(map);
  const zoom=map?map.getZoom():13;

  // Clustering au zoom faible
  if(zoom < 13){
    const cellSize=zoom>=11?0.015:0.03;
    const cells={};
    allStations.filter(s=>s.lat&&s.lng).forEach(st=>{
      const cx=Math.round(st.lat/cellSize), cy=Math.round(st.lng/cellSize);
      const key=cx+'_'+cy;
      if(!cells[key]) cells[key]={lat:0,lng:0,count:0,bikes:0,stands:0};
      cells[key].lat+=st.lat; cells[key].lng+=st.lng;
      cells[key].count++; cells[key].bikes+=st.available_bikes||0; cells[key].stands+=st.bike_stands||1;
    });
    Object.values(cells).forEach(cell=>{
      const lat=cell.lat/cell.count, lng=cell.lng/cell.count;
      const ratio=cell.bikes/cell.stands;
      const color=ratio>=0.4?'#1a7a3e':ratio>=0.15?'#f59e0b':'#b52a2a';
      const r=Math.max(14,Math.min(26,10+cell.count*1.5));
      const icon=L.divIcon({html:`<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 6px rgba(0,0,0,.4)">${cell.count}</div>`,iconSize:[r*2,r*2],iconAnchor:[r,r],className:''});
      markers.addLayer(L.marker([lat,lng],{icon}));
    });
    return;
  }

  // Stations individuelles avec taille variable
  allStations.forEach(st=>{
    if(!st.lat||!st.lng) return;
    const mv=todayMv[st.number]||0;
    const m=L.circleMarker([st.lat,st.lng],{radius:8,fillColor:stationColor(st),color:'#fff',weight:1.5,fillOpacity:.9});
    m.bindPopup(`<div style="min-width:190px;font-family:-apple-system,sans-serif">
      <b style="font-size:14px">${cleanName(st.name)}</b><br><br>
      ⚡ ${st.electrical_bikes} · 🔧 ${st.mechanical_bikes} · 🚲 ${st.available_bikes}<br>
      🅿️ ${st.available_bike_stands} places · ↕ ${mv} mvts/j</div>`);
    markers.addLayer(m);
  });
  buildHeatLayer();
}
function buildHeatLayer(){
  if(heatLayer) map.removeLayer(heatLayer);
  const vals=Object.values(todayMv).filter(v=>v>0);
  if(!vals.length) return;
  const maxMv=Math.max(...vals);
  // Seuil : seulement les stations ayant eu au moins 1 mouvement
  const pts=allStations
    .filter(s=>s.lat&&s.lng&&todayMv[s.number]>0)
    .map(s=>[s.lat, s.lng, todayMv[s.number]/maxMv]);
  heatLayer=L.heatLayer(pts,{
    radius:35,        // aura lisible au zoom 13
    blur:20,
    maxZoom:18,
    minOpacity:.1,    // faible pour que les différences soient visibles
    max:1.0,
    gradient:{
      0.0: '#313695',  // bleu foncé = peu de mouvements
      0.3: '#4575b4',
      0.5: '#74add1',
      0.7: '#fdae61',
      0.85:'#f46d43',
      1.0: '#d73027',  // rouge vif = beaucoup de mouvements
    }
  });
  if(heatOn) heatLayer.addTo(map);
}

function buildDropdown(inputId, ddId, opts){
  const input=document.getElementById(inputId), dd=document.getElementById(ddId);

  input.addEventListener('input',()=>{
    const q=input.value.trim();
    dd.innerHTML='';
    if(!q){ dd.classList.remove('open'); return; }

    // Stations locales (instantané)
    const stMatches=allStations
      .filter(s=>cleanName(s.name).toLowerCase().includes(q.toLowerCase()))
      .slice(0,5);

    // Lieux lyonnais connus (instantané)
    const lieuMatches=LIEUX_LYON
      .filter(l=>l.name.toLowerCase().includes(q.toLowerCase()))
      .slice(0,3);

    const render=(geoResults=[])=>{
      dd.innerHTML='';
      stMatches.forEach(st=>{
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`${cleanName(st.name)} <span class="opt-type">🚲 station</span>`;
        el.onclick=()=>{ input.value=cleanName(st.name); dd.classList.remove('open'); opts.onStation?.(st); };
        dd.appendChild(el);
      });
      geoResults.forEach(geo=>{
        const el=document.createElement('div'); el.className='opt';
        const geoType=geo.type||geo.class||'';
        const isShop=geoType==='shop'||geoType==='office'||geoType==='company'||geoType==='commercial'||(geo.extratags?.office)||(geo.extratags?.company);
        const icon=isShop?'🏢':'📍';
        const typeLabel=isShop?'entreprise':'adresse';
        const shortName=geo.display_name.split(',').slice(0,2).join(',').trim();
        el.innerHTML=`${shortName} <span class="opt-type">${icon} ${typeLabel}</span>`;
        el.onclick=()=>{
          input.value=geo.display_name.split(',').slice(0,2).join(',');
          dd.classList.remove('open');
          const pos={lat:parseFloat(geo.lat),lng:parseFloat(geo.lon)};
          opts.onGeoPos?.(pos);
        };
        dd.appendChild(el);
      });
      // Lieux locaux
      lieuMatches.forEach(l=>{
        if(geoResults.some(g=>g.display_name?.includes(l.name))) return; // dédoublonner
        const el=document.createElement('div'); el.className='opt';
        el.innerHTML=`<span style="font-size:14px">${l.type}</span><div><div style="font-weight:500">${l.name}</div><div style="font-size:11px;color:var(--dim)">Lyon</div></div>`;
        el.onclick=()=>{ input.value=l.name; dd.classList.remove('open'); opts.onGeoPos?.({lat:l.lat,lng:l.lng}); };
        dd.appendChild(el);
      });
      if(stMatches.length||geoResults.length||lieuMatches.length){
        positionDropdown(inputId, ddId);
        dd.classList.add('open');
      } else dd.classList.remove('open');
    };

    render(); // afficher les stations tout de suite

    // Géocodage Nominatim avec debounce 200ms
    clearTimeout(_nominatimDebounce[inputId]);
    if(q.length>=3){
      _nominatimDebounce[inputId]=setTimeout(async()=>{
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+', Lyon, France')}&limit=6&addressdetails=1&extratags=1`);
          const data=await r.json();
          render(data);
        }catch{}
      },200);
    }
  });

  document.addEventListener('click',e=>{
    if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
  });
}

async function renderCourbes(){
  const content=document.getElementById('courbes-content');
  if(!selectedStation) return;
  content.innerHTML='<div class="loader">Chargement…</div>';
  const days=courbesSliderDays, endMs=Date.now(), startMs=endMs-days*86400e3;
  const snaps=await fetchRange(startMs,endMs);
  if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
  const id=selectedStation.number;
  const labels=[],dataElec=[],dataMeca=[],dataFluxH=[];
  const rawDeltas=[];
  snaps.forEach((snap,i)=>{
    if(i===0) return;
    const prev=getSts(snaps[i-1]),curr=getSts(snap);
    const st=curr.find(s=>s.number===id),pst=prev.find(s=>s.number===id);
    if(st&&pst){ const d=pst.available_bikes-st.available_bikes; rawDeltas.push({ms:new Date(getTs(snap)).getTime(),delta:d>0?d:0}); }
  });
  snaps.forEach(snap=>{
    const st=getSts(snap).find(s=>s.number===id); if(!st) return;
    const t=new Date(getTs(snap)), ms=t.getTime();
    labels.push(days<=1?t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):t.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
    dataElec.push(st.electrical_bikes||0); dataMeca.push(st.mechanical_bikes||0);
    dataFluxH.push(rawDeltas.filter(d=>d.ms>ms-3600e3&&d.ms<=ms).reduce((a,d)=>a+d.delta,0));
  });
  content.innerHTML=`
    <div class="card"><div class="card-title">⚡ Électriques</div><canvas id="elec-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">🔧 Mécaniques</div><canvas id="meca-chart" height="80"></canvas></div>
    <div class="card"><div class="card-title">↕ Départs/heure glissante</div><canvas id="flux-chart" height="60"></canvas></div>`;
  chartElec?.destroy(); chartMeca?.destroy(); chartFlux?.destroy();
  const pr=days<=1?0:2;
  const mk=(cid,data,color,label)=>new Chart(document.getElementById(cid),{type:'line',
    data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:color+'18',borderWidth:1.8,tension:0,pointRadius:pr,spanGaps:true,fill:true}]},
    options:chartOpts()});
  chartElec=mk('elec-chart',dataElec,'#1a7a3e','⚡ Électriques');
  chartMeca=mk('meca-chart',dataMeca,'#b52a2a','🔧 Mécaniques');
  chartFlux=new Chart(document.getElementById('flux-chart'),{type:'bar',
    data:{labels,datasets:[{label:'Départs/h',data:dataFluxH,
      backgroundColor:dataFluxH.map(v=>v>5?'rgba(255,59,48,.65)':v>2?'rgba(255,159,10,.6)':'rgba(0,113,227,.5)'),borderWidth:0}]},
    options:chartOpts()});
}

async function computeLeaderboard(){
  const content=document.getElementById('lb-content');
  content.innerHTML='<div class="loader">Calcul…</div>';
  const view=document.getElementById('lb-view').value;

  if(view==='day'){
    const d=document.getElementById('lb-date').value;
    if(!d){ content.innerHTML='<div class="no-data">Sélectionnez une date.</div>'; return; }
    const snaps=await fetchDay(d)||[];
    if(!snaps.length){ content.innerHTML='<div class="no-data">Aucune donnée.</div>'; return; }
    lbMvCache=calcMvFromSnaps(snaps);
  } else {
    // Mois ou Année — agréger plusieurs jours
    let dates=[];
    if(view==='month'){
      const m=document.getElementById('lb-month').value;
      if(!m){ content.innerHTML='<div class="no-data">Sélectionnez un mois.</div>'; return; }
      const [y,mo]=m.split('-').map(Number);
      const days=new Date(y,mo,0).getDate();
      for(let d=1;d<=days;d++) dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    } else {
      const y=document.getElementById('lb-year').value;
      for(let mo=1;mo<=12;mo++) for(let d=1;d<=new Date(y,mo,0).getDate();d++)
        dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    }
    // Limiter aux dates passées
    const today=new Date().toISOString().slice(0,10);
    dates=dates.filter(d=>d<=today);
    content.innerHTML=`<div class="loader">Calcul sur ${dates.length} jours…</div>`;
    // Agréger les mouvements
    const cumul={};
    const BATCH=12;
    for(let b=0;b<dates.length;b+=BATCH){
      const batch=dates.slice(b,b+BATCH);
      const results=await Promise.all(batch.map(d=>fetchDay(d).then(s=>s||[])));
      results.forEach(snaps=>{
        const mv=calcMvFromSnaps(snaps);
        for(const [num,v] of Object.entries(mv)) cumul[num]=(cumul[num]||0)+v;
      });
      content.innerHTML=`<div class="loader">${Math.min(b+BATCH,dates.length)}/${dates.length} jours…</div>`;
    }
    lbMvCache=cumul;
  }
  content.innerHTML='<div style="overflow-x:auto"><table id="lb-table"><thead id="lb-head"></thead><tbody id="lb-body"></tbody></table></div>';
  renderLbTable(lbMvCache);
  if(view==='day') showDayMeteo(document.getElementById('lb-date').value);
  const srch=document.getElementById('lb-station-search'); if(srch) srch.value='';
}

async function showDayMeteo(date){
  const snaps=await fetchDay(date);
  if(!snaps||!snaps.length) return;
  let totalPrecip=0,totalTemp=0,nMeteo=0,rainySnaps=0;
  snaps.forEach(s=>{
    const m=s.meteo; if(!m) return;
    totalPrecip+=m.precipitation||0;
    if(m.temp!==undefined) totalTemp+=m.temp;
    if(m.rain) rainySnaps++;
    nMeteo++;
  });
  if(!nMeteo) return;
  const avgTemp=Math.round(totalTemp/nMeteo*10)/10;
  const rainyPct=Math.round(rainySnaps/nMeteo*100);
  const icon=rainyPct>50?'🌧️':rainyPct>20?'⛅':'☀️';
  const el=document.getElementById('lb-meteo');
  if(el) el.textContent=`${icon} ${avgTemp}°C · ${(totalPrecip/nMeteo).toFixed(1)} mm/h moy · ${rainyPct}% pluvieux`;
}

// WMO weather codes → emoji + label
function meteoFromCode(code, rain){
  if(rain || code>=51) return {icon:'🌧️', label:'Pluvieux', rainy:true};
  if(code>=45)         return {icon:'🌫️', label:'Brouillard', rainy:false};
  if(code>=3)          return {icon:'☁️',  label:'Nuageux', rainy:false};
  if(code>=1)          return {icon:'⛅',  label:'Peu nuageux', rainy:false};
  return                      {icon:'☀️',  label:'Ensoleillé', rainy:false};
}

async function fetchCurrentMeteo(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.75&longitude=4.83&current=precipitation,rain,weathercode,temperature_2m,windspeed_10m,winddirection_10m&timezone=Europe%2FParis');
    if(!r.ok) return null;
    const d=await r.json();
    const cur=d.current||{};
    return {
      precipitation: cur.precipitation||0,
      rain: (cur.precipitation||0)>0.1,
      weathercode: cur.weathercode||0,
      temp: cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m*10)/10 : undefined,
      wind: cur.windspeed_10m !== undefined ? Math.round(cur.windspeed_10m) : undefined,
      winddir: cur.winddirection_10m !== undefined ? Math.round(cur.winddirection_10m) : undefined,
    };
  }catch{ return null; }
}

  _openComboIdx=null;

  if(planLayerGroup) planLayerGroup.clearLayers();

  // Vérifier les champs AVANT tout chargement
  if(!planFromPos && !planFromFixed){
    results.innerHTML='<div class="no-data">Sélectionnez un point de départ.</div>';
    return;
  }
  if(!planToPos && !planToFixed){
    results.innerHTML='<div class="no-data">Destination manquante.</div>';
    return;
  }

  // Afficher loader + ouvrir volet
  // Expansion du flottant
  document.getElementById('plan-float')?.style.setProperty('max-height',window.innerWidth<=640?'58vh':'80vh');
  document.getElementById('plan-results').style.display='';
  results.innerHTML='<div class="loader">Analyse de l\'historique…</div>';

  // Météo
  const meteo=await fetchCurrentMeteo();
  const meteoEl=document.getElementById('plan-meteo');
  if(meteo&&meteoEl){
    const m=meteoFromCode(meteo.weathercode,meteo.rain);
    const parts=[];
    if(meteo.temp!==undefined) parts.push((m.icon||'')+' '+meteo.temp+'°C');
    if(meteo.wind!==undefined) parts.push(meteo.wind+' km/h');
    meteoEl.textContent=parts.join(' · ');
  }
  const isRainy=(meteo?.precipitation??0)>0.1;
  const currentPrecip=meteo?.precipitation??0;

  const bikeType=document.getElementById('plan-type').value; window._planBikeType=bikeType;
  const radius=parseInt(document.getElementById('plan-radius').value);
  const topN=10;
  const isNowMode=(window._planMode||'now')==='now';
  const now2=new Date();
  const targetDow=isNowMode?now2.getDay():parseInt(document.getElementById('plan-dow')?.value)||now2.getDay();
  const planHourEl=document.getElementById('plan-hour-time');
  const planHourVal=planHourEl?.value?parseInt(planHourEl.value.split(':')[0]):now2.getHours();
  const targetH=isNowMode?now2.getHours():planHourVal;
  const bikeSpeedKmh=bikeType==='meca'?16:21;

  // Charger TOUT l'historique disponible (même jour de semaine)
  results.innerHTML='<div class="loader">Calcul historique…</div>';
  const allDays=[];
  const today2=new Date();
  const targetDates=[];
  for(let i=1;i<=500;i++){
    const d=new Date(today2); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) targetDates.push({date:d.toISOString().slice(0,10),daysAgo:i});
  }
  // Map daysAgo par date pour pondération récence
  const _daysAgoMap={};
  targetDates.forEach(({date,daysAgo})=>{ _daysAgoMap[date]=daysAgo; });
  for(let i=0;i<targetDates.length;i+=16){
    const batch=targetDates.slice(i,i+16);
    const res=await Promise.all(batch.map(({date})=>fetchDay(date).catch(()=>null)));
    res.forEach((snaps,j)=>{ if(snaps) allDays.push({snaps,daysAgo:batch[j].daysAgo}); });
  }

  // Stations proches
  const depCenter=planFromFixed?{lat:planFromFixed.lat,lng:planFromFixed.lng}:planFromPos;
  let depStations=allStations.filter(s=>s.lat&&s.lng)
    .map(s=>({...s,dist:haversine(depCenter.lat,depCenter.lng,s.lat,s.lng)}))
    .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
  if(planFromFixed&&depStations[0]?.number!==planFromFixed.number)
    depStations=[planFromFixed,...depStations.filter(s=>s.number!==planFromFixed.number)].slice(0,6);

  const arrCenter=planToFixed?{lat:planToFixed.lat,lng:planToFixed.lng}:planToPos;
  let arrStations=allStations.filter(s=>s.lat&&s.lng)
    .map(s=>({...s,dist:haversine(arrCenter.lat,arrCenter.lng,s.lat,s.lng)}))
    .filter(s=>s.dist<=radius).sort((a,b)=>a.dist-b.dist).slice(0,6);
  if(planToFixed&&arrStations[0]?.number!==planToFixed.number)
    arrStations=[planToFixed,...arrStations.filter(s=>s.number!==planToFixed.number)].slice(0,6);

  if(!depStations.length||!arrStations.length){
    results.innerHTML='<div class="no-data">Aucune station dans ce rayon. Augmentez le rayon.</div>';
    return;
  }

  // ── Fonctions de pondération ──
  const currentTemp=meteo?.temperature??null;
  const currentRainy=isRainy;
  const nowMinutes=targetH*60; // minutes depuis minuit pour la cible

  function wRecence(daysAgo){
    // Demi-vie 45 jours — récent pèse beaucoup plus
    return Math.exp(-daysAgo/45);
  }
  function wTemperature(snapTemp){
    if(snapTemp==null||currentTemp==null) return 0.7;
    const diff=snapTemp-currentTemp;
    return Math.exp(-(diff*diff)/128); // sigma=8°C
  }
  function wPluie(snapMeteo){
    if(!snapMeteo) return 0.7;
    const snapRainy=(snapMeteo.precipitation??0)>0.1||snapMeteo.rain===true;
    return snapRainy===currentRainy ? 1.0 : 0.35;
  }
  function wHeure(snapMinutes){
    const diff=snapMinutes-nowMinutes;
    return Math.exp(-(diff*diff)/450); // sigma≈21min, ±30min→0.65
  }

  // Calcul probas depuis l'historique
  const allIds=new Set([...depStations.map(s=>s.number),...arrStations.map(s=>s.number)]);
  const stationProba={};
  const _depNAcc={},_arrNAcc={},_depElecAcc={},_depMecaAcc={};

  allIds.forEach(num=>{
    let depSum=0,arrSum=0,wSum=0,depHit=0,arrHit=0,samples=0;
    allDays.forEach(({snaps,daysAgo})=>{
      const wRec=wRecence(daysAgo);
      snaps.forEach(snap=>{
        const snapDate=new Date(getTs(snap));
        const snapMinutes=snapDate.getHours()*60+snapDate.getMinutes();
        // Filtre souple : ±90min autour de l'heure cible
        if(Math.abs(snapMinutes-nowMinutes)>90) return;
        const sts=getSts(snap),st=sts.find(s=>s.number===num);
        if(!st||!st.bike_stands) return;
        const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';
        const snapM=snap.meteo;
        const snapTemp=snapM?.temperature??null;
        const w=wRec * wTemperature(snapTemp) * wPluie(snapM) * wHeure(snapMinutes);
        if(w<0.01) return; // ignorer poids négligeables
        const depVal=st[depKey]||0, arrVal=st.available_bike_stands||0;
        const elecVal=st.electrical_bikes||0, mecaVal=st.mechanical_bikes||0;
        depSum+=depVal/st.bike_stands*100*w; arrSum+=arrVal/st.bike_stands*100*w; wSum+=w;
        if(depVal>=1) depHit+=w; if(arrVal>=1) arrHit+=w; samples++;
        _depNAcc[num]=(_depNAcc[num]||0)+depVal*w; _arrNAcc[num]=(_arrNAcc[num]||0)+arrVal*w;
        _depElecAcc[num]=(_depElecAcc[num]||0)+elecVal*w; _depMecaAcc[num]=(_depMecaAcc[num]||0)+mecaVal*w;
      });
    });
    stationProba[num]={
      dep:wSum>0?Math.round(depSum/wSum):null, arr:wSum>0?Math.round(arrSum/wSum):null,
      depN:wSum>0?Math.round((_depNAcc[num]||0)/wSum*10)/10:null,
      depElecN:wSum>0?Math.round((_depElecAcc[num]||0)/wSum*10)/10:null,
      depMecaN:wSum>0?Math.round((_depMecaAcc[num]||0)/wSum*10)/10:null,
      arrN:wSum>0?Math.round((_arrNAcc[num]||0)/wSum*10)/10:null,
      depProb:wSum>0?Math.round(depHit/wSum*100):null,
      arrProb:wSum>0?Math.round(arrHit/wSum*100):null,
      samples
    };
  });



  // Générer combinaisons
  const combos=[];
  for(const dep of depStations){
    for(const arr of arrStations){
      if(dep.number===arr.number) continue;
      const pd=stationProba[dep.number],pa=stationProba[arr.number];
      const depPct=pd?.dep??null,arrPct=pa?.arr??null;
      const depProb=pd?.depProb??null,arrProb=pa?.arrProb??null;
      if(depPct===null||arrPct===null) continue;
      const dist=haversine(dep.lat,dep.lng,arr.lat,arr.lng);
      const rideMin=Math.round(dist/1000/bikeSpeedKmh*60);
      const scoreBase=(depProb!==null&&arrProb!==null)?Math.round(depProb*0.6+arrProb*0.4):Math.round((depPct||0)*0.6+(arrPct||0)*0.4);
      let score=scoreBase;
      if(isNowMode){
        const liveDep=allStations.find(s=>s.number===dep.number);
        const liveArr=allStations.find(s=>s.number===arr.number);
        if(liveDep&&liveDep.bike_stands>0){
          const liveDepPct=(bikeType==='elec'?(liveDep.electrical_bikes||0):bikeType==='meca'?(liveDep.mechanical_bikes||0):(liveDep.available_bikes||0))/liveDep.bike_stands*100;
          score=Math.round(score*0.5+liveDepPct*0.3+(liveArr&&liveArr.bike_stands>0?liveArr.available_bike_stands/liveArr.bike_stands*100*0.2:0));
        }
      }
      const liveDep2=allStations.find(s=>s.number===dep.number);
      const liveArr2=allStations.find(s=>s.number===arr.number);
      combos.push({
        dep:Object.assign({},dep,{live:liveDep2||null}),
        arr:Object.assign({},arr,{live:liveArr2||null}),
        depPct,arrPct,depProb,arrProb,
        depN:pd?.depN??null,depElecN:pd?.depElecN??null,depMecaN:pd?.depMecaN??null,arrN:pa?.arrN??null,
        score,dist,rideMin,samples:pd?.samples??0
      });
    }
  }
  combos.sort((a,b)=>b.score-a.score);
  const top=combos.slice(0,topN);

  if(!top.length){
    results.innerHTML='<div class="no-data">Pas assez de données historiques pour ces stations.</div>';
    return;
  }

  const meteoNote=isRainy?' 🌧️':'';
  document.getElementById('plan-results-title').textContent=
    `Top ${top.length} combinaisons · ${DOW_NAMES[targetDow]} ${String(targetH).padStart(2,'0')}h · ${bikeType==='elec'?'⚡ Élec':bikeType==='meca'?'🔧 Méca':'🚲 Tous'} · ${allDays.length} sem.${meteoNote}`;

  const renderComboList=(limit)=>{
    const shown=top.slice(0,limit);
    const html=shown.map((combo,i)=>{
      const sc=Math.round(combo.score??0);
      const bt=document.getElementById('plan-type')?.value||'elec';
      const rColors=bt==='meca'?['#7a1a1a','#a82a2a','#d04444']:['#1a6b36','#2a8a4a','#3eaa62'];
      const rColor=i<3?rColors[i]:'transparent';
      const depCol=(combo.depProb??0)>=60?'#34c759':(combo.depProb??0)>=35?'#ff9f0a':'#ff453a';
      const arrCol=(combo.arrProb??0)>=60?'#34c759':(combo.arrProb??0)>=35?'#ff9f0a':'#ff453a';
      const scCol=sc>=60?'#34c759':sc>=35?'#ff9f0a':'#ff453a';
      const scBg=sc>=60?'#0d2b1a':sc>=35?'#2b1a00':'#2b0a0a';
      const liveElec=combo.dep.live?.electrical_bikes??0;
      const liveMeca=combo.dep.live?.mechanical_bikes??0;
      const livePlaces=combo.arr.live?.available_bike_stands??'?';
      const depDist=planFromFixed?'':` · ${Math.round(combo.dep.dist||0)}m`;

      const avgDepN=combo.depN!==null?Math.round(combo.depN):null;
      const avgArrN=combo.arrN!==null?Math.round(combo.arrN):null;
      const scBadge=sc?`<div style="background:${scBg};border-radius:5px;padding:2px 5px;flex-shrink:0"><span style="font-size:11px;font-weight:700;color:${scCol}">${sc}%</span></div>`:'';

      const cardBody=isNowMode&&combo.dep.live?`
        <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0">
          <div style="display:flex;gap:5px;align-items:center">
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;color:#f5f5f7;line-height:1">${liveElec}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">⚡</div></div>
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;color:#f5f5f7;line-height:1">${liveMeca}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">🔧</div></div>
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;line-height:1">${livePlaces}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">🅿️</div></div>
          </div>
          <div style="display:flex;gap:5px;align-items:center">
            ${avgDepN!==null?`<div style="font-size:9px;color:rgba(255,255,255,.35)">moy. <span style="color:rgba(255,255,255,.6);font-weight:600">${avgDepN}</span> dép · <span style="color:rgba(255,255,255,.6);font-weight:600">${avgArrN??'?'}</span> arr.</div>`:''}
            ${scBadge}
          </div>
        </div>`:`
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
          <div style="display:flex;gap:5px;align-items:center">
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;color:#f5f5f7;line-height:1">${combo.depElecN!=null?'~'+Math.round(combo.depElecN):'?'}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">⚡</div></div>
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;color:#f5f5f7;line-height:1">${combo.depMecaN!=null?'~'+Math.round(combo.depMecaN):'?'}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">🔧</div></div>
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;line-height:1">${avgArrN!=null?'~'+avgArrN:'?'}</div><div style="font-size:8px;color:rgba(255,255,255,.3)">🅿️</div></div>
          </div>
          <div style="display:flex;gap:5px;align-items:center">
            <div style="font-size:9px;color:rgba(255,255,255,.35)"><span style="color:${depCol};font-weight:600">${combo.depProb??'?'}%</span> dép · <span style="color:${arrCol};font-weight:600">${combo.arrProb??'?'}%</span> arr.</div>
            ${scBadge}
          </div>
        </div>`;

      return `<div class="combo-card-slide combo-card${i===0?' selected':''}" onclick="selectComboIdx(${i})" data-idx="${i}">
        <div style="width:3px;height:34px;border-radius:2px;background:${rColor};flex-shrink:0"></div>
        <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.28);min-width:14px;flex-shrink:0">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cleanName(combo.dep.name)}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cleanName(combo.arr.name)}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:1px">${Math.round(combo.dist/1000*10)/10}km · ~${combo.rideMin}min</div>
        </div>
        ${cardBody}
      </div>`;
    }).join('');
    // Desktop : liste verticale classique
    if(window.innerWidth > 640){
      const more=top.length>limit
        ?`<div style="text-align:center;padding:10px"><button onclick="window._showMoreCombos()" style="padding:5px 16px;border-radius:20px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.08);font-size:12px;cursor:pointer;color:var(--sub)">Voir les ${top.length-limit} autres combinaisons</button></div>`:'';
      return html+more;
    }
    // Mobile : slider swipeable
    const dots=shown.map((_,i)=>`<div class="cdot${i===0?' on':''}" style="width:${i===0?'14':'5'}px" data-cidx="${i}"></div>`).join('');
    const sliderHtml=`
      <div class="combo-slider-outer">
        <div class="combo-slider-track" id="combo-slider-track">${html.replace(/class="combo-card/g,'class="combo-card-slide combo-card')}</div>
      </div>
      <div class="combo-dots" id="combo-dots">${dots}</div>`;
    return sliderHtml;
  };

  const topScore=top[0]?.score??0;
  const autoLimit=topScore<30?top.length:topScore<50?Math.min(5,top.length):3;
  results.innerHTML=renderComboList(autoLimit);
  document.getElementById('plan-results').style.display='';
  if(document.getElementById('plan-float')) document.getElementById('plan-float').style.maxHeight=window.innerWidth<=640?'58vh':'80vh';
  window._showMoreCombos=()=>{ results.innerHTML=renderComboList(top.length); initSliderSwipe(); drawTop3Routes(); };
  initSliderSwipe();
  window._planCombos=top;
  _openComboIdx=null;
  drawTop3Routes();
  hideBackgroundStations();
  if(window.innerWidth<=640) compactPlanFloat();
  } catch(err) {
    console.error('computePlan error:', err);
    if(results) results.innerHTML='<div class="no-data">Erreur: ' + err.message + '</div>';
  }
}

let planLayerGroup=null;

let _openComboIdx = null;

async function selectComboIdx(idx){
  window._openComboIdx=idx;
  _openComboIdx=idx;
  document.querySelectorAll('.combo-card,.combo-card-slide').forEach((c,i)=>c.classList.toggle('selected',i===idx));
  // Sync slider position
  const track=document.getElementById('combo-slider-track');
  if(track){ const w=track.parentElement.offsetWidth||track.children[0]?.offsetWidth||300; track.style.transform=`translateX(calc(-${idx}*(${w}px + 8px)))`; }
  // Sync dots
  document.querySelectorAll('#combo-dots .cdot').forEach((d,i)=>{ d.classList.toggle('on',i===idx); d.style.width=i===idx?'14px':'5px'; });
  await showRoute(idx);
  // Compact vers pill résultat
  if(window.innerWidth <= 640){
    const pf=document.getElementById('plan-float');
    if(pf) pf.style.maxHeight='62px';
    compactPlanFloat();
  }
}



async function drawTop3Routes(){
  const top=window._planCombos; if(!top||!top.length) return;

  const bikeType=document.getElementById('plan-type')?.value||'elec';
  const colorsElec=['#1a6b36','#2a8a4a','#3eaa62'];
  const colorsMeca=['#7a1a1a','#a82a2a','#d04444'];
  const colors=bikeType==='meca'?colorsMeca:colorsElec;
  const weights=[4,3,2.5];
  const opacities=[0.95,0.75,0.55];
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);
  const radius=parseInt(document.getElementById('plan-radius').value)||500;
  // Marqueurs départ/arrivée
  // Points départ/arrivée + cercles de rayon
  if(planFromPos&&!planFromFixed){
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:7,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planFromPos.lat,planFromPos.lng],{radius,color:'#1a9e3f',fillColor:'#1a9e3f',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  if(planToPos&&!planToFixed){
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:7,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);
    L.circle([planToPos.lat,planToPos.lng],{radius,color:'#c0001a',fillColor:'#c0001a',fillOpacity:.05,weight:1.5,dashArray:'6,4'}).addTo(planLayerGroup);
  }
  // Tracer les 3 premiers en parallèle
  const routePromises=top.slice(0,3).map(async(combo,i)=>{
    let coords=null;
    try{
      const brUrl=`https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=trekking&alternativeidx=0&format=geojson`;
      const rb=await fetch(brUrl,{signal:AbortSignal.timeout(10000)});
      if(rb.ok){ const db=await rb.json(); const geom=db.features?.[0]?.geometry; if(geom?.type==='LineString') coords=geom.coordinates.map(([lng,lat])=>[lat,lng]); }
    }catch{}
    if(!coords){
      try{
        const osrmUrl=`https://router.project-osrm.org/route/v1/bike/${combo.dep.lng},${combo.dep.lat};${combo.arr.lng},${combo.arr.lat}?overview=full&geometries=polyline6`;
        const ro=await fetch(osrmUrl,{signal:AbortSignal.timeout(10000)});
        if(ro.ok){ const dor=await ro.json(); const geom=dor.routes?.[0]?.geometry; if(geom) coords=decodePolyline(geom); }
      }catch{}
    }
    return {coords,i,combo};
  });
  const routes=await Promise.all(routePromises);
  // Tracer en ordre inverse (le 1er par-dessus)
  [...routes].reverse().forEach(({coords,i,combo})=>{
    if(coords){
      // Liseré blanc pour lisibilité
      L.polyline(coords,{color:'#fff',weight:weights[i]+3,opacity:.7,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      const pl=L.polyline(coords,{color:colors[i],weight:weights[i],opacity:opacities[i],lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      const _i=i; pl.on('click',(e)=>{window._routeClickGuard=true;L.DomEvent.stopPropagation(e);selectComboIdx(_i);});
      // Zone de clic élargie invisible
      L.polyline(coords,{color:'transparent',weight:20,opacity:0}).on('click',(e)=>{window._routeClickGuard=true;L.DomEvent.stopPropagation(e);selectComboIdx(_i);}).addTo(planLayerGroup);
    }
    // Marqueurs stations
    const depM=L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    depM.bindTooltip(cleanName(combo.dep.name),{direction:'top',permanent:false});
    depM.on('click',(e)=>{window._routeClickGuard=true;L.DomEvent.stopPropagation(e);selectComboIdx(i);});
    depM.addTo(planLayerGroup);
    const arrM=L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:i===0?9:6,fillColor:colors[i],color:'#fff',weight:i===0?2:1,fillOpacity:.9});
    arrM.bindTooltip(cleanName(combo.arr.name),{direction:'top',permanent:false});
    arrM.on('click',(e)=>{window._routeClickGuard=true;L.DomEvent.stopPropagation(e);selectComboIdx(i);});
    arrM.addTo(planLayerGroup);
  });
  // Zoom sur le premier
  if(routes[0]?.coords) planMap.fitBounds(L.polyline(routes[0].coords).getBounds().pad(.25));
}

async function showRoute(idx){
  // Highlight carte
  document.querySelectorAll('.combo-card').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });

  const combo=window._planCombos?.[idx]; if(!combo) return;
  if(planLayerGroup) planLayerGroup.clearLayers();
  planLayerGroup=L.layerGroup().addTo(planMap);

  // Marqueurs départ/arrivée réels
  const radius=parseInt(document.getElementById('plan-radius').value);

  // Points départ/arrivée épurés
  if(planFromPos&&!planFromFixed)
    L.circleMarker([planFromPos.lat,planFromPos.lng],{radius:8,fillColor:'#fff',color:'#1a9e3f',weight:3,fillOpacity:.9}).bindTooltip('Départ',{direction:'top'}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.circleMarker([planToPos.lat,planToPos.lng],{radius:8,fillColor:'#fff',color:'#c0001a',weight:3,fillOpacity:.9}).bindTooltip('Arrivée',{direction:'top'}).addTo(planLayerGroup);

  // Stations départ/arrivée
  L.circleMarker([combo.dep.lat,combo.dep.lng],{radius:10,fillColor:'#1a7a3e',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.dep.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);
  L.circleMarker([combo.arr.lat,combo.arr.lng],{radius:10,fillColor:'#ff3b30',color:'#fff',weight:2,fillOpacity:.95})
    .bindTooltip(cleanName(combo.arr.name),{permanent:false,direction:'top'}).addTo(planLayerGroup);

  // Routing Valhalla entre les deux stations
  const bikeType=document.getElementById('plan-type').value; window._planBikeType=bikeType;
  const speed=bikeType==='meca'?16:21;
  const routeColor=bikeType==='meca'?'#e8001c':'#1a7a3e';
  try{
    const body={
      locations:[{lon:combo.dep.lng,lat:combo.dep.lat},{lon:combo.arr.lng,lat:combo.arr.lat}],
      costing:'bicycle',
      costing_options:{bicycle:{bicycle_type:'Road',cycling_speed:speed,use_roads:0.4,use_hills:0.2}},
      directions_type:'none'
    };
    let coords = null;

    // 1. Brouter — direct, pas de Valhalla (down)
    try {
      const brUrl = `https://brouter.de/brouter?lonlats=${combo.dep.lng},${combo.dep.lat}|${combo.arr.lng},${combo.arr.lat}&profile=trekking&alternativeidx=0&format=geojson`;
      const rb = await fetch(brUrl, {signal: AbortSignal.timeout(12000)});
      if(rb.ok){
        const db = await rb.json();
        const geom = db.features?.[0]?.geometry;
        if(geom?.type==='LineString') coords = geom.coordinates.map(([lng,lat])=>[lat,lng]);
      }
    } catch{}

    // 2. Fallback OSRM bike
    if(!coords){
      try {
          const osrmUrl = `https://router.project-osrm.org/route/v1/bike/${combo.dep.lng},${combo.dep.lat};${combo.arr.lng},${combo.arr.lat}?overview=full&geometries=polyline6`;
        const ro = await fetch(osrmUrl, {signal: AbortSignal.timeout(12000)});
        if(ro.ok){
          const dor = await ro.json();
          const geom = dor.routes?.[0]?.geometry;
          if(geom) coords = decodePolyline(geom);
        }
      } catch{}
    }

    // 3. Fallback Valhalla si de retour
    if(!coords){
      try {
        const rv0 = await fetch(`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(body))}`, {signal: AbortSignal.timeout(8000)});
        if(rv0.ok){
          const dv0 = await rv0.json();
          const leg0 = dv0.trip?.legs?.[0];
          if(leg0) coords = decodePolyline(leg0.shape);
        }
      } catch {}
    }

    if(coords){
      L.polyline(coords,{color:'#fff',weight:8,opacity:.65,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      L.polyline(coords,{color:routeColor,weight:5,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(planLayerGroup);
      setTimeout(()=>{
        planMap.invalidateSize();
        planMap.fitBounds(L.polyline(coords).getBounds().pad(.2));
      }, 100);
    }
  }catch{}

  // Lignes en pointillés piéton
  if(planFromPos&&!planFromFixed)
    L.polyline([[planFromPos.lat,planFromPos.lng],[combo.dep.lat,combo.dep.lng]],{color:'#fff',weight:4,dashArray:'6,5',opacity:.5,lineCap:'round'}).addTo(planLayerGroup);
    L.polyline([[planFromPos.lat,planFromPos.lng],[combo.dep.lat,combo.dep.lng]],{color:'#0a84ff',weight:2.5,dashArray:'6,5',opacity:.85,lineCap:'round'}).addTo(planLayerGroup);
  if(planToPos&&!planToFixed)
    L.polyline([[combo.arr.lat,combo.arr.lng],[planToPos.lat,planToPos.lng]],{color:'#fff',weight:4,dashArray:'6,5',opacity:.5,lineCap:'round'}).addTo(planLayerGroup);
    L.polyline([[combo.arr.lat,combo.arr.lng],[planToPos.lat,planToPos.lng]],{color:'#0a84ff',weight:2.5,dashArray:'6,5',opacity:.85,lineCap:'round'}).addTo(planLayerGroup);

}

let _chartComboA=null, _chartComboB=null;

async function showComboCourbes(combo, targetEl=null){
  let zone=targetEl||document.getElementById('plan-courbes-zone');
  if(!zone){
    zone=document.createElement('div');
    zone.id='plan-courbes-zone';
    const card=document.getElementById('plan-results');
    card.appendChild(zone);
  }
  zone.innerHTML='<div class="loader">Chargement des courbes…</div>';

  const nowDate=new Date();
  const dowEl=document.getElementById('plan-dow');
  const hourEl=document.getElementById('plan-hour');
  const targetDow=dowEl&&dowEl.value?parseInt(dowEl.value):nowDate.getDay();
  const targetH2=hourEl&&hourEl.value?parseInt(hourEl.value):nowDate.getHours();
  const today=new Date();
  const promises=[];
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===targetDow) promises.push(fetchDay(d.toISOString().slice(0,10)));
  }
  const allDays=(await Promise.all(promises)).filter(Boolean);

  const bikeType=document.getElementById('plan-type').value; window._planBikeType=bikeType;
  const depKey=bikeType==='elec'?'electrical_bikes':bikeType==='meca'?'mechanical_bikes':'available_bikes';

  const labels=[], depData=[], arrData=[];
  for(let h=0;h<24;h++){
    labels.push(String(h).padStart(2,'0')+'h');
    const dv=[],av=[];
    allDays.forEach(snaps=>{
      snaps.forEach(snap=>{
        const sh=(new Date(getTs(snap)).getUTCHours()+2)%24;
        if(sh!==h) return;
        const sts=getSts(snap);
        const dep=sts.find(s=>s.number===combo.dep.number);
        const arr=sts.find(s=>s.number===combo.arr.number);
        if(dep?.bike_stands) dv.push((dep[depKey]||0)/dep.bike_stands*100);
        if(arr?.bike_stands) av.push(arr.available_bike_stands/arr.bike_stands*100);
      });
    });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
    depData.push(avg(dv));
    arrData.push(avg(av));
  }

  const bikeLabel=bikeType==='elec'?'⚡ Élec':bikeType==='meca'?'🔧 Méca':'🚲 Vélos';
  zone.innerHTML=`
    <div class="card" style="margin-top:0;border-top:none;border-radius:0 0 var(--radius) var(--radius)">
      <div class="card-title">Probabilité sur 24h · ${DOW_NAMES[targetDow]} · ${cleanName(combo.dep.name)} → ${cleanName(combo.arr.name)}</div>
      <canvas id="chart-combo" height="80"></canvas>
    </div>`;

  _chartComboA?.destroy();
  _chartComboA=new Chart(document.getElementById('chart-combo'),{type:'line',
    data:{labels,datasets:[
      {label:`${bikeLabel} dispo au départ`,data:depData,borderColor:'#0a84ff',backgroundColor:'rgba(10,132,255,.08)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
      {label:'🅿️ Place dispo à l\'arrivée',data:arrData,borderColor:'#ff3b30',backgroundColor:'rgba(255,59,48,.06)',borderWidth:2,tension:0,pointRadius:3,spanGaps:true,fill:true},
    ]},
    options:{...chartOpts(),scales:{...chartOpts().scales,y:{...chartOpts().scales.y,max:100,ticks:{...chartOpts().scales.y.ticks,callback:v=>v+'%'}}}}
  });
}

let _chartSD_elec=null, _chartSD_meca=null, _chartSD_hmap=null;

    detailRow.style.display='none';

async function showStationDetail(number, targetEl=null){
  const st=allStations.find(s=>s.number===number);
  if(!st) return;

  // Highlight ligne
  document.querySelectorAll('#lb-body tr').forEach(r=>r.style.background='');
  const row=document.getElementById('lb-row-'+number);
  if(row) row.style.background='rgba(255,255,255,.06)';

  const detail=targetEl || document.getElementById('stats-detail');
  const view=document.getElementById('lb-view')?.value||'day';
  const chartH=window.innerWidth<=640?55:65;
  const chartType=view==='day'?'line':'bar';
  // Détruire les charts AVANT de recréer le DOM
  if(_chartSD_elec){ try{_chartSD_elec.destroy();}catch{} _chartSD_elec=null; }
  if(_chartSD_meca){ try{_chartSD_meca.destroy();}catch{} _chartSD_meca=null; }
  // Détruire aussi tout chart sur l'ancien canvas si présent
  const oldCanvas=document.getElementById('sd-combined-'+number);
  if(oldCanvas){ const existing=Chart.getChart(oldCanvas); if(existing) existing.destroy(); }
  const isMob=window.innerWidth<=640;
  detail.innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
    
    '<div style="min-width:0"><div style="font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+cleanName(st.name)+'</div>'+
    '<div style="font-size:11px;color:var(--sub);margin-top:2px">⚡'+st.electrical_bikes+' · 🔧'+st.mechanical_bikes+' · 🅿️'+st.available_bike_stands+'</div></div></div>'+
    // Slide tabs
    '<div id="sd-tabs-'+number+'" style="display:flex;gap:0;background:rgba(255,255,255,.06);border-radius:10px;padding:2px;margin-bottom:8px">'+
    '<div class="sd-tab on" onclick="renderSDSlide(0,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.14);border-radius:8px;cursor:pointer">🚲 Vélos</div>'+
    '<div class="sd-tab" onclick="renderSDSlide(1,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:var(--sub);border-radius:8px;cursor:pointer">↕ Mvts</div>'+
    '<div class="sd-tab" onclick="renderSDSlide(2,'+number+')" style="flex:1;text-align:center;padding:5px 4px;font-size:10px;font-weight:600;color:var(--sub);border-radius:8px;cursor:pointer">⚖️ Solde</div>'+
    '</div>'+
    '<div id="sd-legend-'+number+'" style="display:flex;gap:10px;font-size:10px;color:var(--sub);margin-bottom:4px"></div>'+
    '<div style="position:relative;height:'+(isMob?120:150)+'px"><canvas id="sd-combined-'+number+'" style="position:absolute;inset:0;width:100%!important;height:100%!important"></canvas></div>'+
    '<div id="sd-dots-'+number+'" style="display:flex;justify-content:center;gap:4px;padding:6px 0 2px">'+
    '<div class="sd-dot on" style="height:3px;width:14px;border-radius:2px;background:#34c759;transition:all .2s;display:inline-block"></div>'+
    '<div class="sd-dot" style="height:3px;width:5px;border-radius:2px;background:#38383a;transition:all .2s;display:inline-block"></div>'+
    '<div class="sd-dot" style="height:3px;width:5px;border-radius:2px;background:#38383a;transition:all .2s;display:inline-block"></div>'+
    '</div>'+
    '<div id="sd-stats-row" style="display:flex;gap:8px;margin-top:6px"></div>';



  // ── Chargement des données selon la vue ──
  const d=document.getElementById('lb-date').value;
  const mth=document.getElementById('lb-month')?.value;
  const yr=document.getElementById('lb-year')?.value;

  // Fonction utilitaire : charge et agrège les snapshots d'une liste de dates
  async function loadSnapsByDate(dates){
    const BATCH=16;
    const result=[];
    for(let i=0;i<dates.length;i+=BATCH){
      const batch=dates.slice(i,i+BATCH);
      const res=await Promise.all(batch.map(dt=>fetchDay(dt).catch(()=>null)));
      res.forEach((snaps,j)=>{ if(snaps) result.push({date:batch[j],snaps}); });
    }
    return result;
  }

  let labels=[], dataElec=[], dataMeca=[], dataMvts=[], dataSolde=[];

  if(view==='day'){
    if(!d) return;
    const snaps=await fetchDay(d)||[];
    let prevMvts=null;
    snaps.forEach(snap=>{
      const sts=getSts(snap), st2=sts.find(x=>x.number===number);
      if(!st2) return;
      const t=new Date(getTs(snap));
      labels.push(t.getMinutes()===0?t.getHours()+'h':'');
      dataElec.push(st2.electrical_bikes||0);
      dataMeca.push(st2.mechanical_bikes||0);
      // Mouvements = delta sur available_bikes (proxy)
      const total=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
      if(prevMvts!==null){ dataMvts.push(Math.abs(total-prevMvts)); dataSolde.push(total-prevMvts); }
      else { dataMvts.push(0); dataSolde.push(0); }
      prevMvts=total;
    });
  } else if(view==='month'){
    if(!mth) return;
    const [y,mo]=mth.split('-').map(Number);
    const daysInMonth=new Date(y,mo,0).getDate();
    const today=new Date().toISOString().slice(0,10);
    const dates=[];
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(ds<=today) dates.push(ds);
    }
    const loaded=await loadSnapsByDate(dates);
    for(let day=1;day<=daysInMonth;day++){
      const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      labels.push(day+'');
      const entry=loaded.find(x=>x.date===ds);
      if(!entry||!entry.snaps.length){ dataElec.push(null);dataMeca.push(null);dataMvts.push(null);dataSolde.push(null);continue; }
      let eSum=0,mSum=0,cnt=0,mvtsSum=0;
      let firstTotal=null,lastTotal=null;
      entry.snaps.forEach(snap=>{
        const st2=getSts(snap).find(x=>x.number===number);
        if(!st2) return;
        eSum+=st2.electrical_bikes||0; mSum+=st2.mechanical_bikes||0; cnt++;
        const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
        if(firstTotal===null) firstTotal=tot;
        lastTotal=tot;
      });
      // Mouvements jour = somme des variations absolues entre snapshots
      let prevT=null;
      entry.snaps.forEach(snap=>{
        const st2=getSts(snap).find(x=>x.number===number);
        if(!st2) return;
        const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
        if(prevT!==null) mvtsSum+=Math.abs(tot-prevT);
        prevT=tot;
      });
      dataElec.push(cnt?Math.round(eSum/cnt):null);
      dataMeca.push(cnt?Math.round(mSum/cnt):null);
      dataMvts.push(Math.round(mvtsSum));
      // Solde = vélos nets arrivés dans la journée (entrées - sorties)
      let entrees=0,sorties=0,prevSolde=null;
      entry.snaps.forEach(snap=>{
        const st2b=getSts(snap).find(x=>x.number===number);
        if(!st2b) return;
        const tot=(st2b.electrical_bikes||0)+(st2b.mechanical_bikes||0);
        if(prevSolde!==null){ const d=tot-prevSolde; if(d>0)entrees+=d; else sorties+=d; }
        prevSolde=tot;
      });
      dataSolde.push(entrees+sorties);
    }
  } else {
    if(!yr) return;
    const today=new Date().toISOString().slice(0,10);
    const MONTHS=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
    // Précharger tous les jours de l'année en parallèle
    const allDatesYear=[];
    for(let mo=1;mo<=12;mo++){
      const daysInM=new Date(yr,mo,0).getDate();
      for(let day=1;day<=daysInM;day++){
        const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        if(ds<=today) allDatesYear.push(ds);
      }
    }
    const allLoadedYear=await loadSnapsByDate(allDatesYear);
    const byDate={};
    allLoadedYear.forEach(({date,snaps})=>{ byDate[date]={snaps}; });
    for(let mo=1;mo<=12;mo++){
      labels.push(MONTHS[mo-1]);
      const daysInM=new Date(yr,mo,0).getDate();
      const monthDates=[];
      for(let day=1;day<=daysInM;day++){
        const ds=yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        if(ds<=today) monthDates.push(ds);
      }
      if(!monthDates.length){ dataElec.push(null);dataMeca.push(null);dataMvts.push(null);dataSolde.push(null);continue; }
      const loaded=monthDates.map(ds=>byDate[ds]).filter(Boolean);
      let eSum=0,mSum=0,cnt=0,mvtsTotal=0,soldeTotal=0;
      loaded.forEach(({snaps})=>{
        let prevT=null,firstT=null,lastT=null;
        snaps.forEach(snap=>{
          const st2=getSts(snap).find(x=>x.number===number);
          if(!st2) return;
          eSum+=st2.electrical_bikes||0; mSum+=st2.mechanical_bikes||0; cnt++;
          const tot=(st2.electrical_bikes||0)+(st2.mechanical_bikes||0);
          if(firstT===null) firstT=tot; lastT=tot;
          if(prevT!==null) mvtsTotal+=Math.abs(tot-prevT);
          prevT=tot;
        });
        // Solde journée = entrées nettes
        let ent=0,sor=0,prevSol=null;
        snaps.forEach(snap=>{
          const st2b=getSts(snap).find(x=>x.number===number);
          if(!st2b) return;
          const tot=(st2b.electrical_bikes||0)+(st2b.mechanical_bikes||0);
          if(prevSol!==null){ const d=tot-prevSol; if(d>0)ent+=d; else sor+=d; }
          prevSol=tot;
        });
        soldeTotal+=(ent+sor);
      });
      dataElec.push(cnt?Math.round(eSum/cnt):null);
      dataMeca.push(cnt?Math.round(mSum/cnt):null);
      dataMvts.push(Math.round(mvtsTotal/Math.max(1,loaded.length)));
      dataSolde.push(Math.round(soldeTotal/Math.max(1,loaded.length)));
    }
  }

  // ── Slide tabs ──
  window._sdData={labels,dataElec,dataMeca,dataMvts,dataSolde,number,view};
  window._sdSlide=0; // reset slide à chaque nouvelle station
  renderSDSlide(0, number);
} // fin showStationDetail
