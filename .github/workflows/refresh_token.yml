name: Refresh Token JCDecaux

on:
  schedule:
    - cron: '*/30 * * * *'  # toutes les 30 min (marge fiable vs latence/delai GH Actions)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh JWT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Refresh token
        run: python refresh_token.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/token.json
          git diff --staged --quiet && exit 0
          git commit -m "token: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
