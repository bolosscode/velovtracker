name: Bootstrap historique Vélo'v

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bootstrap-continue]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Import historique
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Créer/rejoindre branche bootstrap
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin history-bootstrap; then
            git checkout history-bootstrap
            git pull origin history-bootstrap
          else
            git checkout -b history-bootstrap
          fi

      - name: Détecter la reprise
        id: resume
        run: |
          # Chercher le dernier fichier BOOTSTRAPPÉ (avant 2026, collect.py écrit les fichiers récents)
          # On prend le dernier fichier antérieur à 2026 pour éviter de skipper à cause des fichiers collect
          LAST=$(ls data/history/2023-*.json data/history/2024-*.json data/history/2025-*.json 2>/dev/null | sort | tail -1 | xargs -I{} basename {} .json || true)
          echo "last_date=${LAST}" >> $GITHUB_OUTPUT
          echo "Dernier fichier bootstrappé : ${LAST:-aucun}"

      - name: Import historique
        id: import
        env:
          GL_USER:     ${{ secrets.GL_USER }}
          GL_PASSWORD: ${{ secrets.GL_PASSWORD }}
        run: |
          ARGS=""
          [ -n "${{ secrets.GL_USER }}" ]     && ARGS="$ARGS --user ${{ secrets.GL_USER }}"
          [ -n "${{ secrets.GL_PASSWORD }}" ] && ARGS="$ARGS --password ${{ secrets.GL_PASSWORD }}"
          LAST="${{ steps.resume.outputs.last_date }}"
          [ -n "$LAST" ] && ARGS="$ARGS --resume-after $LAST"
          echo "Lancement : python bootstrap.py $ARGS"
          python bootstrap.py $ARGS
          if [ -f done.txt ]; then
            echo "finished=true" >> $GITHUB_OUTPUT
          else
            echo "finished=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit sur branche bootstrap
        run: |
          git add data/history/
          git diff --staged --quiet && echo "Rien à commiter" && exit 0
          COUNT=$(ls data/history/*.json 2>/dev/null | wc -l || echo 0)
          git commit -m "bootstrap: ${COUNT} jours $(date -u '+%Y-%m-%d %H:%M')"
          git push -f origin history-bootstrap

      - name: Merge dans main
        run: |
          git checkout main
          git pull origin main
          git merge history-bootstrap \
            --no-ff \
            -m "bootstrap: merge $(date -u '+%Y-%m-%d')" \
            -X theirs
          git push origin main

      - name: Relance si pas terminé
        if: steps.import.outputs.finished == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=bootstrap-continue
