name: Bootstrap historique Vélo'v

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bootstrap-continue]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Import historique
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rejoindre/créer branche bootstrap
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin history-bootstrap; then
            git checkout history-bootstrap
            git pull origin history-bootstrap
          else
            git checkout -b history-bootstrap
          fi

      - name: Import historique (100 min max)
        env:
          GL_USER:     ${{ secrets.GL_USER }}
          GL_PASSWORD: ${{ secrets.GL_PASSWORD }}
        run: |
          ARGS="--max-minutes 100"
          [ -n "$GL_USER" ]     && ARGS="$ARGS --user $GL_USER"
          [ -n "$GL_PASSWORD" ] && ARGS="$ARGS --password $GL_PASSWORD"
          python bootstrap.py $ARGS

      - name: Commit & push sur branche bootstrap
        run: |
          git add data/history/ data/bootstrap_state.json || true
          git diff --staged --quiet && echo "Rien à commiter" && exit 0
          COUNT=$(ls data/history/*.json 2>/dev/null | wc -l || echo 0)
          git commit -m "bootstrap: ${COUNT} jours $(date -u '+%Y-%m-%d %H:%M')"
          git push -f origin history-bootstrap

      - name: Merge dans main
        run: |
          git checkout main
          git pull origin main
          git merge history-bootstrap \
            --no-ff \
            -m "bootstrap: merge $(date -u '+%Y-%m-%d')" \
            -X theirs
          git push origin main

      - name: Relance si pas terminé
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f done.txt ]; then
            STATE=$(python3 -c "import json;s=json.load(open('data/bootstrap_state.json'));print(s.get('finished',False))" 2>/dev/null || echo "False")
            if [ "$STATE" != "True" ]; then
              echo "Relance dans 60s…"
              sleep 60
              gh api repos/${{ github.repository }}/dispatches -f event_type=bootstrap-continue
            fi
          fi
