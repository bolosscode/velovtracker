name: Bootstrap historique Vélo'v

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Import historique
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Import historique
        env:
          GL_USER:     ${{ secrets.GL_USER }}
          GL_PASSWORD: ${{ secrets.GL_PASSWORD }}
        run: |
          ARGS=""
          [ -n "$GL_USER" ]     && ARGS="$ARGS --user $GL_USER"
          [ -n "$GL_PASSWORD" ] && ARGS="$ARGS --password $GL_PASSWORD"
          python bootstrap.py $ARGS

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --staged --quiet || git commit -m "bootstrap: historique Vélo'v $(date -u '+%Y-%m-%d')"
          git push
