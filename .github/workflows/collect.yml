name: Collecte Vélo'v

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    name: Stations + Vélos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Collecter stations
        env:
          STATION_IDS: ${{ vars.STATION_IDS }}
        run: python collect.py
        continue-on-error: true

      - name: Collecter vélos
        run: python collect_bikes.py
        continue-on-error: true

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git fetch origin main
          git rebase -X ours origin/main
          git pull origin main --rebase -X ours
          git push

      - name: Déclencher déploiement Pages
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
        continue-on-error: true
