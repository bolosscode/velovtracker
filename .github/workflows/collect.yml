name: Collecte Vélo'v

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    name: JCDecaux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Collecter
        run: python collect_bikes.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bikes/latest.json data/bikes/today.json data/latest.json data/today.json
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git fetch origin main
          git push origin HEAD:main --force-with-lease=main:origin/main
