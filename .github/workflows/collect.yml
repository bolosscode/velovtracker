name: Collecte Vélo'v

on:
  schedule:
    # Toutes les 10 minutes (minimum GitHub Actions)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  collect:
    name: Fetch & commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Collecter les données Grand Lyon
        env:
          # Définissez cette variable dans Settings > Variables > Actions
          # ex. "10002,10003,10007,10008,10015,10020,10025,10030"
          # Laisser vide pour collecter toutes les stations Lyon
          STATION_IDS: ${{ vars.STATION_IDS }}
        run: python collect.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
