name: Collecte Vélo'v

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-stations:
    name: Stations Grand Lyon
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collecter les stations
        env:
          STATION_IDS: ${{ vars.STATION_IDS }}
        run: python collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-stations
          path: data/
          retention-days: 1

  collect-bikes:
    name: Vélos JCDecaux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install requests playwright
          playwright install chromium --with-deps
      - name: Collecter les vélos
        run: python collect_bikes.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-bikes
          path: data/
          retention-days: 1

  commit:
    name: Commit & push
    needs: [collect-stations, collect-bikes]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download stations artifact
        uses: actions/download-artifact@v4
        with:
          name: data-stations
          path: data/
        continue-on-error: true
      - name: Download bikes artifact
        uses: actions/download-artifact@v4
        with:
          name: data-bikes
          path: data/
        continue-on-error: true
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
