name: Consolidation quotidienne

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date a consolider (YYYY-MM-DD, vide = automatique)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  consolidate:
    name: Consolider & rattraper les jours manquants
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Consolider les jours manquants
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          python - << 'PYEOF'
          import os, subprocess, sys
          from datetime import date, timedelta
          from pathlib import Path

          out_dir = Path("data/history")
          out_dir.mkdir(parents=True, exist_ok=True)

          input_date = os.environ.get("INPUT_DATE", "").strip()

          if input_date:
            dates_to_run = [date.fromisoformat(input_date)]
          else:
            start = date(2025, 1, 29)
            yesterday = date.today() - timedelta(days=1)
            dates_to_run = []
            d = start
            while d <= yesterday:
              exists = (out_dir / f"{d}.json").exists() or (out_dir / f"{d}.json.gz").exists()
              if not exists:
                dates_to_run.append(d)
              d += timedelta(days=1)

          if not dates_to_run:
            print("Tous les jours sont deja consolides")
            sys.exit(0)

          print(f"{len(dates_to_run)} jour(s) a consolider : {dates_to_run[0]} -> {dates_to_run[-1]}")

          errors = []
          for target_date in dates_to_run:
            print(f"=== {target_date} ===", flush=True)
            cmd = [sys.executable, "consolidate.py", "--date", str(target_date), "--out", str(out_dir)]
            result = subprocess.run(cmd)
            if result.returncode != 0:
              errors.append(target_date)

          if errors:
            print(f"{len(errors)} erreur(s) : {errors}", flush=True)
            sys.exit(1)
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "consolidate: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git pull origin main --rebase -X ours
          git push
